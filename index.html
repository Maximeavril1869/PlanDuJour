<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan du jour</title>
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan du jour">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --bg: #f3f5f4; --card: #ffffff; --ink: #16211f; --muted: #5d6b68; --line: #dfe5e3;
  --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #e0f2ef;
  --warn-bg: #fff6e0; --warn-ink: #7a4b00; --err: #b42318; --info-bg: #e8f1fb; --info-ink: #1d4670;
  --trip: #e6ebe9; --fix: #fde4bf; --fix-line: #e0a14a;
  --tabbar-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1514; --card: #172120; --ink: #e8f0ee; --muted: #9fb0ac; --line: #26332f;
    --accent: #2dd4bf; --accent-ink: #04201c; --accent-soft: #123a35;
    --warn-bg: #2b2410; --warn-ink: #f5d58a; --err: #ff8a80; --info-bg: #14283a; --info-ink: #a9cdf0;
    --trip: #202c29; --fix: #4a3715; --fix-line: #d9992f;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
header.app-header { padding: 20px 16px 8px; max-width: 720px; margin: 0 auto; }
header.app-header h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
header.app-header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
main { max-width: 720px; margin: 0 auto; padding: 8px 16px calc(var(--tabbar-h) + 110px + env(safe-area-inset-bottom)); }
[hidden] { display: none !important; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
.card h2 { margin: 0 0 4px; font-size: 17px; }
.card .help { margin: 0 0 10px; color: var(--muted); font-size: 14px; }

.banner { border-radius: 12px; padding: 10px 14px; margin: 12px 0; font-size: 14px; }
.banner.info { background: var(--info-bg); color: var(--info-ink); }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
.banner ul { margin: 6px 0 0; padding-left: 18px; }

/* Récapitulatif */
.tl { list-style: none; margin: 8px 0 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 116px 18px 1fr; align-items: start; padding: 6px 0; }
.tl .t { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; padding-right: 6px; white-space: nowrap; }
.tl .dot { position: relative; align-self: stretch; }
.tl .dot::before { content: ""; position: absolute; left: 8px; top: 0; bottom: -12px; width: 2px; background: var(--line); }
.tl li:last-child .dot::before { display: none; }
.tl .dot::after { content: ""; position: absolute; left: 3px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.tl .what { padding-left: 6px; }
.tl .what small { display: block; color: var(--muted); font-size: 13px; }
.tl li.gapli .t { font-weight: 500; color: var(--accent); }
.tl li.gapli .dot::after { background: var(--card); border: 2px solid var(--accent); width: 12px; height: 12px; }
.tl li.gapli .what { color: var(--accent); font-size: 14px; }
.tl li.mark .t, .tl li.mark .what { color: var(--muted); }
.tl li.mark .dot::after { background: var(--muted); }
.rows { list-style: none; margin: 8px 0 0; padding: 0; }
.rows li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.rows li:first-child { border-top: 0; }
.rows .v { color: var(--muted); text-align: right; }

/* Formulaire */
.field { display: block; margin: 10px 0; }
.lbl { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
input[type=text], input[type=date], select {
  width: 100%; min-height: 44px; padding: 8px 12px; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; -webkit-appearance: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
input[aria-invalid=true] { border-color: var(--err); }
.err { display: block; color: var(--err); font-size: 13px; margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.act-row { border-top: 1px solid var(--line); padding: 10px 0 4px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 12px; position: relative; }
.act-row:first-child { border-top: 0; }
.act-row .wide { grid-column: 1 / -1; }
.act-row .first { padding-right: 52px; }
.act-row .err { margin-bottom: 6px; }
.act-row .del { position: absolute; right: 0; top: 30px; }
.act-row[data-mode=free] .timed { display: none; }
.tpl-row { border-top: 1px solid var(--line); padding: 10px 0 4px; position: relative; }
.tpl-row:first-child, .tplgroup + .tpl-row, .tplgroup + .act-row { border-top: 0; }
.tpl-row .wide { grid-column: 1 / -1; }
.tpl-row .del { position: absolute; right: 0; top: 2px; }
.tpl-row .rowfold > summary { padding-right: 52px; }
.tplgroup { margin: 14px 0 2px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.tpl-row .chk { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; }
.tpl-row .err { margin-bottom: 6px; }
#bp-edit .act-row { border-top: 0; padding-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-width: 52px; min-height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button { font: inherit; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--err); }
.btn.small { min-height: 36px; padding: 0 12px; }
.btn:disabled { opacity: .5; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.icon-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 18px; }
.foot { color: var(--muted); font-size: 13px; text-align: center; margin: 18px 0; }
.foot .btn { margin-bottom: 14px; }

/* Barres fixes */
.savebar {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  background: var(--card); border-top: 1px solid var(--line); padding: 8px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 4;
}
.savebar .msg { font-size: 14px; color: var(--muted); }
.savebar .msg.dirty { color: var(--warn-ink); font-weight: 600; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5;
}
.tabbar button { height: var(--tabbar-h); border: 0; background: none; color: var(--muted); font-size: 14px; padding: 0 2px; }
.tabbar button[aria-selected=true] { color: var(--accent); font-weight: 700; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 76px + env(safe-area-inset-bottom));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 22px; font-size: 14px; z-index: 6; max-width: 90vw;
}
.toast.err { background: var(--err); color: #fff; }

/* Jour */
.daynav { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 10px; gap: 8px; }
.daylabel { font-weight: 700; font-size: 18px; text-align: center; flex: 1; }
.daytools { display: flex; gap: 10px; margin-bottom: 4px; }
.daytools .btn { flex: 1; }
.runbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--accent); color: var(--accent-ink);
  border-radius: 14px; padding: 10px 14px; margin: 10px 0; }
.runbar small { display: block; opacity: .85; }
.runbar .btn { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); font-weight: 600; }
.tlwrap { position: relative; margin: 14px 0 0 46px; }
.tlarea { position: relative; }
.hline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); z-index: 0; }
.hline span { position: absolute; left: -46px; top: -9px; width: 40px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.marker { position: absolute; left: 0; right: 0; border-top: 2px solid var(--muted); font-size: 12px; color: var(--muted); z-index: 1; }
.marker span { position: absolute; right: 0; top: 2px; }
.gap { position: absolute; left: 0; right: 0; border-left: 3px dotted var(--accent); z-index: 1; color: var(--accent); font-size: 12px; padding-left: 8px; display: flex; align-items: center; }
.blk { position: absolute; display: flex; flex-direction: column; justify-content: flex-start; text-align: left; font: inherit; color: var(--ink);
  border: 0; border-radius: 8px; padding: 3px 8px; overflow: hidden; line-height: 1.2; margin: 1px 0; z-index: 2; }
.blk .bn { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .bt { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.short { flex-direction: row; align-items: center; gap: 8px; padding-top: 0; padding-bottom: 0; }
.b-fixed { background: var(--fix); border-left: 4px solid var(--fix-line); }
.b-flex { background: var(--accent-soft); border-left: 4px solid var(--accent); }
.b-free { background: var(--accent-soft); border-left: 4px dashed var(--accent); }
.b-done { opacity: .6; }
.b-done .bn { text-decoration: line-through; }
.b-running { outline: 2px solid var(--accent); }
.hours-help { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.act-row .chk { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; }
.chk input, .subchk input { width: 22px; height: 22px; flex: none; accent-color: var(--accent); }
.subh { margin: 14px 0 6px; font-size: 15px; }
.child-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.child-row input { flex: 1; min-width: 0; }
.stsub { list-style: none; margin: 4px 0 2px; padding: 0 0 0 14px; font-size: 14px; color: var(--muted); }
.stsub li { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; border: 0; }
.kids { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.workbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; margin: 10px 0; }
.workbar strong { font-size: 18px; }
.workbar small { display: block; color: var(--muted); }
.workbar.over { background: var(--warn-bg); color: var(--warn-ink); }
.cat-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.cat-row input[type=text] { flex: 1; min-width: 140px; }
.cat-row .chk { display: flex; align-items: center; gap: 6px; }
.cat-row .err { flex-basis: 100%; }
.kidbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.rows li small.sub { color: var(--muted); }
.childbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.subs { list-style: none; margin: 0 0 8px; padding: 0; }
.subs li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.subs li:first-child { border-top: 0; }
.subchk { display: flex; align-items: center; gap: 12px; flex: 1; min-height: 44px; }
.subtxt small { display: block; color: var(--muted); font-size: 13px; }
.sublabel.done { text-decoration: line-through; color: var(--muted); }
.rv-head { display: flex; width: 100%; justify-content: space-between; align-items: center; min-height: 44px; padding: 0; border: 0; background: none; color: var(--ink); text-align: left; font-size: 16px; }
.rows li.rvi { display: block; }
.rvi small { display: block; color: var(--muted); font-size: 13px; }
.rvbtn { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.profsel { margin: 8px 0 4px; }
.rows li.strow { display: block; }
.stline { display: flex; justify-content: space-between; gap: 12px; }
.bar { height: 8px; margin-top: 6px; border-radius: 4px; background: var(--accent-soft); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.stnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0; }
.stnav .lab { flex: 1; text-align: center; font-weight: 700; }
.imp { border: 2px solid var(--accent); border-radius: 12px; padding: 10px 14px; margin-top: 12px; }
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "▾"; color: var(--muted); }
details.fold[open] > summary::after { content: "▴"; }
details.fold > summary h2 { margin: 0; }
.rowfold { grid-column: 1 / -1; }
.rowfold > summary { display: flex; align-items: center; min-height: 48px; padding-right: 52px; cursor: pointer; }
.rowfold > summary { list-style: none; }
.rowfold > summary::-webkit-details-marker { display: none; }
.rowfold > summary::after { content: "▾"; margin-left: auto; padding: 0 8px; color: var(--muted); font-size: 18px; }
.rowfold[open] > summary::after { content: "▴"; }
.rowfold .sumtxt strong { display: block; }
.rowfold .sumtxt small { display: block; color: var(--muted); font-size: 13px; }
.leave-per { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 0 12px; align-items: end; padding: 4px 0 8px; }
.leave-per .err { grid-column: 1 / -1; }
.rowgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 12px; padding-top: 4px; }
.act-row[data-fold] .del { top: 2px; }
.card h2 .v { font-weight: 400; font-size: 14px; }
.card.pick { border-color: var(--accent); border-width: 2px; }
.pickrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
input[type=date] { min-width: 0; max-width: 100%; }
.pickrow input[type=date] { width: auto; flex: 1 1 150px; }
</style>
</head>
<body>
<header class="app-header">
  <h1>Plan du jour</h1>
  <p id="subtitle">Ton plan, recalé selon la réalité.</p>
</header>

<main>
  <section id="panel-day" role="tabpanel" aria-labelledby="tab-day">
    <div id="day-head"></div>
    <form id="block-panel" class="card" hidden novalidate autocomplete="off">
      <h2 id="bp-title">Bloc</h2>
      <div id="bp-edit"></div>
      <p class="help" id="bp-planned"></p>
      <div id="bp-real" class="grid2">
        <label class="field"><span class="lbl">Début réel</span><input type="text" id="bp-real-start" inputmode="numeric" autocomplete="off" placeholder="HH:MM" data-kind="time"></label>
        <label class="field"><span class="lbl">Fin réelle</span><input type="text" id="bp-real-end" inputmode="numeric" autocomplete="off" placeholder="HH:MM" data-kind="time"></label>
      </div>
      <div id="bp-children" hidden>
        <h3 class="subh">Sous-activités</h3>
        <div class="childbtns" id="bp-child-btns"></div>
        <ul class="subs" id="bp-seg-list"></ul>
        <label class="field"><span class="lbl">Ajouter un temps à la main</span><select id="seg-child"></select></label>
        <div class="grid2">
          <label class="field"><span class="lbl">Début</span><input type="text" id="seg-start" inputmode="numeric" autocomplete="off" placeholder="HH:MM" data-kind="time"></label>
          <label class="field"><span class="lbl">Fin</span><input type="text" id="seg-end" inputmode="numeric" autocomplete="off" placeholder="HH:MM" data-kind="time"></label>
        </div>
        <button type="button" class="btn small" data-bp="add-seg">+ Ajouter ce temps</button>
      </div>
      <div id="bp-subs">
        <h3 class="subh">Sous-tâches <span id="bp-subs-count"></span></h3>
        <ul class="subs" id="bp-subs-list"></ul>
        <div class="grid2">
          <label class="field"><span class="lbl">Libellé</span><input type="text" id="sub-label" maxlength="80" autocomplete="off"></label>
          <label class="field"><span class="lbl">Action courte</span><input type="text" id="sub-action" maxlength="80" autocomplete="off"></label>
        </div>
        <button type="button" class="btn small" data-bp="add-sub">+ Ajouter la sous-tâche</button>
      </div>
      <span class="err" id="bp-err" hidden></span>
      <div class="btnrow">
        <button type="submit" class="btn primary" id="bp-save">Enregistrer</button>
        <button type="button" class="btn" data-bp="start" id="bp-start">▶ Démarrer maintenant</button>
        <button type="button" class="btn" data-bp="stop" id="bp-stop">■ Arrêter maintenant</button>
        <button type="button" class="btn" data-bp="clear" id="bp-clear">Effacer les heures réelles</button>
        <button type="button" class="btn" data-bp="close">Fermer</button>
        <button type="button" class="btn danger" data-bp="delete" id="bp-del">Supprimer</button>
      </div>
    </form>
    <div id="day-timeline"></div>
  </section>

  <section id="panel-recap" role="tabpanel" aria-labelledby="tab-recap" hidden></section>

  <section id="panel-stats" role="tabpanel" aria-labelledby="tab-stats" hidden></section>

  <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
    <form id="settings-form" novalidate autocomplete="off">
      <div id="form-body"></div>
      <div class="savebar">
        <span class="msg" id="dirty-msg">Aucune modification</span>
        <button type="submit" class="btn primary" id="save-btn">Enregistrer</button>
      </div>
    </form>
  </section>
</main>

<nav class="tabbar" role="tablist" aria-label="Navigation">
  <button type="button" role="tab" id="tab-day" data-tab="day" aria-selected="true">Jour</button>
  <button type="button" role="tab" id="tab-recap" data-tab="recap" aria-selected="false">Récapitulatif</button>
  <button type="button" role="tab" id="tab-stats" data-tab="stats" aria-selected="false">Stats</button>
  <button type="button" role="tab" id="tab-settings" data-tab="settings" aria-selected="false">Réglages</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">Cette app a besoin de JavaScript.</p></noscript>

<script>
(function () {
'use strict';

// ==== 1. CONFIG ====
const APP_VERSION = '0.15.4';          // identique à VERSION dans sw.js (CONVENTIONS.md §10)
const DEFAULT_CARRY = ['act-sax', 'act-menage', 'act-concentration'];   // « À reporter » coché par défaut (réglages sans ce champ)
const DATA_VERSION = 3;               // réglages : 1 = lot 1, 2 = lot 2, 3 = activités uniques
const STORAGE_KEY = 'plandujour.reglages';
const DAYS_KEY = 'plandujour.jours';
const DAYS_VERSION = 2;               // jours : 1 = lot 2, 2 = heures réelles par bloc
const KEEP_DAYS = 400;                // les jours plus anciens sont purgés à l'enregistrement
const DAY_NAMES = ['', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const DAY_SHORT = ['', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
const MODES = { fixed: 'Heure fixe', flex: 'Heure prévue, glisse si retard', free: 'Sans heure (je la lance quand je veux)' };
const MODE_TAG = { fixed: 'heure fixe', flex: 'souple', free: 'sans heure' };

// ==== 2. TEMPS ====
// Minutes depuis minuit en interne ; « HH:MM » en 24 h à l'écran (CONVENTIONS.md §5).
function parseTime(text) {
  if (typeof text !== 'string') return null;
  const t = text.trim().toLowerCase().replace(/\s+/g, '').replace('h', ':');
  const m = /^(\d{1,2}):?(\d{2})?$/.exec(t);
  if (!m) return null;
  const h = Number(m[1]);
  const min = m[2] === undefined ? 0 : Number(m[2]);
  if (h > 23 || min > 59) return null;
  return h * 60 + min;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function formatTime(minutes) { return pad2(Math.floor(minutes / 60)) + ':' + pad2(minutes % 60); }
function formatDuration(minutes) {
  const h = Math.floor(minutes / 60), m = minutes % 60;
  if (h === 0) return m + ' min';
  return m === 0 ? h + ' h' : h + ' h ' + pad2(m);

function loadDays() {

    text = window.localStorage.getItem(DAYS_KEY);
    if (text === null) return emptyDays();
    const clean = sanitizeDays(JSON.parse(text));
    if (clean) return clean;
  } catch (e) { /* illisible */ }
  try { if (text !== null) window.localStorage.setItem(DAYS_KEY + '.sauvegarde', text); } catch (e) { /* ignoré */ }

}
function saveDays(data) {
  try {
    const limit = addDays(dateKey(new Date()), -KEEP_DAYS);
    Object.keys(data.days).forEach((k) => { if (k < limit) delete data.days[k]; });
    window.localStorage.setItem(DAYS_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    return false;
  }
}

// ==== 5. VALIDATION ====
function setPath(obj, path, value) {
  const keys = path.split('.');
  const last = keys.pop();
  keys.reduce((o, k) => o[k], obj)[last] = value;
}

// ==== 5B. PLANNING ====
// Fonctions pures : (réglages, données du jour, jour de semaine, heure actuelle) → journée. Aucun accès au DOM ni au stockage.
function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseDateKey(k) { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(k, n) { const d = parseDateKey(k); d.setDate(d.getDate() + n); return dateKey(d); }
function isoWeekday(k) { const g = parseDateKey(k).getDay(); return g === 0 ? 7 : g; }

// nowMin : minutes actuelles si le jour affiché est aujourd'hui, sinon null.
// past : vrai si le jour affiché est antérieur à aujourd'hui (les blocs « à confirmer » non pointés sont alors tous à confirmer).
// Dernier jour de travail (lundi–vendredi) avant `k` ; veille de la reprise après `k` (reprise = premier lundi–vendredi après `k`).
function lastWorkDay(k) { let d = addDays(k, -1); while (isoWeekday(d) > 5) d = addDays(d, -1); return d; }
function eveOfReturn(k) { let d = addDays(k, 1); while (isoWeekday(d) > 5) d = addDays(d, 1); return addDays(d, -1); }
// Profil du jour : choix explicite, sinon congé si la date est dans une période (il s'impose aux profils), sinon jour de la semaine, sinon le premier.
// Hors congé, le lever du dernier jour de travail avant une période et le coucher de la veille de la reprise sont ajustés.
function resolveProfile(settings, weekday, profileId, date) {
  const list = settings.profiles && settings.profiles.length ? settings.profiles : [makeProfile('prof-defaut', 'Journée', settings.wake, settings.bedtime, [], [])];
  const chosen = profileId ? list.find((p) => p.id === profileId) : null;
  if (chosen) return chosen;
  let prof = inLeave(settings, date) ? leaveProfile(settings) : (list.find((p) => p.days.includes(weekday)) || list[0]);
  if (date && settings.leave) {
    const l = settings.leave;
    let wake = prof.wake, bed = prof.bedtime, note = null;
    l.periods.forEach((per) => {
      if (l.lastWake !== null && lastWorkDay(per.from) === date) { wake = l.lastWake; note = 'Dernier jour de travail avant le congé : lever à ' + formatTime(l.lastWake) + '.'; }
      if (l.returnBedtime !== null && eveOfReturn(per.to) === date) { bed = l.returnBedtime; note = 'Veille de la reprise après le congé : coucher à ' + formatTime(l.returnBedtime) + '.'; }
    });
    if (wake !== prof.wake || bed !== prof.bedtime) prof = Object.assign({}, prof, { wake: wake, bedtime: bed, note: note });
  }
  return prof;
}

function buildDay(settings, dayData, weekday, nowMin, past, date) {
  const prof = resolveProfile(settings, weekday, dayData.profile, date);
  const out = { profile: prof, placed: [], pending: [], gaps: [], warnings: [], running: null, largestGap: 0, toConfirm: [], missed: [], reopen: [], relax: null, review: [], reviewed: [] };
  const items = [];
  settings.activities.forEach((a) => {
    if (a.days.includes(weekday) && !prof.removes.includes(a.id)) items.push({ key: 'act:' + a.id, id: a.id, kind: 'act', name: a.name, mode: a.mode, entry: a.entry, confirm: a.confirm === true, carry: a.carry === true, cat: a.cat || null, parallel: a.parallel === true, noCal: a.noCal === true, alarm: a.alarm === undefined ? null : a.alarm, children: a.children || [], from: null, plannedStart: a.mode === 'free' ? null : a.start, minutes: a.duration });
  });
  dayData.ponctuels.forEach((p) => {
    items.push({ key: 'p:' + p.id, id: p.id, kind: 'p', name: p.name, mode: p.mode, entry: p.entry, confirm: p.confirm === true, carry: p.carry === true, cat: p.cat || null, alarm: p.alarm === undefined ? null : p.alarm, parallel: p.parallel === true, noCal: p.noCal === true, children: [], from: p.from || null, plannedStart: p.mode === 'free' ? null : p.start, minutes: p.duration });
  });
  const timed = [];
  items.forEach((it) => {
    it.real = dayData.real[it.key] || { start: null, end: null };
    it.subs = (dayData.subtasks && dayData.subtasks[it.key]) || [];
    it.review = (dayData.review && dayData.review[it.key]) || null;
    it.segs = (dayData.segs && dayData.segs[it.key]) || [];
    if (it.segs.length && !it.real.missed) {         // bloc à sous-activités : ses heures viennent des temps chronométrés
      const open = it.segs.some((g) => g.end === null);
      it.real = { start: Math.min.apply(null, it.segs.map((g) => g.start)), end: open ? null : Math.max.apply(null, it.segs.map((g) => g.end)) };
    }
    if (it.real.missed) out.missed.push(it);                      // raté : le bloc quitte le plan et libère son temps
    else if (it.mode === 'free' && it.real.start === null) out.pending.push(it);
    else timed.push(it);
  });
  timed.forEach((it) => { it.sortKey = it.real.start !== null ? it.real.start : it.plannedStart; });
  timed.sort((a, b) => a.sortKey - b.sortKey);

  // Placement : un bloc souple glisse après la fin la plus tardive des blocs qui le précèdent.
  let cursor = -1;
  timed.forEach((it) => {
    const r = it.real;
    let start;
    if (r.start !== null) start = r.start;
    else if (it.mode === 'flex') start = Math.max(it.plannedStart, cursor);
    else start = it.plannedStart;
    let end, state;
    if (r.end !== null) { end = r.end; state = 'done'; }
    else if (r.start !== null) {
      if (nowMin !== null) { end = Math.max(start + it.minutes, nowMin); state = 'running'; } else { end = start + it.minutes; state = 'started'; }
    } else { end = start + it.minutes; state = 'planned'; }
    if (end <= start) end = start + 1;
    it.start = start; it.end = end; it.state = state;
    it.shift = it.plannedStart !== null && r.start === null && start > it.plannedStart ? start - it.plannedStart : 0;
    cursor = Math.max(cursor, end);
    if (state === 'running') out.running = it;
    if (state === 'done' && it.mode === 'free' && it.children.length) out.reopen.push(it);   // sans heure à sous-activités : reste proposé pour enchaîner la suivante
    if (it.confirm && state === 'planned' && (past === true || (nowMin !== null && end <= nowMin))) out.toConfirm.push(it);
  });

  // Temps disponible entre deux blocs (du lever au premier bloc, puis jusqu'au coucher).
  const byStart = timed.slice().sort((a, b) => a.start - b.start || a.end - b.end);
  let prevEnd = prof.wake !== null ? prof.wake : (byStart.length ? byStart[0].start : 0), prev = null;
  byStart.forEach((it) => {
    if (it.start > prevEnd) out.gaps.push({ from: prevEnd, to: it.start, minutes: it.start - prevEnd, last: false });
    else if (prev && it.start < prevEnd && !prev.parallel && !it.parallel) out.warnings.push('« ' + prev.name + ' » (' + formatTime(prev.start) + '–' + formatTime(prev.end) + ') chevauche « ' + it.name + ' » (' + formatTime(it.start) + '–' + formatTime(it.end) + ').');
    if (it.end > prevEnd || prev === null) { prevEnd = Math.max(prevEnd, it.end); prev = it; }
  });
  if (byStart.length && prof.bedtime !== null) {
    out.relax = Math.max(0, prof.bedtime - prevEnd);
    if (prof.bedtime > prevEnd) {
      out.gaps.push({ from: prevEnd, to: prof.bedtime, minutes: prof.bedtime - prevEnd, last: true });
    } else {
      out.warnings.push('Les blocs vont jusqu’à ' + formatTime(prevEnd) + ', après l’heure du coucher (' + formatTime(prof.bedtime) + ').');
    }
  }
  out.gaps.forEach((g) => { out.largestGap = Math.max(out.largestGap, g.minutes); });
  out.placed = byStart;

  // Revue du jour : blocs « à reporter » non faits, ou faits avec des sous-tâches non cochées. Les blocs déjà traités sont listés à part.
  // (state : absent pour un bloc sans heure non lancé et pour un raté ; 'planned' | 'running' | 'started' | 'done' sinon.)
  timed.concat(out.pending, out.missed).forEach((it) => {
    if (it.review) { out.reviewed.push(it); return; }
    if (!it.carry || it.state === 'running') return;
    const unchecked = it.subs.filter((t) => !t.done).length;
    const notDone = it.state === undefined || it.state === 'planned';
    if (notDone || unchecked > 0) out.review.push({ item: it, part: notDone ? 'block' : 'subs', unchecked: unchecked, total: it.subs.length });
  });
  return out;
}

// Temps réels terminés (blocs ou segments de sous-activités) des jours de `from` à `to`. Les blocs ratés ou non terminés sont ignorés.
function timeEntries(daysMap, settings, from, to) {
  const names = {}, cats = {}, childNames = {};
  settings.activities.forEach((a) => { names['act:' + a.id] = a.name; cats['act:' + a.id] = a.cat || null; (a.children || []).forEach((c) => { childNames[c.id] = c.name; }); });
  const out = [];
  Object.keys(daysMap).sort().forEach((k) => {
    if (k < from || k > to) return;
    const d = daysMap[k];
    const nm = Object.assign({}, names), ct = Object.assign({}, cats);
    (d.ponctuels || []).forEach((p) => { nm['p:' + p.id] = p.name; ct['p:' + p.id] = p.cat || null; });
    const segs = d.segs || {};
    Object.keys(d.real).concat(Object.keys(segs).filter((x) => !(x in d.real))).forEach((key) => {
      const name = nm[key] || 'Activité supprimée', cat = ct[key] || null;
      if (segs[key] && segs[key].length) {
        segs[key].forEach((g) => { if (g.end !== null) out.push({ date: k, key: key, name: name, cat: cat, child: childNames[g.cid] || 'Sous-activité supprimée', minutes: g.end - g.start, start: g.start, end: g.end }); });
        return;
      }
      const r = d.real[key];
      if (!r || r.missed || r.start === null || r.end === null) return;
      out.push({ date: k, key: key, name: name, cat: cat, child: null, minutes: r.end - r.start, start: r.start, end: r.end });
    });
  });
  return out;
}
// Statistiques : temps réel par nom d'activité (avec le détail par sous-activité) et par catégorie.
function statsFor(daysMap, settings, from, to) {
  const entries = timeEntries(daysMap, settings, from, to);
  const catList = settings.categories || [];
  const totals = {}, detail = {}, ctot = {}, dates = {};
  entries.forEach((e) => {
    totals[e.name] = (totals[e.name] || 0) + e.minutes;
    if (e.child !== null) { detail[e.name] = detail[e.name] || {}; detail[e.name][e.child] = (detail[e.name][e.child] || 0) + e.minutes; }
    const cid = e.cat && catList.some((c) => c.id === e.cat) ? e.cat : '_none';
    ctot[cid] = (ctot[cid] || 0) + e.minutes;
    dates[e.date] = true;
  });
  const rows = Object.keys(totals).map((n) => {
    const kids = Object.keys(detail[n] || {}).map((c) => ({ name: c, minutes: detail[n][c] })).sort((x, y) => y.minutes - x.minutes || x.name.localeCompare(y.name, 'fr'));
    const rest = totals[n] - kids.reduce((t, c) => t + c.minutes, 0);
    if (kids.length && rest > 0) kids.push({ name: 'Sans détail', minutes: rest });
    return { name: n, minutes: totals[n], children: kids };
  }).sort((a, b) => b.minutes - a.minutes || a.name.localeCompare(b.name, 'fr'));
  const cats = Object.keys(ctot).map((id) => { const c = catList.find((x) => x.id === id); return { id: id, name: c ? c.name : 'Sans catégorie', work: !!(c && c.work), minutes: ctot[id] }; })
    .sort((a, b) => b.minutes - a.minutes || a.name.localeCompare(b.name, 'fr'));
  return { rows: rows, cats: cats, total: rows.reduce((t, r) => t + r.minutes, 0), daysUsed: Object.keys(dates).length };
}
// Suivi du temps de travail : minutes travaillées (catégories marquées « travail ») jour par jour, face à la cible (lundi–vendredi, hors congé).
function workReport(daysMap, settings, from, to, today, nowMin) {
  const wcats = (settings.categories || []).filter((c) => c.work).map((c) => c.id);
  const per = {};
  // Présence au travail + activités « travail » faites hors de la présence (aucun double comptage).
  const wins = {}, live = nowMin === undefined ? null : nowMin;
  Object.keys(daysMap).forEach((k) => { if (k < from || k > to) return; const w = presenceWindow(daysMap[k].presence, k === today ? live : null); if (w) wins[k] = w; });
  timeEntries(daysMap, settings, from, to).forEach((e) => {
    if (!e.cat || !wcats.includes(e.cat)) return;
    const w = wins[e.date];
    per[e.date] = (per[e.date] || 0) + e.minutes - (w ? Math.max(0, Math.min(e.end, w[1]) - Math.max(e.start, w[0])) : 0);
  });
  Object.keys(wins).forEach((k) => { per[k] = (per[k] || 0) + presenceNet(daysMap[k].presence, k === today ? live : null); });
  const days = [];
  let total = 0, target = 0, targetSoFar = 0, weekendMinutes = 0, weekendDays = 0;
  for (let k = from; k <= to; k = addDays(k, 1)) {
    const wd = isoWeekday(k);
    const t = wd <= 5 && !inLeave(settings, k) ? settings.workTarget : 0;
    const m = per[k] || 0;
    days.push({ date: k, weekday: wd, minutes: m, target: t });
    total += m; target += t;
    if (k <= today) targetSoFar += t;
    if (wd > 5 && m > 0) { weekendMinutes += m; weekendDays++; }
  }
  return { enabled: wcats.length > 0 || Object.keys(wins).length > 0, days: days, total: total, target: target, targetSoFar: targetSoFar, balance: total - targetSoFar, weekendMinutes: weekendMinutes, weekendDays: weekendDays };
}
function statsRange(mode, anchor) {
  if (mode === 'day') return { from: anchor, to: anchor };
  if (mode === 'month') {
    const d = parseDateKey(anchor);
    return { from: dateKey(new Date(d.getFullYear(), d.getMonth(), 1)), to: dateKey(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
  }
  const from = addDays(anchor, -(isoWeekday(anchor) - 1));
  return { from: from, to: addDays(from, 6) };
}

// Répartit en colonnes les blocs qui se chevauchent (affichage uniquement).
function layoutColumns(items) {
  items.sort((a, b) => a.start - b.start || b.end - a.end);
  let cluster = null;
  const clusters = [];
  items.forEach((it) => {
    if (!cluster || it.start >= cluster.end) { cluster = { end: it.end, cols: [], items: [] }; clusters.push(cluster); }
    let c = cluster.cols.findIndex((e) => e <= it.start);
    if (c === -1) { c = cluster.cols.length; cluster.cols.push(0); }
    cluster.cols[c] = it.end;
    it.col = c;
    cluster.end = Math.max(cluster.end, it.end);
    cluster.items.push(it);
  });
  clusters.forEach((cl) => cl.items.forEach((it) => { it.colCount = cl.cols.length; }));
  return items;
}

function renderRecap(s, status) {
  let html = '';

  } else {
    html += '<div class="chips" style="margin:12px 0">' + [1, 2, 3, 4, 5, 6, 7].map((d) =>

function fmtDateLabel(k) {

  return s.charAt(0).toUpperCase() + s.slice(1);
}
function dayNow() { return selectedDate === dateKey(new Date()) ? nowMinutes() : null; }
function buildSelected() { return buildDay(current, daysData.days[selectedDate] || emptyDay(), isoWeekday(selectedDate), dayNow(), selectedDate < dateKey(new Date()), selectedDate); }
function signed(m) { return m === 0 ? '0' : (m > 0 ? '+' : '−') + formatDuration(Math.abs(m)); }

function fromLabel(k) { return DAY_SHORT[isoWeekday(k)] + ' ' + k.slice(8, 10) + '/' + k.slice(5, 7); }

// ---- Recherche d'une tâche par son nom : toutes les occurrences (jours enregistrés, aujourd'hui et les 60 jours suivants) ----
let searchQ = '';
const SEARCH_AHEAD = 60, SEARCH_MAX = 80;
const foldText = (t) => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function searchTasks(query) {
  const q = foldText(query.trim()), today = dateKey(new Date()), out = [];
  if (q.length < 2) return null;
  const dates = Object.keys(daysData.days).filter((k) => k < today);
  for (let i = 0; i <= SEARCH_AHEAD; i++) dates.push(addDays(today, i));
  Array.from(new Set(dates)).sort().forEach((k) => {
    const b = buildDay(current, daysData.days[k] || emptyDay(), isoWeekday(k), null, k < today, k);
    b.placed.concat(b.pending, b.missed).forEach((it) => {
      if (!foldText(it.name).includes(q)) return;
      let status;
      if (it.real.missed) status = 'raté';
      else if (it.review && it.review.status === 'carried') status = 'reporté' + (it.review.to ? ' au ' + fromLabel(it.review.to) : '');
      else if (it.review) status = 'abandonné';
      else if (it.state === 'done') status = 'fait';
      else if (it.state === 'running' || it.state === 'started') status = 'en cours';
      else status = k < today ? 'non fait' : 'prévu';
      const when = it.mode === 'free' && it.real.start === null ? 'sans heure' : (it.start === undefined ? '' : formatTime(it.start) + '–' + formatTime(it.end));
      out.push({ date: k, name: it.name, when: when, status: status, future: k >= today });
    });
  });
  const up = out.filter((r) => r.future), past = out.filter((r) => !r.future).reverse();
  return up.concat(past);
}
function searchResultsHtml() {
  const res = searchTasks(searchQ);
  if (res === null) return searchQ.trim() ? '<p class="hours-help">Tape au moins 2 lettres.</p>' : '';
  if (!res.length) return '<p class="hours-help">Aucune tâche trouvée.</p>';
  const shown = res.slice(0, SEARCH_MAX);
  return '<div class="card"><h2>' + plural(res.length, 'résultat', 'résultats') + (res.length > SEARCH_MAX ? ' (' + SEARCH_MAX + ' affichés)' : '') + '</h2><ul class="rows">' + shown.map((r) =>
    '<li><span>' + esc(r.name) + ' <span class="v">· ' + esc(fromLabel(r.date)) + ' · ' + esc(r.when) + '</span><small>' + esc(r.status) + '</small></span><span>' +
    '<button type="button" class="btn small" data-search-go="' + r.date + '">Ouvrir</button></span></li>').join('') + '</ul></div>';
}
function presenceHtml(wd1) {

  return '<details class="card fold" data-fid="card-pres"' + (presOpen ? ' open' : '') + '><summary><h2>Présence au travail</h2></summary>' +

    '<button type="button" class="btn small" data-action="pres-addpause">Ajouter la pause</button>' +

      confirm: $('[data-t=confirm]', row).checked, carry: $('[data-t=carry]', row).checked, parallel: $('[data-t=parallel]', row).checked, noCal: $('[data-t=noCal]', row).checked, alarm: $('[data-t=alarm]', row).value === '' ? null : Number($('[data-t=alarm]', row).value) });

function ensureDay() {
  if (!daysData.days[selectedDate]) daysData.days[selectedDate] = emptyDay();
  return daysData.days[selectedDate];
}
function presenceAction(a, data) {
  const now = dayNow(), day = ensureDay();
  if (a === 'pres-in' && now !== null) {
    if (!day.presence) day.presence = { start: now, end: null, pauses: [] }; else day.presence.end = null;
  } else if (a === 'pres-pause' && now !== null && day.presence && day.presence.end === null && !day.presence.pauses.some((g) => g.end === null)) {
    day.presence.pauses.push({ start: now, end: null });
  } else if (a === 'pres-resume' && now !== null && day.presence) {
    day.presence.pauses.forEach((g) => { if (g.end === null) g.end = Math.min(1439, Math.max(now, g.start + 1)); });
  } else if (a === 'pres-out' && now !== null && day.presence && day.presence.end === null) {
    const p = day.presence;
    p.pauses.forEach((g) => { if (g.end === null) g.end = Math.min(1439, Math.max(now, g.start + 1)); });
    p.end = Math.min(1439, Math.max(now, p.start + 1));

    if (!day.presence) { showToast('Renseigne d’abord l’arrivée', 'err'); return; }
    if (s0 === null || e0 === null || e0 <= s0) { showToast('Pause : début et fin valides (fin après début)', 'err'); return; }
    day.presence.pauses.push({ start: s0, end: e0 });

  persistDays(); renderDay();
}
function presenceEdit(which, text) {
  const day = ensureDay(), p = day.presence, t = text.trim() === '' ? undefined : parseTime(text);
  if (t === null) { showToast('Heure invalide (HH:MM)', 'err'); renderDay(); return; }
  if (which === 'start') {
    if (t === undefined) day.presence = null;
    else if (p) { if (p.end !== null && p.end <= t) { showToast('L’arrivée doit être avant le départ', 'err'); renderDay(); return; } p.start = t; }
    else day.presence = { start: t, end: null, pauses: [] };
  } else {

    else if (t <= p.start) { showToast('Le départ doit être après l’arrivée', 'err'); renderDay(); return; }
    else { p.end = t; p.pauses.forEach((g) => { if (g.end === null) g.end = Math.min(p.end, Math.max(g.start + 1, p.end)); }); }
  }

}

}

// ---- Chrono ----
// Un seul chrono à la fois : arrête tous les blocs et toutes les sous-activités en cours (sauf le bloc `exceptKey`).
function closeRunning(day, now, exceptKey) {
  Object.keys(day.real).forEach((k) => {
    const r = day.real[k];
    if (k !== exceptKey && r.start !== null && r.end === null) r.end = Math.min(1439, Math.max(now, r.start + 1));
  });
  Object.keys(day.segs).forEach((k) => day.segs[k].forEach((g) => { if (g.end === null) g.end = Math.min(1439, Math.max(now, g.start + 1)); }));
}
function startNow(key) {
  const now = dayNow();
  if (now === null) return;
  const day = ensureDay();
  closeRunning(day, now, key);
  day.real[key] = { start: now, end: null };
  persistDays();
  renderDay();
}
function toggleChild(key, cid) {
  const now = dayNow();
  if (now === null) return;
  const day = ensureDay();
  const list = day.segs[key] || [];
  const open = list.find((g) => g.cid === cid && g.end === null);
  closeRunning(day, now, null);
  if (!open) { if (!day.segs[key]) day.segs[key] = []; day.segs[key].push({ cid: cid, start: now, end: null }); }
  persistDays();
  renderChildren();
  renderDay();
}
function stopNow(key) {
  const now = dayNow();
  const day = ensureDay();
  const open = (day.segs[key] || []).find((g) => g.end === null);
  if (now !== null && open) { open.end = Math.min(1439, Math.max(now, open.start + 1)); persistDays(); renderDay(); return; }
  const r = day.real[key];
  if (now === null || !r || r.start === null) return;
  r.end = Math.min(1439, Math.max(now, r.start + 1));
  persistDays();
  renderDay();
}

// ---- Calendrier : export .ics et import de rendez-vous (lot 7) ----
function icsEscape(t) { return String(t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsStamp(k, m) { return k.replace(/-/g, '') + 'T' + pad2(Math.floor(m / 60)) + pad2(m % 60) + '00'; }
// mode 'plan' : blocs placés (réels si faits, sinon prévus) ; 'real' : temps terminés seulement (un événement par sous-activité).
function calendarEvents(daysMap, settings, from, to, mode) {
  const today = dateKey(new Date()), out = [];
  const catName = (id) => { const c = (settings.categories || []).find((x) => x.id === id); return c ? c.name : ''; };
  for (let k = from; k <= to; k = addDays(k, 1)) {
    const b = buildDay(settings, daysMap[k] || emptyDay(), isoWeekday(k), null, k < today, k);
    b.placed.forEach((it) => {
      if (it.noCal) return;
      const cat = catName(it.cat);
      if (mode === 'real') {
        if (it.segs.length) {
          it.segs.forEach((g, i) => {
            if (g.end === null) return;
            const c = (it.children || []).find((x) => x.id === g.cid);
            out.push({ uid: 'pdj-' + k + '-' + it.key + '-' + i, date: k, start: g.start, end: g.end, title: it.name + (c ? ' · ' + c.name : ''), cat: cat });
          });
          return;
        }
        if (it.state !== 'done') return;
      }
      out.push({ uid: 'pdj-' + k + '-' + it.key, date: k, start: it.start, end: it.end, title: it.name, cat: cat, alarm: it.alarm === undefined ? null : it.alarm });
    });
  }
  return out;
}
function buildIcs(events) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Plan du jour//FR', 'CALSCALE:GREGORIAN'];
  events.forEach((e) => {

// ---- Revue du jour : reporter / abandonner / annuler ----
function findItem(key) { const b = buildSelected(); return b.placed.concat(b.pending, b.missed).find((x) => x.key === key) || null; }

// Reporte vers le jour `target` (strictement après le jour affiché).
// Un bloc non fait devient un bloc ponctuel « sans heure » du jour cible, avec ses sous-tâches non cochées ; l'original quitte le plan (comme un raté).
// Un bloc fait garde sa place : seules ses sous-tâches non cochées partent (sur la même activité si elle est prévue ce jour-là, sinon dans un bloc sans heure).
function carryItem(key, target) {
  const it = findItem(key);
  if (!it || it.review || !isDateKey(target) || target <= selectedDate) return false;
  const src = ensureDay();
  const unchecked = (src.subtasks[key] || []).filter((t) => !t.done);
  const notDone = it.state === undefined || it.state === 'planned';
  if (!notDone && !unchecked.length) return false;
  if (!daysData.days[target]) daysData.days[target] = emptyDay();
  const dst = daysData.days[target];
  const rv = { status: 'carried', part: notDone ? 'block' : 'subs', to: target, pid: null, tkey: null, sids: [], setMissed: false };
  const act = it.kind === 'act' ? current.activities.find((a) => a.id === it.id) : null;
  if (!notDone && act && act.days.includes(isoWeekday(target))) {
    rv.tkey = key;                                   // même activité, déjà prévue ce jour-là
  } else {
    const p = { id: newId(), name: it.name, mode: 'free', entry: 'duration', start: null, duration: it.minutes, confirm: false, carry: true, cat: it.cat || null, from: selectedDate };
    dst.ponctuels.push(p);
    rv.pid = p.id; rv.tkey = 'p:' + p.id;
  }
  if (unchecked.length) {
    if (!dst.subtasks[rv.tkey]) dst.subtasks[rv.tkey] = [];
    unchecked.forEach((t) => {
      const c = { id: newId(), label: t.label, action: t.action, done: false };
      dst.subtasks[rv.tkey].push(c);
      rv.sids.push(c.id);
    });
  }
  if (notDone && !(src.real[key] && src.real[key].missed)) { src.real[key] = { start: null, end: null, missed: true }; rv.setMissed = true; }
  src.review[key] = rv;
  persistDays();
  return true;
}
function dropItem(key) {
  const it = findItem(key);
  if (!it || it.review) return;
  const src = ensureDay();
  const notDone = it.state === undefined || it.state === 'planned';
  const rv = { status: 'dropped', part: notDone ? 'block' : 'subs', to: null, pid: null, tkey: null, sids: [], setMissed: false };
  if (notDone && !(src.real[key] && src.real[key].missed)) { src.real[key] = { start: null, end: null, missed: true }; rv.setMissed = true; }
  src.review[key] = rv;
  persistDays();
}
// Défait un report ou un abandon : retire la copie du jour cible et remet le bloc dans le plan s'il l'avait quitté à cause du report.
function undoReview(key) {
  const src = ensureDay();
  const rv = src.review[key];
  if (!rv) return;
  if (rv.status === 'carried' && rv.to && daysData.days[rv.to]) {
    const dst = daysData.days[rv.to];
    if (rv.pid) {
      dst.ponctuels = dst.ponctuels.filter((p) => p.id !== rv.pid);
      delete dst.real['p:' + rv.pid];
      delete dst.subtasks['p:' + rv.pid];
      delete dst.review['p:' + rv.pid];
    } else if (rv.tkey && dst.subtasks[rv.tkey]) {
      dst.subtasks[rv.tkey] = dst.subtasks[rv.tkey].filter((t) => !rv.sids.includes(t.id));
      if (!dst.subtasks[rv.tkey].length) delete dst.subtasks[rv.tkey];
    }
  }
  if (rv.setMissed && src.real[key] && src.real[key].missed) delete src.real[key];
  delete src.review[key];
  persistDays();
}

    const nav = e.target.closest('[data-day-nav]');
    if (nav) {
      const v = nav.dataset.dayNav;
      const target = v === 'today' ? dateKey(new Date()) : addDays(selectedDate, Number(v));
      if (target !== selectedDate) { closePick(); reviewOpen = null; }       // la revue se replie quand on change de jour
      selectedDate = target;
      closePanel();
      renderDay();
      return;
    }
    const go = e.target.closest('[data-search-go]');
    if (go) { closePick(); reviewOpen = null; selectedDate = go.dataset.searchGo; searchQ = ''; closePanel(); renderDay(); window.scrollTo(0, 0); return; }
    const act = e.target.closest('[data-action]');
    if (act) {
      const a = act.dataset.action;
      if (a === 'add-block') openPanel(null);
      else if (a === 'open-block') openPanel(act.dataset.key);
      else if (a === 'start') startNow(act.dataset.key);
      else if (a === 'child-go') toggleChild(act.dataset.key, act.dataset.cid);
      else if (a === 'stop') stopNow(act.dataset.key);
      else if (a.indexOf('pres-') === 0) presenceAction(a, act.dataset);
      else if (a === 'confirm-done') {
        const it = buildSelected().toConfirm.find((x) => x.key === act.dataset.key);
        if (it) { ensureDay().real[it.key] = { start: it.start, end: it.end }; persistDays(); renderDay(); }
      } else if (a === 'confirm-missed') { ensureDay().real[act.dataset.key] = { start: null, end: null, missed: true }; persistDays(); renderDay(); }
      else if (a === 'unmiss') { const k = act.dataset.key; undoReview(k); delete ensureDay().real[k]; persistDays(); renderDay(); }
      else if (a === 'rv-toggle') { const today = dateKey(new Date()); reviewOpen = !(reviewOpen === null ? selectedDate < today : reviewOpen); renderDay(); }
      else if (a === 'rv-pick') { reviewPick = act.dataset.key; reviewError = ''; renderDay(); const d = $('#rv-date'); if (d) d.scrollIntoView({ block: 'center' }); }
      else if (a === 'rv-cancel') { closePick(); renderDay(); }
      else if (a === 'rv-carry' || a === 'rv-go') {
        let target = addDays(selectedDate, 1);
        if (a === 'rv-go') {
          const v = ($('#rv-date') || {}).value || '';
          if (!isDateKey(v) || v <= selectedDate) { reviewError = 'Choisis un jour après le ' + fromLabel(selectedDate) + '.'; renderDay(); return; }
          target = v;
        }
        if (carryItem(act.dataset.key, target)) showToast('Reporté au ' + fromLabel(target));
        closePick();
        renderDay();
      }
      else if (a === 'rv-drop') { dropItem(act.dataset.key); if (reviewPick === act.dataset.key) closePick(); renderDay(); }
      else if (a === 'rv-undo') { undoReview(act.dataset.key); renderDay(); }
      return;
    }
    const cpick = e.target.closest('[data-child-pick]');
    if (cpick) { $('#seg-child').value = cpick.dataset.childPick; $('#seg-start').focus(); return; }
    const cgo = e.target.closest('[data-child-go]');
    if (cgo && panelKey) { toggleChild(panelKey, cgo.dataset.childGo); return; }
    const segDel = e.target.closest('[data-seg-del]');
    if (segDel && panelKey) {
      const day = ensureDay();
      const list = day.segs[panelKey] || [];
      list.splice(Number(segDel.dataset.segDel), 1);
      if (!list.length) delete day.segs[panelKey];
      persistDays(); renderChildren(); renderDay();
      return;
    }
    const subDel = e.target.closest('[data-sub-del]');
    if (subDel && panelKey) {
      const day = ensureDay();
      day.subtasks[panelKey] = (day.subtasks[panelKey] || []).filter((t) => t.id !== subDel.dataset.subDel);
      if (!day.subtasks[panelKey].length) delete day.subtasks[panelKey];
      persistDays();
      renderSubs();
      renderDay();
      return;
    }
    const bp = e.target.closest('[data-bp]');
    if (!bp) return;
    const what = bp.dataset.bp;
    if (what === 'close') closePanel();
    else if (what === 'start' && panelKey) { const key = panelKey; closePanel(); startNow(key); }
    else if (what === 'stop' && panelKey) { const key = panelKey; closePanel(); stopNow(key); }
    else if (what === 'add-sub') addSub();
    else if (what === 'add-seg') addSeg();
    else if (what === 'clear' && panelKey) { delete ensureDay().real[panelKey]; persistDays(); closePanel(); renderDay(); }
    else if (what === 'delete' && panelKey) {
      const day = ensureDay();
      day.ponctuels = day.ponctuels.filter((p) => 'p:' + p.id !== panelKey);
      delete day.real[panelKey];
      delete day.subtasks[panelKey];
      delete day.segs[panelKey];
      delete day.review[panelKey];
      persistDays();
      closePanel();
      renderDay();
    }
  });
  panel.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.matches && e.target.matches('#sub-label, #sub-action')) { e.preventDefault(); addSub(); }
  });
  panel.addEventListener('input', (e) => {
    if (e.target.id === 'day-search') { searchQ = e.target.value; $('#day-search-res').innerHTML = searchResultsHtml(); }
  });
  panel.addEventListener('toggle', (e) => { if (e.target.dataset && e.target.dataset.fid === 'card-pres') presOpen = e.target.open; }, true);
  panel.addEventListener('change', (e) => {
    if (e.target.dataset && e.target.dataset.pres && ['start', 'end'].includes(e.target.dataset.pres)) { presenceEdit(e.target.dataset.pres, e.target.value); return; }
    if (e.target.id === 'day-profile') {
      const day = ensureDay();
      day.profile = e.target.value || null;
      persistDays();
      renderDay();
      return;
    }
    if (e.target.matches && e.target.matches('[data-sub-done]') && panelKey) {
      const t = ((daysData.days[selectedDate] || {}).subtasks[panelKey] || []).find((x) => x.id === e.target.dataset.subDone);
      if (t) { t.done = e.target.checked; persistDays(); renderSubs(); renderDay(); }
      return;
    }
    if (e.target.id === 'bp-tpl') {
      const t = (current.templates || []).find((x) => x.id === e.target.value), row = $('#bp-edit .act-row');
      if (t && row) {
        $('[data-a=name]', row).value = t.name; $('[data-a=cat]', row).value = t.cat || '';
        $('[data-a=mode]', row).value = t.mode; $('[data-a=entry]', row).value = 'duration';
        $('[data-a=second]', row).value = String(t.mode === 'free' ? 30 : t.duration);
        $('[data-a=confirm]', row).checked = t.confirm === true && t.mode !== 'free'; $('[data-a=carry]', row).checked = t.carry; $('[data-a=alarm]', row).value = t.alarm === null ? '' : String(t.alarm);
        if ($('[data-a=parallel]', row)) $('[data-a=parallel]', row).checked = t.parallel;
        if ($('[data-a=noCal]', row)) $('[data-a=noCal]', row).checked = t.noCal;
        convertSecond(row, 'duration'); updateRowUi(row);
        const st = $('[data-a=start]', row); if (t.mode !== 'free' && st) st.focus();
      }
      return;
    }
    const row = e.target.closest('#bp-edit .act-row');
    if (!row) return;
    if (e.target.matches('[data-a=entry]')) convertSecond(row, e.target.value);
    if (e.target.matches('[data-a=mode],[data-a=entry]')) updateRowUi(row);
  });
  panel.addEventListener('focusin', (e) => {
    const el = e.target;
    if (el.matches && el.matches('[data-kind]')) setTimeout(() => { try { el.select(); } catch (x) { /* ignoré */ } }, 0);
  });
  panel.addEventListener('focusout', (e) => {
    const el = e.target;
    if (el.matches && el.matches('[data-kind=time]')) { const v = parseTime(el.value); if (v !== null) el.value = formatTime(v); }
  });
  $('#block-panel').addEventListener('submit', (e) => { e.preventDefault(); savePanel(); });
}

function bindEvents() {
  bindDayEvents();
  const form = $('#settings-form');

  $$('.tabbar button').forEach((b) => b.addEventListener('click', () => switchTab(b.dataset.tab)));
  $('#panel-stats').addEventListener('click', (e) => {
    const m = e.target.closest('[data-stats-mode]');
    if (m) { statsMode = m.dataset.statsMode; renderStats(); return; }
    const n = e.target.closest('[data-stats-nav]');
    if (!n) return;
    const v = n.dataset.statsNav;
    if (v === 'today') statsAnchor = dateKey(new Date());
    else if (statsMode === 'day') statsAnchor = addDays(statsAnchor, Number(v));
    else if (statsMode === 'week') statsAnchor = addDays(statsAnchor, 7 * Number(v));
    else { const d = parseDateKey(statsAnchor); statsAnchor = dateKey(new Date(d.getFullYear(), d.getMonth() + Number(v), 1)); }
    renderStats();
  });
  $('#panel-recap').addEventListener('click', (e) => {
    const b = e.target.closest('[data-recap-day]');
    if (b) { recapDay = Number(b.dataset.recapDay); renderRecap(current, loadStatus); return; }
    const m = e.target.closest('[data-recap-mode]'), dt = e.target.closest('[data-recap-date]'), nv = e.target.closest('[data-recap-nav]');
    if (m) { recapMode = m.dataset.recapMode; if (recapMode === 'type' && recapDate) recapDay = isoWeekday(recapDate); renderRecap(current, loadStatus); }
    else if (dt) { recapDate = dt.dataset.recapDate; renderRecap(current, loadStatus); }
    else if (nv) { recapDate = addDays(recapDate, Number(nv.dataset.recapNav)); renderRecap(current, loadStatus); }
  });

  form.addEventListener('input', (e) => { if (e.target.id === 'import-file' || (e.target.closest && e.target.closest('[data-nodirty]'))) return; if (e.target.closest && e.target.closest('#cats-list')) syncCatOptions(); setDirty(true); updateSummary(e.target.closest && (e.target.closest('.act-row') || e.target.closest('.tpl-row'))); });
  form.addEventListener('toggle', (e) => {                 // mémorise ce qui est plié ou déplié
    const d = e.target, id = d.dataset && d.dataset.fid;
    if (!id) return;
    const set = d.classList.contains('fold') ? foldClosed : openRows;
    if (d.classList.contains('fold')) { if (d.open) set.delete(id); else set.add(id); } else if (d.open) set.add(id); else set.delete(id);
  }, true);
  form.addEventListener('change', (e) => {
    if (e.target.id === 'import-file') { onImportFile(e.target); return; }
    if (e.target.closest && e.target.closest('[data-nodirty]')) return;
    if (e.target.matches('#acts-list [data-a=name]')) syncActChips();
    const row = e.target.closest('.act-row');
    updateSummary(row);
    if (row && row.dataset.mode !== undefined) {
      if (e.target.matches('[data-a=entry]')) convertSecond(row, e.target.value);
      if (e.target.matches('[data-a=mode],[data-a=entry]')) updateRowUi(row);
    }
    setDirty(true);
  });
  form.addEventListener('focusin', (e) => {
    const el = e.target;
    if (el.matches && el.matches('[data-kind]')) setTimeout(() => { try { el.select(); } catch (x) { /* ignoré */ } }, 0);
  });
  form.addEventListener('focusout', (e) => {          // remet l'heure en HH:MM
    const el = e.target;
    if (el.matches && el.matches('[data-kind=time]')) {
      const v = parseTime(el.value);
      if (v !== null) el.value = formatTime(v);
    }
  });

  form.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (chip) {
      chip.setAttribute('aria-pressed', String(chip.getAttribute('aria-pressed') !== 'true'));
      updateSummary(chip.closest('.act-row'));
      setDirty(true);
      return;
    }
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'export') { doExport(); return; }
    if (action === 'cal-export') { doCalExport(); return; }
    if (action === 'cal-import') { doCalImport(); return; }
    if (action === 'cal-paste') { doCalPaste(); return; }
    if (action === 'import') {
      if (dirty && !window.confirm('Des modifications ne sont pas enregistrées. Elles seront perdues si tu remplaces les réglages. Continuer ?')) return;
      $('#import-file').click();
      return;
    }
    if (action === 'imp-all') { applyImport('all'); return; }
    if (action === 'imp-settings') { applyImport('settings'); return; }
    if (action === 'imp-cancel') { pendingImport = null; renderImportBox(); return; }
    if (action === 'add-act') {
      const raws = $$('#acts-list .act-row').map(readActRaw);
      const nid = newId();
      openRows.add(nid);
      raws.push({ id: nid, name: '', mode: 'fixed', entry: 'duration', days: [1, 2, 3, 4, 5], start: '', second: '30', confirm: false, carry: false, children: [], cat: '', parallel: false, noCal: false, alarm: '' });
      $('#acts-list').innerHTML = actsListHtml(raws, actOpts(), false);
      rerenderProfiles();
      const names = $$('#acts-list [data-a=name]');
      names[names.length - 1].focus();
      setDirty(true);
    } else if (action === 'del-act') {
      const row = btn.closest('.act-row');
      const raws = $$('#acts-list .act-row').map(readActRaw).filter((r) => r.id !== row.dataset.id);
      $('#acts-list').innerHTML = actsListHtml(raws, actOpts(), false);
      rerenderProfiles();
      setDirty(true);
    } else if (action === 'add-prof') {
      const pid = newId();
      openRows.add(pid);
      rerenderProfiles({ id: pid, name: '', wake: '07:00', bedtime: '22:00', days: [], removes: [] });
      const names = $$('#profs-list [data-p=name]');
      names[names.length - 1].focus();
      setDirty(true);
    } else if (action === 'add-tpl') {
      const ntid = newId(); openRows.add(ntid);
      $('#tpls-list').insertAdjacentHTML('beforeend', tplRowHtml({ id: ntid, name: '', cat: null, mode: 'fixed', duration: 30, confirm: false, carry: false, parallel: false, noCal: false, alarm: null }, catsFromForm()));
      $$('#tpls-list [data-t=name]').slice(-1)[0].focus();
      setDirty(true);
    } else if (action === 'del-tpl') {
      btn.closest('.tpl-row').remove();
      setDirty(true);
    } else if (action === 'add-cat') {
      $('#cats-list').insertAdjacentHTML('beforeend', catRowHtml({ id: newId(), name: '', work: false }));
      $$('#cats-list [data-k=name]').slice(-1)[0].focus();
      syncCatOptions();
      setDirty(true);
    } else if (action === 'del-cat') {
      btn.closest('.cat-row').remove();
      syncCatOptions();
      setDirty(true);
    } else if (action === 'add-child') {
      const row = btn.closest('.act-row');
      const box = $('.childs', row);
      box.insertAdjacentHTML('beforeend', childRowHtml({ id: newId(), name: '' }));
      $$('[data-c=name]', box).slice(-1)[0].focus();
      updateSummary(row);
      setDirty(true);
    } else if (action === 'del-child') {
      const row = btn.closest('.act-row');
      btn.closest('.child-row').remove();
      updateSummary(row);
      setDirty(true);
    } else if (action === 'add-leave') {
      const wrap = document.createElement('div');
      wrap.innerHTML = leavePeriodHtml({ id: newId(), from: '', to: '' });
      $('#leave-pers').appendChild(wrap.firstChild);
      $$('#leave-pers [data-l=from]').slice(-1)[0].focus();
      setDirty(true);
    } else if (action === 'del-leave') {
      btn.closest('.leave-per').remove();
      setDirty(true);
    } else if (action === 'del-prof') {
      const row = btn.closest('.prof-row');
      if ($$('#profs-list .prof-row').length <= 1) { showToast('Garde au moins un profil', 'err'); return; }
      row.remove();
      setDirty(true);
    } else if (action === 'reset') {
      if (window.confirm('Remplacer les champs par les valeurs de départ ? Rien ne sera enregistré avant que tu appuies sur « Enregistrer ».')) {
        renderForm(defaultSettings());
        setDirty(true);
      }
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const result = readForm();
    if (result.errors.length) {
      showToast(result.errors.length + ' champ(s) à corriger', 'err');
      const first = result.errors[0].el;
      first.scrollIntoView({ block: 'center' });
      first.focus();
      return;
    }
    if (!saveSettings(result.settings)) {
      showToast('Enregistrement impossible sur cet appareil', 'err');
      return;
    }
    current = result.settings;
    loadStatus = 'ok';
    renderForm(current);
    renderRecap(current, loadStatus);
    renderDay();
    setDirty(false);
    showToast('Enregistré');
  });
}

// ==== 8. INIT ====
function init() {
  const loaded = loadSettings();
  current = loaded.settings;
  loadStatus = loaded.status;
  daysData = loadDays();
  selectedDate = dateKey(new Date());
  recapDay = isoWeekday(selectedDate);
  recapDate = selectedDate;
  renderForm(current);
  renderRecap(current, loadStatus);
  setDirty(false);
  bindEvents();
  switchTab('day');
  // Un bloc en cours fait glisser la suite et l'heure fait apparaître les blocs « à confirmer » : on rafraîchit le jour affiché toutes les 15 secondes.
  setInterval(() => {
    if (!$('#panel-day').hidden && !panelOpen && reviewPick === null && document.activeElement.id !== 'day-profile' && document.activeElement.id !== 'day-search' && !(document.activeElement.dataset && document.activeElement.dataset.pres) && dayNow() !== null) renderDay();
  }, 15000);
  window.PDJ = { calendarEvents: calendarEvents, buildIcs: buildIcs, parseCalendarText: parseCalendarText, workReport: workReport, presenceNet: presenceNet, cleanPresence: cleanPresence, resolveProfile: resolveProfile, lastWorkDay: lastWorkDay, eveOfReturn: eveOfReturn, statsFor: statsFor, statsRange: statsRange, buildDay: buildDay, defaultSettings: defaultSettings, emptyDay: emptyDay, parseTime: parseTime, formatTime: formatTime };   // point d'accès pour les tests
  const isLocal = ['localhost', '127.0.0.1', ''].includes(location.hostname);
  if ('serviceWorker' in navigator && (!isLocal || /[?&]sw=1/.test(location.search))) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* hors ligne indisponible, sans gravité */ });
  }
}
init();

})();
</script>
</body>
