<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan du jour</title>
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan du jour">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --bg: #f3f5f4; --card: #ffffff; --ink: #16211f; --muted: #5d6b68; --line: #dfe5e3;
  --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #e0f2ef;
  --warn-bg: #fff6e0; --warn-ink: #7a4b00; --err: #b42318; --info-bg: #e8f1fb; --info-ink: #1d4670;
  --trip: #e6ebe9; --fix: #fde4bf; --fix-line: #e0a14a;
  --tabbar-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1514; --card: #172120; --ink: #e8f0ee; --muted: #9fb0ac; --line: #26332f;
    --accent: #2dd4bf; --accent-ink: #04201c; --accent-soft: #123a35;
    --warn-bg: #2b2410; --warn-ink: #f5d58a; --err: #ff8a80; --info-bg: #14283a; --info-ink: #a9cdf0;
    --trip: #202c29; --fix: #4a3715; --fix-line: #d9992f;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
header.app-header { padding: 20px 16px 8px; max-width: 720px; margin: 0 auto; }
header.app-header h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
header.app-header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
main { max-width: 720px; margin: 0 auto; padding: 8px 16px calc(var(--tabbar-h) + 110px + env(safe-area-inset-bottom)); }
[hidden] { display: none !important; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
.card h2 { margin: 0 0 4px; font-size: 17px; }
.card .help { margin: 0 0 10px; color: var(--muted); font-size: 14px; }

.banner { border-radius: 12px; padding: 10px 14px; margin: 12px 0; font-size: 14px; }
.banner.info { background: var(--info-bg); color: var(--info-ink); }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
.banner ul { margin: 6px 0 0; padding-left: 18px; }

/* Récapitulatif */
.tl { list-style: none; margin: 8px 0 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 116px 18px 1fr; align-items: start; padding: 6px 0; }
.tl .t { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; padding-right: 6px; white-space: nowrap; }
.tl .dot { position: relative; align-self: stretch; }
.tl .dot::before { content: ""; position: absolute; left: 8px; top: 0; bottom: -12px; width: 2px; background: var(--line); }
.tl li:last-child .dot::before { display: none; }
.tl .dot::after { content: ""; position: absolute; left: 3px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.tl .what { padding-left: 6px; }
.tl .what small { display: block; color: var(--muted); font-size: 13px; }
.tl li.gapli .t { font-weight: 500; color: var(--accent); }
.tl li.gapli .dot::after { background: var(--card); border: 2px solid var(--accent); width: 12px; height: 12px; }
.tl li.gapli .what { color: var(--accent); font-size: 14px; }
.tl li.mark .t, .tl li.mark .what { color: var(--muted); }
.tl li.mark .dot::after { background: var(--muted); }
.rows { list-style: none; margin: 8px 0 0; padding: 0; }
.rows li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.rows li:first-child { border-top: 0; }
.rows .v { color: var(--muted); text-align: right; }

/* Formulaire */
.field { display: block; margin: 10px 0; }
.lbl { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
input[type=text], input[type=date], select {
  width: 100%; min-height: 44px; padding: 8px 12px; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; -webkit-appearance: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
input[aria-invalid=true] { border-color: var(--err); }
.err { display: block; color: var(--err); font-size: 13px; margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.act-row { border-top: 1px solid var(--line); padding: 10px 0 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; position: relative; }
.act-row:first-child { border-top: 0; }
.act-row .wide { grid-column: 1 / -1; }
.act-row .first { padding-right: 52px; }
.act-row .err { margin-bottom: 6px; }
.act-row .del { position: absolute; right: 0; top: 30px; }
.act-row[data-mode=free] .timed { display: none; }
#bp-edit .act-row { border-top: 0; padding-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-width: 52px; min-height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button { font: inherit; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--err); }
.btn.small { min-height: 36px; padding: 0 12px; }
.btn:disabled { opacity: .5; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.icon-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 18px; }
.foot { color: var(--muted); font-size: 13px; text-align: center; margin: 18px 0; }
.foot .btn { margin-bottom: 14px; }

/* Barres fixes */
.savebar {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  background: var(--card); border-top: 1px solid var(--line); padding: 8px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 4;
}
.savebar .msg { font-size: 14px; color: var(--muted); }
.savebar .msg.dirty { color: var(--warn-ink); font-weight: 600; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5;
}
.tabbar button { height: var(--tabbar-h); border: 0; background: none; color: var(--muted); font-size: 14px; padding: 0 2px; }
.tabbar button[aria-selected=true] { color: var(--accent); font-weight: 700; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 76px + env(safe-area-inset-bottom));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 22px; font-size: 14px; z-index: 6; max-width: 90vw;
}
.toast.err { background: var(--err); color: #fff; }

/* Jour */
.daynav { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 10px; gap: 8px; }
.daylabel { font-weight: 700; font-size: 18px; text-align: center; flex: 1; }
.daytools { display: flex; gap: 10px; margin-bottom: 4px; }
.daytools .btn { flex: 1; }
.runbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--accent); color: var(--accent-ink);
  border-radius: 14px; padding: 10px 14px; margin: 10px 0; }
.runbar small { display: block; opacity: .85; }
.runbar .btn { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); font-weight: 600; }
.tlwrap { position: relative; margin: 14px 0 0 46px; }
.tlarea { position: relative; }
.hline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); z-index: 0; }
.hline span { position: absolute; left: -46px; top: -9px; width: 40px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.marker { position: absolute; left: 0; right: 0; border-top: 2px solid var(--muted); font-size: 12px; color: var(--muted); z-index: 1; }
.marker span { position: absolute; right: 0; top: 2px; }
.gap { position: absolute; left: 0; right: 0; border-left: 3px dotted var(--accent); z-index: 1; color: var(--accent); font-size: 12px; padding-left: 8px; display: flex; align-items: center; }
.blk { position: absolute; display: flex; flex-direction: column; justify-content: flex-start; text-align: left; font: inherit; color: var(--ink);
  border: 0; border-radius: 8px; padding: 3px 8px; overflow: hidden; line-height: 1.2; margin: 1px 0; z-index: 2; }
.blk .bn { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .bt { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.short { flex-direction: row; align-items: center; gap: 8px; padding-top: 0; padding-bottom: 0; }
.b-fixed { background: var(--fix); border-left: 4px solid var(--fix-line); }
.b-flex { background: var(--accent-soft); border-left: 4px solid var(--accent); }
.b-free { background: var(--accent-soft); border-left: 4px dashed var(--accent); }
.b-done { opacity: .6; }
.b-done .bn { text-decoration: line-through; }
.b-running { outline: 2px solid var(--accent); }
.hours-help { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.relax { display: flex; justify-content: space-between; align-items: center; background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; margin: 10px 0; }
.relax strong { font-size: 18px; }
.relax.low { background: var(--warn-bg); color: var(--warn-ink); }
.act-row .chk { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; }
.chk input, .subchk input { width: 22px; height: 22px; flex: none; accent-color: var(--accent); }
.subh { margin: 14px 0 6px; font-size: 15px; }
.subs { list-style: none; margin: 0 0 8px; padding: 0; }
.subs li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.subs li:first-child { border-top: 0; }
.subchk { display: flex; align-items: center; gap: 12px; flex: 1; min-height: 44px; }
.subtxt small { display: block; color: var(--muted); font-size: 13px; }
.sublabel.done { text-decoration: line-through; color: var(--muted); }
.rv-head { display: flex; width: 100%; justify-content: space-between; align-items: center; min-height: 44px; padding: 0; border: 0; background: none; color: var(--ink); text-align: left; font-size: 16px; }
.rows li.rvi { display: block; }
.rvi small { display: block; color: var(--muted); font-size: 13px; }
.rvbtn { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.profsel { margin: 8px 0 4px; }
.rows li.strow { display: block; }
.stline { display: flex; justify-content: space-between; gap: 12px; }
.bar { height: 8px; margin-top: 6px; border-radius: 4px; background: var(--accent-soft); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.stnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0; }
.stnav .lab { flex: 1; text-align: center; font-weight: 700; }
.imp { border: 2px solid var(--accent); border-radius: 12px; padding: 10px 14px; margin-top: 12px; }
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "▾"; color: var(--muted); }
details.fold[open] > summary::after { content: "▴"; }
details.fold > summary h2 { margin: 0; }
.rowfold { grid-column: 1 / -1; }
.rowfold > summary { display: flex; align-items: center; min-height: 48px; padding-right: 52px; cursor: pointer; }
.rowfold .sumtxt strong { display: block; }
.rowfold .sumtxt small { display: block; color: var(--muted); font-size: 13px; }
.rowgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; padding-top: 4px; }
.act-row[data-fold] .del { top: 2px; }
.card h2 .v { font-weight: 400; font-size: 14px; }
.card.pick { border-color: var(--accent); border-width: 2px; }
.pickrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.pickrow input[type=date] { width: auto; flex: 1 1 150px; }
</style>
</head>
<body>
<header class="app-header">
  <h1>Plan du jour</h1>
  <p id="subtitle">Ton plan, recalé selon la réalité.</p>
</header>

<main>
  <section id="panel-day" role="tabpanel" aria-labelledby="tab-day">
    <div id="day-head"></div>
    <form id="block-panel" class="card" hidden novalidate autocomplete="off">
      <h2 id="bp-title">Bloc</h2>
      <div id="bp-edit"></div>
      <p class="help" id="bp-planned"></p>
      <div id="bp-real" class="grid2">
        <label class="field"><span class="lbl">Début réel</span><input type="text" id="bp-real-start" inputmode="numeric" autocomplete="off" placeholder="HH:MM" data-kind="time"></label>
        <label class="field"><span class="lbl">Fin réelle</span><input type="text" id="bp-real-end" inputmode="numeric" autocomplete="off" placeholder="HH:MM" data-kind="time"></label>
      </div>
      <div id="bp-subs">
        <h3 class="subh">Sous-tâches <span id="bp-subs-count"></span></h3>
        <ul class="subs" id="bp-subs-list"></ul>
        <div class="grid2">
          <label class="field"><span class="lbl">Libellé</span><input type="text" id="sub-label" maxlength="80" autocomplete="off"></label>
          <label class="field"><span class="lbl">Action courte</span><input type="text" id="sub-action" maxlength="80" autocomplete="off"></label>
        </div>
        <button type="button" class="btn small" data-bp="add-sub">+ Ajouter la sous-tâche</button>
      </div>
      <span class="err" id="bp-err" hidden></span>
      <div class="btnrow">
        <button type="submit" class="btn primary" id="bp-save">Enregistrer</button>
        <button type="button" class="btn" data-bp="start" id="bp-start">▶ Démarrer maintenant</button>
        <button type="button" class="btn" data-bp="stop" id="bp-stop">■ Arrêter maintenant</button>
        <button type="button" class="btn" data-bp="clear" id="bp-clear">Effacer les heures réelles</button>
        <button type="button" class="btn" data-bp="close">Fermer</button>
        <button type="button" class="btn danger" data-bp="delete" id="bp-del">Supprimer</button>
      </div>
    </form>
    <div id="day-timeline"></div>
  </section>

  <section id="panel-recap" role="tabpanel" aria-labelledby="tab-recap" hidden></section>

  <section id="panel-stats" role="tabpanel" aria-labelledby="tab-stats" hidden></section>

  <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
    <form id="settings-form" novalidate autocomplete="off">
      <div id="form-body"></div>
      <div class="savebar">
        <span class="msg" id="dirty-msg">Aucune modification</span>
        <button type="submit" class="btn primary" id="save-btn">Enregistrer</button>
      </div>
    </form>
  </section>
</main>

<nav class="tabbar" role="tablist" aria-label="Navigation">
  <button type="button" role="tab" id="tab-day" data-tab="day" aria-selected="true">Jour</button>
  <button type="button" role="tab" id="tab-recap" data-tab="recap" aria-selected="false">Récapitulatif</button>
  <button type="button" role="tab" id="tab-stats" data-tab="stats" aria-selected="false">Stats</button>
  <button type="button" role="tab" id="tab-settings" data-tab="settings" aria-selected="false">Réglages</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">Cette app a besoin de JavaScript.</p></noscript>

<script>
(function () {
'use strict';

// ==== 1. CONFIG ====
const APP_VERSION = '0.7.0';          // identique à VERSION dans sw.js (CONVENTIONS.md §10)
const DEFAULT_CARRY = ['act-sax', 'act-menage', 'act-concentration'];   // « À reporter » coché par défaut (réglages sans ce champ)
const DATA_VERSION = 3;               // réglages : 1 = lot 1, 2 = lot 2, 3 = activités uniques
const STORAGE_KEY = 'plandujour.reglages';
const DAYS_KEY = 'plandujour.jours';
const DAYS_VERSION = 2;               // jours : 1 = lot 2, 2 = heures réelles par bloc
const KEEP_DAYS = 400;                // les jours plus anciens sont purgés à l'enregistrement
const DAY_NAMES = ['', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const DAY_SHORT = ['', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
const MODES = { fixed: 'Heure fixe', flex: 'Heure prévue, glisse si retard', free: 'Sans heure (je la lance quand je veux)' };
const MODE_TAG = { fixed: 'heure fixe', flex: 'souple', free: 'sans heure' };

// ==== 2. TEMPS ====
// Minutes depuis minuit en interne ; « HH:MM » en 24 h à l'écran (CONVENTIONS.md §5).
function parseTime(text) {
  if (typeof text !== 'string') return null;
  const t = text.trim().toLowerCase().replace(/\s+/g, '').replace('h', ':');
  const m = /^(\d{1,2}):?(\d{2})?$/.exec(t);
  if (!m) return null;
  const h = Number(m[1]);
  const min = m[2] === undefined ? 0 : Number(m[2]);
  if (h > 23 || min > 59) return null;
  return h * 60 + min;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function formatTime(minutes) { return pad2(Math.floor(minutes / 60)) + ':' + pad2(minutes % 60); }
function formatDuration(minutes) {
  const h = Math.floor(minutes / 60), m = minutes % 60;
  if (h === 0) return m + ' min';
  return m === 0 ? h + ' h' : h + ' h ' + pad2(m);
}
function parseIntStrict(text) {
  const t = String(text).trim();
  return /^\d{1,4}$/.test(t) ? Number(t) : null;
}
function nowMinutes() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }

// ==== 3. VALEURS PAR DÉFAUT ====
function makeAct(id, name, days, mode, entry, start, duration, confirm, carry) {
  return { id: id, name: name, days: days, mode: mode, entry: entry, start: start, duration: duration, confirm: confirm === true,
    carry: carry === undefined ? DEFAULT_CARRY.includes(id) : carry === true };
}
// Profils de journée : lever, coucher, jours habituels, activités retirées. Valeurs du week-end et du télétravail inventées, à régler.
function makeProfile(id, name, wake, bedtime, days, removes) { return { id: id, name: name, wake: wake, bedtime: bedtime, days: days, removes: removes }; }
function defaultProfiles(wake, bedtime, invented) {
  return [
    makeProfile('prof-semaine', 'Semaine', wake, bedtime, [1, 2, 3, 4, 5], []),
    makeProfile('prof-weekend', 'Week-end', invented ? 450 : wake, invented ? 1350 : bedtime, [6, 7], []),
    makeProfile('prof-teletravail', 'Télétravail', invented ? 405 : wake, bedtime, [], ['act-trajet-aller', 'act-trajet-retour'])
  ];
}
function defaultSettings() {
  return {
    version: DATA_VERSION,
    wake: 345,            // 05:45 (profil « Semaine », gardé pour compatibilité)
    bedtime: 1320,        // 22:00
    profiles: defaultProfiles(345, 1320, true),
    relaxFloor: 30,       // détente minimale avant le coucher, à valider
    activities: [
      makeAct('act-trajet-aller', 'Trajet aller', [1, 2, 3, 4, 5], 'fixed', 'end', 390, 60),        // 06:30–07:30
      makeAct('act-trajet-retour', 'Trajet retour', [1, 2, 3, 4, 5], 'fixed', 'end', 960, 75),      // 16:00–17:15
      makeAct('act-cours-sax', 'Cours de saxophone', [3], 'fixed', 'end', 1140, 60),                 // mercredi 19:00
      makeAct('act-orchestre', 'Orchestre', [5], 'fixed', 'end', 1170, 60),                          // vendredi 19:30
      makeAct('act-sax', 'Saxophone', [1, 2, 4, 6, 7], 'flex', 'duration', 1035, 15, true),          // 17:15, glisse si retard, à confirmer
      makeAct('act-menage', 'Ménage', [1, 4], 'flex', 'duration', 1050, 30, true),                   // 17:30, à régler, à confirmer
      makeAct('act-concentration', 'Concentration', [1, 2, 3, 4, 5], 'free', 'duration', null, 90)   // sans heure
    ]
  };
}
function emptyDay() { return { real: {}, ponctuels: [], subtasks: {}, review: {}, profile: null }; }
function emptyDays() { return { version: DAYS_VERSION, days: {} }; }

// ==== 4. STOCKAGE ====
function isMinute(v) { return Number.isInteger(v) && v >= 0 && v <= 1439; }
function pickInt(v, def, min, max) { return Number.isInteger(v) && v >= min && v <= max ? v : def; }
function newId() { return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function cleanDays(list) {
  return Array.isArray(list) ? Array.from(new Set(list.filter((x) => Number.isInteger(x) && x >= 1 && x <= 7))).sort() : [];
}

function sanitizeActs(list, fallback) {

function sanitizeProfiles(list, wake, bedtime) {

function sanitize(raw) {

// Retourne { settings, status } ; status : 'ok' | 'empty' | 'corrupt' | 'unavailable'.

// ---- Données des jours : heures réelles par bloc et blocs ponctuels ----
function cleanReal(r) {
  if (!r || typeof r !== 'object') return null;
  const s = isMinute(r.start) ? r.start : null;
  let e = isMinute(r.end) ? r.end : null;
  if (s !== null && e !== null && e <= s) e = null;
  if (s === null && e === null) return r.missed === true ? { start: null, end: null, missed: true } : null;   // « raté » : aucun horaire réel
  return { start: s, end: e };
}
function cleanSubtasks(list) {
  if (!Array.isArray(list)) return [];
  return list
    .filter((t) => t && typeof t.label === 'string' && t.label.trim())
    .map((t) => ({ id: typeof t.id === 'string' ? t.id : newId(), label: t.label.trim().slice(0, 80), action: typeof t.action === 'string' ? t.action.trim().slice(0, 80) : '', done: t.done === true }));
}
function cleanPonctuel(p) {
  if (!p || typeof p.name !== 'string' || !p.name.trim()) return null;
  const mode = MODES[p.mode] ? p.mode : 'fixed';
  if (!Number.isInteger(p.duration) || p.duration < 1 || p.duration > 1440) return null;
  if (mode !== 'free' && !isMinute(p.start)) return null;
  return {
    id: typeof p.id === 'string' ? p.id : newId(), name: p.name.trim().slice(0, 40), mode: mode, entry: p.entry === 'end' ? 'end' : 'duration',
    start: mode === 'free' ? null : p.start, duration: mode === 'free' ? p.duration : Math.min(p.duration, 1440 - p.start),
    confirm: mode !== 'free' && p.confirm === true,
    carry: p.carry === true,
    from: isDateKey(p.from) ? p.from : null          // jour d'origine d'un bloc reporté
  };
}
function isDateKey(k) { return typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k); }
// Trace d'une revue : { status: 'carried' | 'dropped', part: 'block' | 'subs', to, pid, tkey, sids, setMissed }
function cleanReview(r) {
  if (!r || (r.status !== 'carried' && r.status !== 'dropped')) return null;
  const str = (v) => (typeof v === 'string' ? v : null);
  return {
    status: r.status, part: r.part === 'subs' ? 'subs' : 'block',
    to: r.status === 'carried' && isDateKey(r.to) ? r.to : null,
    pid: str(r.pid), tkey: str(r.tkey),
    sids: Array.isArray(r.sids) ? r.sids.filter((x) => typeof x === 'string') : [],
    setMissed: r.setMissed === true

}
function sanitizeDays(raw) {
  if (!raw || typeof raw !== 'object' || !raw.days || typeof raw.days !== 'object') return null;
  if (raw.version !== 1 && raw.version !== 2) return null;
  const out = emptyDays();
  Object.keys(raw.days).forEach((k) => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    const d = raw.days[k] || {};
    const day = emptyDay();
    if (raw.version === 1) {               // migration : arrivée → fin du trajet aller, départ → début du trajet retour
      if (isMinute(d.arrival)) day.real['act:act-trajet-aller'] = { start: null, end: d.arrival };
      if (isMinute(d.departure)) day.real['act:act-trajet-retour'] = { start: d.departure, end: null };
      (Array.isArray(d.appointments) ? d.appointments : []).forEach((a) => {
        const p = a && cleanPonctuel({ id: a.id, name: a.title, mode: 'fixed', entry: 'duration', start: a.start, duration: a.duration });
        if (p) day.ponctuels.push(p);
      });
    } else {
      if (d.real && typeof d.real === 'object') Object.keys(d.real).forEach((key) => { const r = cleanReal(d.real[key]); if (r) day.real[key] = r; });
      (Array.isArray(d.ponctuels) ? d.ponctuels : []).forEach((p) => { const c = cleanPonctuel(p); if (c) day.ponctuels.push(c); });
      if (d.subtasks && typeof d.subtasks === 'object') Object.keys(d.subtasks).forEach((key) => { const l = cleanSubtasks(d.subtasks[key]); if (l.length) day.subtasks[key] = l; });
      if (typeof d.profile === 'string') day.profile = d.profile;
      if (d.review && typeof d.review === 'object') Object.keys(d.review).forEach((key) => { const r = cleanReview(d.review[key]); if (r) day.review[key] = r; });
    }

}
function loadDays() {
  let text = null;
  try {
    text = window.localStorage.getItem(DAYS_KEY);
    if (text === null) return emptyDays();
    const clean = sanitizeDays(JSON.parse(text));
    if (clean) return clean;
  } catch (e) { /* illisible */ }
  try { if (text !== null) window.localStorage.setItem(DAYS_KEY + '.sauvegarde', text); } catch (e) { /* ignoré */ }
  return emptyDays();
}
function saveDays(data) {
  try {
    const limit = addDays(dateKey(new Date()), -KEEP_DAYS);
    Object.keys(data.days).forEach((k) => { if (k < limit) delete data.days[k]; });
    window.localStorage.setItem(DAYS_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    return false;
  }
}

// ==== 5. VALIDATION ====
function setPath(obj, path, value) {
  const keys = path.split('.');
  const last = keys.pop();
  keys.reduce((o, k) => o[k], obj)[last] = value;
}

// ==== 5B. PLANNING ====
// Fonctions pures : (réglages, données du jour, jour de semaine, heure actuelle) → journée. Aucun accès au DOM ni au stockage.
function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseDateKey(k) { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(k, n) { const d = parseDateKey(k); d.setDate(d.getDate() + n); return dateKey(d); }
function isoWeekday(k) { const g = parseDateKey(k).getDay(); return g === 0 ? 7 : g; }

// nowMin : minutes actuelles si le jour affiché est aujourd'hui, sinon null.
// past : vrai si le jour affiché est antérieur à aujourd'hui (les blocs « à confirmer » non pointés sont alors tous à confirmer).
function resolveProfile(settings, weekday, profileId) {
  const list = settings.profiles && settings.profiles.length ? settings.profiles : [makeProfile('prof-defaut', 'Journée', settings.wake, prof.bedtime, [], [])];
  return list.find((p) => p.id === profileId) || list.find((p) => p.days.includes(weekday)) || list[0];
}

function buildDay(settings, dayData, weekday, nowMin, past) {
  const prof = resolveProfile(settings, weekday, dayData.profile);
  const out = { profile: prof, placed: [], pending: [], gaps: [], warnings: [], running: null, largestGap: 0, toConfirm: [], missed: [], relax: null, review: [], reviewed: [] };
  const items = [];
  settings.activities.forEach((a) => {
    if (a.days.includes(weekday) && !prof.removes.includes(a.id)) items.push({ key: 'act:' + a.id, id: a.id, kind: 'act', name: a.name, mode: a.mode, entry: a.entry, confirm: a.confirm === true, carry: a.carry === true, from: null, plannedStart: a.mode === 'free' ? null : a.start, minutes: a.duration });
  });
  dayData.ponctuels.forEach((p) => {
    items.push({ key: 'p:' + p.id, id: p.id, kind: 'p', name: p.name, mode: p.mode, entry: p.entry, confirm: p.confirm === true, carry: p.carry === true, from: p.from || null, plannedStart: p.mode === 'free' ? null : p.start, minutes: p.duration });
  });
  const timed = [];
  items.forEach((it) => {
    it.real = dayData.real[it.key] || { start: null, end: null };
    it.subs = (dayData.subtasks && dayData.subtasks[it.key]) || [];
    it.review = (dayData.review && dayData.review[it.key]) || null;
    if (it.real.missed) out.missed.push(it);                      // raté : le bloc quitte le plan et libère son temps
    else if (it.mode === 'free' && it.real.start === null) out.pending.push(it);
    else timed.push(it);
  });
  timed.forEach((it) => { it.sortKey = it.real.start !== null ? it.real.start : it.plannedStart; });
  timed.sort((a, b) => a.sortKey - b.sortKey);

  // Placement : un bloc souple glisse après la fin la plus tardive des blocs qui le précèdent.
  let cursor = -1;
  timed.forEach((it) => {
    const r = it.real;
    let start;
    if (r.start !== null) start = r.start;
    else if (it.mode === 'flex') start = Math.max(it.plannedStart, cursor);
    else start = it.plannedStart;
    let end, state;
    if (r.end !== null) { end = r.end; state = 'done'; }
    else if (r.start !== null) {
      if (nowMin !== null) { end = Math.max(start + it.minutes, nowMin); state = 'running'; } else { end = start + it.minutes; state = 'started'; }
    } else { end = start + it.minutes; state = 'planned'; }
    if (end <= start) end = start + 1;
    it.start = start; it.end = end; it.state = state;
    it.shift = it.plannedStart !== null && r.start === null && start > it.plannedStart ? start - it.plannedStart : 0;
    cursor = Math.max(cursor, end);
    if (state === 'running') out.running = it;
    if (it.confirm && state === 'planned' && (past === true || (nowMin !== null && end <= nowMin))) out.toConfirm.push(it);
  });

  // Temps disponible entre deux blocs (du lever au premier bloc, puis jusqu'au coucher).
  const byStart = timed.slice().sort((a, b) => a.start - b.start || a.end - b.end);
  let prevEnd = prof.wake, prev = null;
  byStart.forEach((it) => {
    if (it.start > prevEnd) out.gaps.push({ from: prevEnd, to: it.start, minutes: it.start - prevEnd, last: false });
    else if (prev && it.start < prevEnd) out.warnings.push('« ' + prev.name + ' » (' + formatTime(prev.start) + '–' + formatTime(prev.end) + ') chevauche « ' + it.name + ' » (' + formatTime(it.start) + '–' + formatTime(it.end) + ').');
    if (it.end > prevEnd || prev === null) { prevEnd = Math.max(prevEnd, it.end); prev = it; }
  });
  if (byStart.length) {
    out.relax = Math.max(0, prof.bedtime - prevEnd);
    if (prof.bedtime > prevEnd) {
      out.gaps.push({ from: prevEnd, to: prof.bedtime, minutes: prof.bedtime - prevEnd, last: true });
      if (prof.bedtime - prevEnd < settings.relaxFloor) out.warnings.push('Il ne reste que ' + formatDuration(prof.bedtime - prevEnd) + ' avant le coucher (détente minimale : ' + formatDuration(settings.relaxFloor) + ').');
    } else {
      out.warnings.push('Les blocs vont jusqu’à ' + formatTime(prevEnd) + ', après l’heure du coucher (' + formatTime(prof.bedtime) + ').');
    }
  }
  out.gaps.forEach((g) => { out.largestGap = Math.max(out.largestGap, g.minutes); });
  out.placed = byStart;

  // Revue du jour : blocs « à reporter » non faits, ou faits avec des sous-tâches non cochées. Les blocs déjà traités sont listés à part.
  // (state : absent pour un bloc sans heure non lancé et pour un raté ; 'planned' | 'running' | 'started' | 'done' sinon.)
  timed.concat(out.pending, out.missed).forEach((it) => {
    if (it.review) { out.reviewed.push(it); return; }
    if (!it.carry || it.state === 'running') return;
    const unchecked = it.subs.filter((t) => !t.done).length;
    const notDone = it.state === undefined || it.state === 'planned';
    if (notDone || unchecked > 0) out.review.push({ item: it, part: notDone ? 'block' : 'subs', unchecked: unchecked, total: it.subs.length });
  });
  return out;
}

// Statistiques : temps réel (fin − début) par nom d'activité sur les jours de `from` à `to` inclus. Les blocs ratés ou non terminés ne comptent pas.
function statsFor(daysMap, settings, from, to) {
  const names = {};
  settings.activities.forEach((a) => { names['act:' + a.id] = a.name; });
  const totals = {};
  let daysUsed = 0;
  Object.keys(daysMap).sort().forEach((k) => {
    if (k < from || k > to) return;
    const d = daysMap[k];
    (d.ponctuels || []).forEach((p) => { names['p:' + p.id] = p.name; });
    let used = false;
    Object.keys(d.real).forEach((key) => {
      const r = d.real[key];
      if (r.missed || r.start === null || r.end === null) return;
      const name = names[key] || 'Activité supprimée';
      totals[name] = (totals[name] || 0) + (r.end - r.start);
      used = true;
    });
    if (used) daysUsed++;
  });
  const rows = Object.keys(totals).map((n) => ({ name: n, minutes: totals[n] })).sort((a, b) => b.minutes - a.minutes || a.name.localeCompare(b.name, 'fr'));
  return { rows: rows, total: rows.reduce((t, r) => t + r.minutes, 0), daysUsed: daysUsed };
}
function statsRange(mode, anchor) {
  if (mode === 'month') {
    const d = parseDateKey(anchor);
    return { from: dateKey(new Date(d.getFullYear(), d.getMonth(), 1)), to: dateKey(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
  }
  const from = addDays(anchor, -(isoWeekday(anchor) - 1));
  return { from: from, to: addDays(from, 6) };
}

// Répartit en colonnes les blocs qui se chevauchent (affichage uniquement).
function layoutColumns(items) {
  items.sort((a, b) => a.start - b.start || b.end - a.end);
  let cluster = null;
  const clusters = [];
  items.forEach((it) => {
    if (!cluster || it.start >= cluster.end) { cluster = { end: it.end, cols: [], items: [] }; clusters.push(cluster); }
    let c = cluster.cols.findIndex((e) => e <= it.start);
    if (c === -1) { c = cluster.cols.length; cluster.cols.push(0); }
    cluster.cols[c] = it.end;
    it.col = c;
    cluster.end = Math.max(cluster.end, it.end);
    cluster.items.push(it);
  });
  clusters.forEach((cl) => cl.items.forEach((it) => { it.colCount = cl.cols.length; }));
  return items;
}

function updateRowUi(row) {
  const mode = $('[data-a=mode]', row).value, entry = $('[data-a=entry]', row).value;
  const isTime = mode !== 'free' && entry === 'end';
  const sec = $('[data-a=second]', row);
  row.dataset.mode = mode;
  $('[data-a-label]', row).textContent = isTime ? 'Fin' : 'Durée (minutes)';
  sec.dataset.kind = isTime ? 'time' : 'int';
  sec.placeholder = isTime ? 'HH:MM' : '';
}
// Passe de « fin » à « durée » (et inversement) en gardant la même durée.
function convertSecond(row, newEntry) {
  const start = parseTime($('[data-a=start]', row).value);
  const sec = $('[data-a=second]', row);
  if (start === null) return;
  if (newEntry === 'duration') {
    const end = parseTime(sec.value);
    if (end !== null && end > start) sec.value = String(end - start);
  } else {
    const d = parseIntStrict(sec.value);
    if (d !== null && start + d < 1440) sec.value = formatTime(start + d);
  }
}
function readActRaw(row) {
  return {
    id: row.dataset.id, name: $('[data-a=name]', row).value, mode: $('[data-a=mode]', row).value, entry: $('[data-a=entry]', row).value,
    start: $('[data-a=start]', row).value, second: $('[data-a=second]', row).value, confirm: $('[data-a=confirm]', row).checked, carry: $('[data-a=carry]', row).checked,
    days: $$('.chip[aria-pressed=true]', row).map((c) => Number(c.dataset.day))
  };
}
// Lit et valide une ligne d'activité ; retourne l'activité ou null (champs invalides marqués).
function readActRow(row, errors) {
  const nameEl = $('[data-a=name]', row), startEl = $('[data-a=start]', row), secEl = $('[data-a=second]', row);
  const mode = $('[data-a=mode]', row).value, entry = $('[data-a=entry]', row).value;
  const before = errors.length;
  const name = nameEl.value.trim();
  if (!name) flag(nameEl, 'Nom obligatoire', errors);
  let start = null, duration = null;
  if (mode === 'free') {
    duration = parseIntStrict(secEl.value);
    if (duration === null || duration < 1 || duration > 1440) flag(secEl, 'Durée entre 1 et 1440 min', errors);
  } else {
    start = parseTime(startEl.value);
    if (start === null) flag(startEl, 'Heure de début invalide (ex. 09:00)', errors);
    if (entry === 'end') {
      const end = parseTime(secEl.value);
      if (end === null) flag(secEl, 'Heure de fin invalide (ex. 10:30)', errors);
      else if (start !== null && end <= start) flag(secEl, 'La fin doit être après le début', errors);
      else if (start !== null) duration = end - start;
    } else {
      duration = parseIntStrict(secEl.value);
      if (duration === null || duration < 1 || duration > 1440) flag(secEl, 'Durée entre 1 et 1440 min', errors);
      else if (start !== null && start + duration > 1440) flag(secEl, 'Dépasse minuit', errors);
    }
  }
  if (errors.length > before) return null;
  return { id: row.dataset.id || newId(), name: name, days: $$('.chip[aria-pressed=true]', row).map((c) => Number(c.dataset.day)), mode: mode, entry: entry, start: start, duration: duration,
    confirm: mode !== 'free' && $('[data-a=confirm]', row).checked, carry: $('[data-a=carry]', row).checked };
}

function readProfRow(row, errors) {

function renderRecap(s, status) {
  let html = '';
  if (status === 'empty') html += '<div class="banner info">Valeurs de départ affichées. Rien n’est enregistré tant que tu n’as pas appuyé sur « Enregistrer » dans Réglages.</div>';
  if (status === 'corrupt') html += '<div class="banner warn">Les données enregistrées sont illisibles : les valeurs de départ sont affichées. Elles ne seront remplacées que lorsque tu enregistreras.</div>';
  if (status === 'unavailable') html += '<div class="banner warn">Le stockage du navigateur est indisponible (navigation privée ?). Tu peux saisir, mais rien ne sera conservé.</div>';
  html += '<div class="chips" style="margin:12px 0">' + [1, 2, 3, 4, 5, 6, 7].map((d) =>
    '<button type="button" class="chip" data-recap-day="' + d + '" aria-pressed="' + (d === recapDay) + '">' + DAY_SHORT[d] + '</button>').join('') + '</div>';

  const b = buildDay(s, emptyDay(), recapDay, null);

  b.placed.forEach((it) => {
    entries.push({ at: it.start, html: '<li><span class="t">' + formatTime(it.start) + '–' + formatTime(it.end) + '</span><span class="dot"></span><span class="what">' + esc(it.name) +
      '<small>' + MODE_TAG[it.mode] + '</small></span></li>' });
  });
  b.gaps.forEach((g) => {
    entries.push({ at: g.from + 0.1, html: '<li class="gapli"><span class="t">' + formatDuration(g.minutes) + '</span><span class="dot"></span><span class="what">disponible' + (g.last ? ' avant le coucher' : '') + '</span></li>' });
  });
  entries.push({ at: 99999, html: '<li class="mark"><span class="t">' + formatTime(b.profile.bedtime) + '</span><span class="dot"></span><span class="what">Coucher</span></li>' });
  entries.sort((x, y) => x.at - y.at);
  html += '<div class="card"><h2>' + DAY_NAMES[recapDay] + ' <span class="v">· profil ' + esc(b.profile.name) + '</span></h2><ul class="tl">' + entries.map((e) => e.html).join('') + '</ul>' +
    (b.placed.length ? '' : '<p class="help">Aucune activité ce jour-là.</p>') + '</div>';
  if (b.pending.length) {
    html += '<div class="card"><h2>Sans heure</h2><ul class="rows">' + b.pending.map((it) =>
      '<li><span>' + esc(it.name) + '</span><span class="v">' + formatDuration(it.minutes) + '</span></li>').join('') + '</ul>' +
      '<p class="help" style="margin-top:8px">Plus grand temps disponible : ' + formatDuration(b.largestGap) + '.</p></div>';
  }
  $('#panel-recap').innerHTML = html;
}

  }
  if (build.toConfirm.length) {
    head += '<div class="card"><h2>À confirmer</h2><ul class="rows">' + build.toConfirm.map((it) =>
      '<li><span>' + esc(it.name) + ' <span class="v">· ' + formatTime(it.start) + '–' + formatTime(it.end) + '</span></span><span>' +
      '<button type="button" class="btn small primary" data-action="confirm-done" data-key="' + esc(it.key) + '">Fait</button> ' +
      '<button type="button" class="btn small" data-action="confirm-missed" data-key="' + esc(it.key) + '">Raté</button></span></li>').join('') + '</ul></div>';
  }
  if (build.running) {
    const r = build.running;
    head += '<div class="runbar"><div><strong>' + esc(r.name) + '</strong><small>en cours depuis ' + formatTime(r.start) + ' · ' + formatDuration(Math.max(0, dayNow() - r.start)) +
      ' (prévu ' + formatDuration(r.minutes) + ')</small></div><button type="button" class="btn" data-action="stop" data-key="' + esc(r.key) + '">■ Arrêter</button></div>';
  }
  head += pickHtml(build) + reviewHtml(build, dateKey(new Date()));
  if (build.pending.length) {
    head += '<div class="card"><h2>Sans heure</h2><ul class="rows">' + build.pending.map((it) =>
      '<li><span>' + esc(it.name) + ' <span class="v">· ' + formatDuration(it.minutes) + (it.subs.length ? ' · ' + subsProgress(it) : '') + (it.from ? ' · reporté de ' + fromLabel(it.from) : '') + '</span></span><span>' +
      (dayNow() !== null ? '<button type="button" class="btn small primary" data-action="start" data-key="' + esc(it.key) + '">▶ Démarrer</button> ' : '') +
      '<button type="button" class="btn small" data-action="open-block" data-key="' + esc(it.key) + '">Détails</button></span></li>').join('') + '</ul>' +
      '<p class="hours-help">Plus grand temps disponible : ' + formatDuration(build.largestGap) +
      (build.pending.some((it) => it.minutes > build.largestGap) ? ' — au moins un bloc ne tient dans aucun créneau (rien n’est supprimé).' : '.') + '</p></div>';
  }
  if (build.warnings.length) head += '<div class="banner warn"><strong>À vérifier</strong><ul>' + build.warnings.map((w) => '<li>' + esc(w) + '</li>').join('') + '</ul></div>';
  if (build.missed.length) {
    head += '<div class="card"><h2>Ratés</h2><ul class="rows">' + build.missed.map((it) =>
      '<li><span>' + esc(it.name) + (it.plannedStart !== null ? ' <span class="v">· prévu ' + formatTime(it.plannedStart) + '</span>' : '') +
      (it.review ? ' <span class="v">· ' + esc(reviewDoneText(it)) + '</span>' : '') + '</span><span>' +
      (!it.review && selectedDate <= dateKey(new Date()) ? '<button type="button" class="btn small" data-action="rv-pick" data-key="' + esc(it.key) + '">Reporter…</button> ' : '') +
      '<button type="button" class="btn small" data-action="unmiss" data-key="' + esc(it.key) + '">Rétablir</button></span></li>').join('') + '</ul></div>';
  }
  $('#day-head').innerHTML = head;

  // Timeline
  const t = build.profile;
  const items = build.placed.map((b) => Object.assign({}, b));
  let lo = Math.min.apply(null, [t.wake].concat(items.map((b) => b.start)));
  let hi = Math.max.apply(null, [t.bedtime].concat(items.map((b) => b.end)));
  lo = Math.floor(lo / 60) * 60;
  hi = Math.min(1440, Math.ceil(hi / 60) * 60);
  layoutColumns(items);
  const y = (m) => (m - lo) * PX;
  let html = '<div class="tlwrap"><div class="tlarea" style="height:' + (hi - lo) * PX + 'px">';
  for (let m = lo; m <= hi; m += 60) html += '<div class="hline" style="top:' + y(m) + 'px"><span>' + pad2(m / 60) + ':00</span></div>';
  html += '<div class="marker" style="top:' + y(t.wake) + 'px"><span>Lever ' + formatTime(t.wake) + '</span></div>';
  html += '<div class="marker" style="top:' + y(t.bedtime) + 'px"><span>Coucher ' + formatTime(t.bedtime) + '</span></div>';
  build.gaps.forEach((g) => {
    const h = g.minutes * PX;
    html += '<div class="gap" style="top:' + y(g.from) + 'px;height:' + h + 'px">' + (h >= 18 ? formatDuration(g.minutes) + (g.last ? ' avant le coucher' : ' disponible') : '') + '</div>';
  });
  items.forEach((b) => {
    const h = Math.max((b.end - b.start) * PX - 2, 22);
    const w = 100 / b.colCount;
    let note = '';
    if (b.state === 'running') note = ' · en cours';
    else if (b.state === 'done') note = ' · terminé';
    if (b.shift) note += ' · décalé de ' + formatDuration(b.shift) + ' (prévu ' + formatTime(b.plannedStart) + ')';
    if (b.subs.length) note += ' · ' + subsProgress(b);
    if (b.from) note += ' · reporté de ' + fromLabel(b.from);
    html += '<button type="button" class="blk b-' + b.mode + (b.state === 'done' ? ' b-done' : '') + (b.state === 'running' ? ' b-running' : '') + (h < 40 ? ' short' : '') +
      '" data-action="open-block" data-key="' + esc(b.key) + '" style="top:' + y(b.start) + 'px;height:' + h + 'px;left:calc(' + b.col * w + '% + 1px);width:calc(' + w + '% - 3px)">' +
      '<span class="bn">' + (b.state === 'done' ? '✓ ' : '') + esc(b.name) + '</span><span class="bt">' + formatTime(b.start) + '–' + formatTime(b.end) + esc(note) + '</span></button>';
  });
  html += '</div></div>';
  $('#day-timeline').innerHTML = html;
}

let toastTimer = null;

function switchTab(name) {

// ---- Marquage des erreurs de saisie ----
function errHost(el) { return el.closest('.act-row') || el.closest('.field'); }
function clearFlags(root) {
  $$('[aria-invalid]', root).forEach((el) => el.removeAttribute('aria-invalid'));
  $$('.err', root).forEach((el) => { el.textContent = ''; el.hidden = true; });
}
function flag(el, message, errors) {
  el.setAttribute('aria-invalid', 'true');
  for (let d = el.closest('details'); d; d = d.parentElement && d.parentElement.closest('details')) d.open = true;   // ligne ou carte repliée : on l'ouvre
  const err = errHost(el).querySelector('.err');
  err.textContent = err.textContent ? err.textContent + ' · ' + message : message;
  err.hidden = false;
  errors.push({ el: el, message: message });
}

// Retourne { settings, errors }. Les champs invalides sont marqués dans le formulaire.
function readForm() {
  const form = $('#settings-form');
  clearFlags(form);
  const errors = [];
  const s = defaultSettings();
  const parsed = {};
  $$('[data-kind=time][data-path]', form).forEach((inp) => {
    const v = parseTime(inp.value);
    if (v === null) { flag(inp, 'Heure invalide (ex. 06:53)', errors); return; }
    parsed[inp.dataset.path] = v;
    setPath(s, inp.dataset.path, v);
  });
  $$('[data-kind=int][data-path]', form).forEach((inp) => {
    const min = Number(inp.dataset.min), max = Number(inp.dataset.max);
    const v = parseIntStrict(inp.value);
    if (v === null || v < min || v > max) { flag(inp, 'Nombre entier entre ' + min + ' et ' + max, errors); return; }
    setPath(s, inp.dataset.path, v);
  });
  s.activities = [];
  $$('#acts-list .act-row', form).forEach((row) => {
    const a = readActRow(row, errors);
    if (a) s.activities.push(a);
  });
  s.profiles = [];
  $$('#profs-list .prof-row', form).forEach((row) => {
    const p = readProfRow(row, errors);
    if (p) s.profiles.push(p);
  });
  const actIds = s.activities.map((a) => a.id);
  s.profiles.forEach((p) => { p.removes = p.removes.filter((id) => actIds.includes(id)); });
  if (!errors.length && !s.profiles.length) { s.profiles = defaultProfiles(345, 1320, true).slice(0, 1); }
  if (s.profiles.length) { s.wake = s.profiles[0].wake; s.bedtime = s.profiles[0].bedtime; }
  return { settings: s, errors: errors };
}

// ==== 7. ÉVÉNEMENTS ====
let current = null;     // réglages enregistrés (ou valeurs de départ)
let loadStatus = 'empty';
let dirty = false;
let daysData = emptyDays();   // heures réelles et blocs ponctuels, par date
let selectedDate = null;      // « AAAA-MM-JJ » du jour affiché
let panelKey = null;          // clé du bloc ouvert dans le panneau ; null = nouveau bloc ponctuel
let panelOpen = false;

function setDirty(value) {
  dirty = value;
  const msg = $('#dirty-msg');
  msg.textContent = dirty ? 'Modifications non enregistrées' : 'Aucune modification';
  msg.classList.toggle('dirty', dirty);
}

function ensureDay() {
  if (!daysData.days[selectedDate]) daysData.days[selectedDate] = emptyDay();
  return daysData.days[selectedDate];
}
function persistDays() {
  if (!saveDays(daysData)) showToast('Enregistrement impossible sur cet appareil', 'err');
}

// ---- Chrono ----
function startNow(key) {
  const now = dayNow();
  if (now === null) return;
  const day = ensureDay();
  Object.keys(day.real).forEach((k) => {           // un seul bloc en cours à la fois : on arrête les autres
    const r = day.real[k];
    if (k !== key && r.start !== null && r.end === null) r.end = Math.min(1439, Math.max(now, r.start + 1));
  });
  day.real[key] = { start: now, end: null };
  persistDays();
  renderDay();
}
function stopNow(key) {
  const now = dayNow();
  const day = ensureDay();
  const r = day.real[key];
  if (now === null || !r || r.start === null) return;
  r.end = Math.min(1439, Math.max(now, r.start + 1));
  persistDays();
  renderDay();
}

// ---- Sauvegarde : export et import ----
function exportPayload() {
  return { app: 'plandujour', format: 1, appVersion: APP_VERSION, exportedAt: new Date().toISOString(), settings: current, days: daysData };
}
async function doExport() {
  if (dirty) { showToast('Enregistre d’abord tes modifications', 'err'); return; }
  const text = JSON.stringify(exportPayload());
  const name = 'plandujour-' + dateKey(new Date()) + '.json';
  try {                                                   // iPhone / iPad : feuille de partage (« Enregistrer dans Fichiers »)
    const file = new File([text], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Plan du jour' }); showToast('Export prêt'); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');                  // sinon : téléchargement classique
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  showToast('Fichier téléchargé');
}
// Lit et valide un fichier d'export ; retourne null s'il n'est pas reconnu. Rien n'est écrit.
function readImportText(text) {
  let raw;
  try { raw = JSON.parse(text); } catch (e) { return null; }
  if (!raw || typeof raw !== 'object' || raw.app !== 'plandujour') return null;
  const settings = sanitize(raw.settings), days = sanitizeDays(raw.days);
  if (!settings || !days) return null;
  return { settings: settings, days: days, exportedAt: typeof raw.exportedAt === 'string' ? raw.exportedAt : null };
}
function renderImportBox() {
  const box = $('#import-box');
  if (!box) return;
  const p = pendingImport;
  if (!p) { box.innerHTML = ''; return; }
  const d = p.exportedAt ? new Date(p.exportedAt) : null;
  const when = d && !isNaN(d.getTime()) ? d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : 'date inconnue';
  box.innerHTML = '<div class="imp"><strong>Fichier du ' + esc(when) + '</strong>' +
    '<p class="help" style="margin:4px 0 8px">' + plural(p.settings.activities.length, 'activité', 'activités') + ', ' + plural(p.settings.profiles.length, 'profil', 'profils') + ', ' +
    plural(Object.keys(p.days.days).length, 'jour', 'jours') + '. Une copie de sécurité de cet appareil est gardée avant de remplacer.</p>' +
    '<div class="btnrow"><button type="button" class="btn primary" data-action="imp-all">Tout remplacer sur cet appareil</button>' +
    '<button type="button" class="btn" data-action="imp-settings">Remplacer les réglages seulement (garder mes jours)</button>' +
    '<button type="button" class="btn" data-action="imp-cancel">Annuler</button></div></div>';
}
function applyImport(mode) {
  const p = pendingImport;
  if (!p) return;
  try {                                                   // filet de sécurité : l'état d'avant, une seule fois
    const rs = window.localStorage.getItem(STORAGE_KEY), rd = window.localStorage.getItem(DAYS_KEY);
    if (rs !== null) window.localStorage.setItem('plandujour.avant-import.reglages', rs);
    if (rd !== null) window.localStorage.setItem('plandujour.avant-import.jours', rd);
  } catch (e) { /* ignoré */ }
  if (!saveSettings(p.settings)) { showToast('Enregistrement impossible sur cet appareil', 'err'); return; }
  current = p.settings;
  loadStatus = 'ok';
  if (mode === 'all') { daysData = p.days; if (!saveDays(daysData)) showToast('Enregistrement impossible sur cet appareil', 'err'); }
  pendingImport = null;
  closePanel();
  closePick();
  renderForm(current);
  renderRecap(current, loadStatus);
  renderDay();
  setDirty(false);
  showToast(mode === 'all' ? 'Données remplacées' : 'Réglages remplacés');
}
async function onImportFile(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  pendingImport = null;
  let parsed = null;
  try { if (f.size <= 5 * 1024 * 1024) parsed = readImportText(await f.text()); } catch (e) { parsed = null; }
  if (!parsed) { renderImportBox(); showToast('Fichier non reconnu : rien n’a été modifié', 'err'); return; }
  pendingImport = parsed;
  renderImportBox();
}

// ---- Revue du jour : reporter / abandonner / annuler ----
function findItem(key) { const b = buildSelected(); return b.placed.concat(b.pending, b.missed).find((x) => x.key === key) || null; }

// Reporte vers le jour `target` (strictement après le jour affiché).
// Un bloc non fait devient un bloc ponctuel « sans heure » du jour cible, avec ses sous-tâches non cochées ; l'original quitte le plan (comme un raté).
// Un bloc fait garde sa place : seules ses sous-tâches non cochées partent (sur la même activité si elle est prévue ce jour-là, sinon dans un bloc sans heure).
function carryItem(key, target) {
  const it = findItem(key);
  if (!it || it.review || !isDateKey(target) || target <= selectedDate) return false;
  const src = ensureDay();
  const unchecked = (src.subtasks[key] || []).filter((t) => !t.done);
  const notDone = it.state === undefined || it.state === 'planned';
  if (!notDone && !unchecked.length) return false;
  if (!daysData.days[target]) daysData.days[target] = emptyDay();
  const dst = daysData.days[target];
  const rv = { status: 'carried', part: notDone ? 'block' : 'subs', to: target, pid: null, tkey: null, sids: [], setMissed: false };
  const act = it.kind === 'act' ? current.activities.find((a) => a.id === it.id) : null;
  if (!notDone && act && act.days.includes(isoWeekday(target))) {
    rv.tkey = key;                                   // même activité, déjà prévue ce jour-là
  } else {
    const p = { id: newId(), name: it.name, mode: 'free', entry: 'duration', start: null, duration: it.minutes, confirm: false, carry: true, from: selectedDate };
    dst.ponctuels.push(p);
    rv.pid = p.id; rv.tkey = 'p:' + p.id;
  }
  if (unchecked.length) {
    if (!dst.subtasks[rv.tkey]) dst.subtasks[rv.tkey] = [];
    unchecked.forEach((t) => {
      const c = { id: newId(), label: t.label, action: t.action, done: false };
      dst.subtasks[rv.tkey].push(c);
      rv.sids.push(c.id);
    });
  }
  if (notDone && !(src.real[key] && src.real[key].missed)) { src.real[key] = { start: null, end: null, missed: true }; rv.setMissed = true; }
  src.review[key] = rv;
  persistDays();
  return true;
}
function dropItem(key) {
  const it = findItem(key);
  if (!it || it.review) return;
  const src = ensureDay();
  const notDone = it.state === undefined || it.state === 'planned';
  const rv = { status: 'dropped', part: notDone ? 'block' : 'subs', to: null, pid: null, tkey: null, sids: [], setMissed: false };
  if (notDone && !(src.real[key] && src.real[key].missed)) { src.real[key] = { start: null, end: null, missed: true }; rv.setMissed = true; }
  src.review[key] = rv;
  persistDays();
}
// Défait un report ou un abandon : retire la copie du jour cible et remet le bloc dans le plan s'il l'avait quitté à cause du report.
function undoReview(key) {
  const src = ensureDay();
  const rv = src.review[key];
  if (!rv) return;
  if (rv.status === 'carried' && rv.to && daysData.days[rv.to]) {
    const dst = daysData.days[rv.to];
    if (rv.pid) {
      dst.ponctuels = dst.ponctuels.filter((p) => p.id !== rv.pid);
      delete dst.real['p:' + rv.pid];
      delete dst.subtasks['p:' + rv.pid];
      delete dst.review['p:' + rv.pid];
    } else if (rv.tkey && dst.subtasks[rv.tkey]) {
      dst.subtasks[rv.tkey] = dst.subtasks[rv.tkey].filter((t) => !rv.sids.includes(t.id));
      if (!dst.subtasks[rv.tkey].length) delete dst.subtasks[rv.tkey];
    }
  }
  if (rv.setMissed && src.real[key] && src.real[key].missed) delete src.real[key];
  delete src.review[key];
  persistDays();
}
function closePick() { reviewPick = null; reviewError = ''; }

// ---- Panneau d'un bloc (détails, heures réelles, bloc ponctuel) ----
function closePanel() { $('#block-panel').hidden = true; panelOpen = false; panelKey = null; }

function renderSubs() {
  const day = daysData.days[selectedDate];
  const list = (day && day.subtasks[panelKey]) || [];
  $('#bp-subs-count').textContent = list.length ? '(' + list.filter((t) => t.done).length + '/' + list.length + ')' : '';
  $('#bp-subs-list').innerHTML = list.map((t) =>
    '<li><label class="subchk"><input type="checkbox" data-sub-done="' + esc(t.id) + '"' + (t.done ? ' checked' : '') + '><span class="subtxt"><span class="sublabel' + (t.done ? ' done' : '') + '">' +
    esc(t.label) + '</span>' + (t.action ? '<small>' + esc(t.action) + '</small>' : '') + '</span></label>' +
    '<button type="button" class="icon-btn" data-sub-del="' + esc(t.id) + '" aria-label="Supprimer la sous-tâche">✕</button></li>').join('');
}
function addSub() {
  const labelEl = $('#sub-label');
  const label = labelEl.value.trim();
  labelEl.removeAttribute('aria-invalid');
  if (!label || !panelKey) { labelEl.setAttribute('aria-invalid', 'true'); labelEl.focus(); return; }
  const day = ensureDay();
  if (!day.subtasks[panelKey]) day.subtasks[panelKey] = [];
  day.subtasks[panelKey].push({ id: newId(), label: label.slice(0, 80), action: $('#sub-action').value.trim().slice(0, 80), done: false });
  persistDays();
  labelEl.value = '';
  $('#sub-action').value = '';
  renderSubs();
  renderDay();
  labelEl.focus();
}

function openPanel(key) {
  const form = $('#block-panel');
  const build = buildSelected();
  const it = key ? build.placed.concat(build.pending, build.missed).find((x) => x.key === key) : null;
  if (key && !it) return;
  panelKey = key;
  panelOpen = true;
  clearFlags(form);
  const isP = !it || it.kind === 'p';
  const today = dayNow() !== null;
  $('#bp-title').textContent = it ? it.name : 'Nouveau bloc ponctuel';
  $('#bp-edit').innerHTML = isP
    ? actRowHtml(actToRaw(it ? { id: it.id, name: it.name, mode: it.mode, entry: it.entry, start: it.plannedStart, duration: it.minutes, confirm: it.confirm, carry: it.carry } :
      { id: newId(), name: '', mode: 'fixed', entry: 'duration', start: null, duration: 60, confirm: false, carry: false }), { days: false, del: false })
    : '';
  if (it && it.mode === 'free') { /* durée seule */ }
  $('#bp-planned').textContent = !it ? 'Un bloc ponctuel ne concerne que ce jour.'
    : (it.mode === 'free' ? 'Sans heure · ' + formatDuration(it.minutes) : 'Prévu : ' + formatTime(it.plannedStart) + '–' + formatTime(it.plannedStart + it.minutes) + ' · ' + MODE_TAG[it.mode]) +
      (it.from ? ' · reporté de ' + fromLabel(it.from) : '') + (it.kind === 'act' ? ' · à modifier dans Réglages' : '');
  $('#bp-real').hidden = !it;
  const real = it ? it.real : { start: null, end: null };
  $('#bp-real-start').value = real.start === null ? '' : formatTime(real.start);
  $('#bp-real-end').value = real.end === null ? '' : formatTime(real.end);
  $('#bp-start').hidden = !(it && today && real.start === null);
  $('#bp-stop').hidden = !(it && today && real.start !== null && real.end === null);
  $('#bp-clear').hidden = !(it && (real.start !== null || real.end !== null));
  $('#bp-del').hidden = !(it && isP);
  $('#bp-save').textContent = it ? 'Enregistrer' : 'Ajouter';
  $('#bp-subs').hidden = !it;
  $('#sub-label').value = '';
  $('#sub-action').value = '';
  $('#sub-label').removeAttribute('aria-invalid');
  if (it) renderSubs();
  $('#bp-err').hidden = true;
  form.hidden = false;
  form.scrollIntoView({ block: 'center' });
  const first = $('[data-a=name]', form);
  if (first && !it) first.focus();
}

function savePanel() {
  const form = $('#block-panel');
  clearFlags(form);
  const errors = [];
  const build = buildSelected();
  const it = panelKey ? build.placed.concat(build.pending, build.missed).find((x) => x.key === panelKey) : null;
  const isP = !it || it.kind === 'p';
  let edited = null;
  if (isP) { edited = readActRow($('#bp-edit .act-row'), errors); }
  let rs = null, re = null;
  if (it) {
    const sEl = $('#bp-real-start'), eEl = $('#bp-real-end');
    if (sEl.value.trim() !== '') { rs = parseTime(sEl.value); if (rs === null) flag(sEl, 'Heure invalide', errors); }
    if (eEl.value.trim() !== '') { re = parseTime(eEl.value); if (re === null) flag(eEl, 'Heure invalide', errors); }
    const mode = edited ? edited.mode : it.mode;
    if (rs !== null && re !== null && re <= rs) flag(eEl, 'La fin doit être après le début', errors);
    if (mode === 'free' && re !== null && rs === null) flag(sEl, 'Renseigne aussi le début', errors);
  }
  if (errors.length) {
    const msg = $('#bp-err');
    msg.textContent = 'À corriger : ' + errors.map((e) => e.message.toLowerCase()).join(' ; ') + '.';
    msg.hidden = false;
    return;
  }
  const day = ensureDay();
  let key = panelKey;
  if (isP && edited) {
    const p = { id: edited.id, name: edited.name, mode: edited.mode, entry: edited.entry, start: edited.start, duration: edited.duration, confirm: edited.confirm, carry: edited.carry, from: it ? it.from : null };
    if (!it) { day.ponctuels.push(p); key = 'p:' + p.id; }
    else { const i = day.ponctuels.findIndex((x) => 'p:' + x.id === panelKey); if (i >= 0) day.ponctuels[i] = p; }
  }
  if (it && key) { if (rs === null && re === null) delete day.real[key]; else day.real[key] = { start: rs, end: re }; }
  persistDays();
  closePanel();
  renderDay();
}

function bindDayEvents() {
  const panel = $('#panel-day');
  panel.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-day-nav]');
    if (nav) {
      const v = nav.dataset.dayNav;
      const target = v === 'today' ? dateKey(new Date()) : addDays(selectedDate, Number(v));
      if (target !== selectedDate) { closePick(); reviewOpen = null; }       // la revue se replie quand on change de jour
      selectedDate = target;
      closePanel();
      renderDay();
      return;
    }
    const act = e.target.closest('[data-action]');
    if (act) {
      const a = act.dataset.action;
      if (a === 'add-block') openPanel(null);
      else if (a === 'open-block') openPanel(act.dataset.key);
      else if (a === 'start') startNow(act.dataset.key);
      else if (a === 'stop') stopNow(act.dataset.key);
      else if (a === 'confirm-done') {
        const it = buildSelected().toConfirm.find((x) => x.key === act.dataset.key);
        if (it) { ensureDay().real[it.key] = { start: it.start, end: it.end }; persistDays(); renderDay(); }
      } else if (a === 'confirm-missed') { ensureDay().real[act.dataset.key] = { start: null, end: null, missed: true }; persistDays(); renderDay(); }
      else if (a === 'unmiss') { const k = act.dataset.key; undoReview(k); delete ensureDay().real[k]; persistDays(); renderDay(); }
      else if (a === 'rv-toggle') { const today = dateKey(new Date()); reviewOpen = !(reviewOpen === null ? selectedDate < today : reviewOpen); renderDay(); }
      else if (a === 'rv-pick') { reviewPick = act.dataset.key; reviewError = ''; renderDay(); const d = $('#rv-date'); if (d) d.scrollIntoView({ block: 'center' }); }
      else if (a === 'rv-cancel') { closePick(); renderDay(); }
      else if (a === 'rv-carry' || a === 'rv-go') {
        let target = addDays(selectedDate, 1);
        if (a === 'rv-go') {
          const v = ($('#rv-date') || {}).value || '';
          if (!isDateKey(v) || v <= selectedDate) { reviewError = 'Choisis un jour après le ' + fromLabel(selectedDate) + '.'; renderDay(); return; }
          target = v;
        }
        if (carryItem(act.dataset.key, target)) showToast('Reporté au ' + fromLabel(target));
        closePick();
        renderDay();
      }
      else if (a === 'rv-drop') { dropItem(act.dataset.key); if (reviewPick === act.dataset.key) closePick(); renderDay(); }
      else if (a === 'rv-undo') { undoReview(act.dataset.key); renderDay(); }
      return;
    }
    const subDel = e.target.closest('[data-sub-del]');
    if (subDel && panelKey) {
      const day = ensureDay();
      day.subtasks[panelKey] = (day.subtasks[panelKey] || []).filter((t) => t.id !== subDel.dataset.subDel);
      if (!day.subtasks[panelKey].length) delete day.subtasks[panelKey];
      persistDays();
      renderSubs();
      renderDay();
      return;
    }
    const bp = e.target.closest('[data-bp]');
    if (!bp) return;
    const what = bp.dataset.bp;
    if (what === 'close') closePanel();
    else if (what === 'start' && panelKey) { const key = panelKey; closePanel(); startNow(key); }
    else if (what === 'stop' && panelKey) { const key = panelKey; closePanel(); stopNow(key); }
    else if (what === 'add-sub') addSub();
    else if (what === 'clear' && panelKey) { delete ensureDay().real[panelKey]; persistDays(); closePanel(); renderDay(); }
    else if (what === 'delete' && panelKey) {
      const day = ensureDay();
      day.ponctuels = day.ponctuels.filter((p) => 'p:' + p.id !== panelKey);
      delete day.real[panelKey];
      delete day.subtasks[panelKey];
      delete day.review[panelKey];
      persistDays();
      closePanel();
      renderDay();
    }
  });
  panel.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.matches && e.target.matches('#sub-label, #sub-action')) { e.preventDefault(); addSub(); }
  });
  panel.addEventListener('change', (e) => {
    if (e.target.id === 'day-profile') {
      const day = ensureDay();
      day.profile = e.target.value || null;
      persistDays();
      renderDay();
      return;
    }
    if (e.target.matches && e.target.matches('[data-sub-done]') && panelKey) {
      const t = ((daysData.days[selectedDate] || {}).subtasks[panelKey] || []).find((x) => x.id === e.target.dataset.subDone);
      if (t) { t.done = e.target.checked; persistDays(); renderSubs(); renderDay(); }
      return;
    }
    const row = e.target.closest('#bp-edit .act-row');
    if (!row) return;
    if (e.target.matches('[data-a=entry]')) convertSecond(row, e.target.value);
    if (e.target.matches('[data-a=mode],[data-a=entry]')) updateRowUi(row);
  });
  panel.addEventListener('focusin', (e) => {
    const el = e.target;
    if (el.matches && el.matches('[data-kind]')) setTimeout(() => { try { el.select(); } catch (x) { /* ignoré */ } }, 0);
  });
  panel.addEventListener('focusout', (e) => {
    const el = e.target;
    if (el.matches && el.matches('[data-kind=time]')) { const v = parseTime(el.value); if (v !== null) el.value = formatTime(v); }
  });
  $('#block-panel').addEventListener('submit', (e) => { e.preventDefault(); savePanel(); });
}

function bindEvents() {
  bindDayEvents();
  const form = $('#settings-form');

  $$('.tabbar button').forEach((b) => b.addEventListener('click', () => switchTab(b.dataset.tab)));
  $('#panel-stats').addEventListener('click', (e) => {
    const m = e.target.closest('[data-stats-mode]');
    if (m) { statsMode = m.dataset.statsMode; renderStats(); return; }
    const n = e.target.closest('[data-stats-nav]');
    if (!n) return;
    const v = n.dataset.statsNav;
    if (v === 'today') statsAnchor = dateKey(new Date());
    else if (statsMode === 'week') statsAnchor = addDays(statsAnchor, 7 * Number(v));
    else { const d = parseDateKey(statsAnchor); statsAnchor = dateKey(new Date(d.getFullYear(), d.getMonth() + Number(v), 1)); }
    renderStats();
  });
  $('#panel-recap').addEventListener('click', (e) => {
    const b = e.target.closest('[data-recap-day]');
    if (b) { recapDay = Number(b.dataset.recapDay); renderRecap(current, loadStatus); }
  });

  form.addEventListener('input', (e) => { if (e.target.id === 'import-file') return; setDirty(true); updateSummary(e.target.closest && e.target.closest('.act-row')); });
  form.addEventListener('toggle', (e) => {                 // mémorise ce qui est plié ou déplié
    const d = e.target, id = d.dataset && d.dataset.fid;
    if (!id) return;
    const set = d.classList.contains('fold') ? foldClosed : openRows;
    if (d.classList.contains('fold')) { if (d.open) set.delete(id); else set.add(id); } else if (d.open) set.add(id); else set.delete(id);
  }, true);
  form.addEventListener('change', (e) => {
    if (e.target.id === 'import-file') { onImportFile(e.target); return; }
    if (e.target.matches('#acts-list [data-a=name]')) syncActChips();
    const row = e.target.closest('.act-row');
    updateSummary(row);
    if (row && row.dataset.mode !== undefined) {
      if (e.target.matches('[data-a=entry]')) convertSecond(row, e.target.value);
      if (e.target.matches('[data-a=mode],[data-a=entry]')) updateRowUi(row);
    }
    setDirty(true);
  });
  form.addEventListener('focusin', (e) => {
    const el = e.target;
    if (el.matches && el.matches('[data-kind]')) setTimeout(() => { try { el.select(); } catch (x) { /* ignoré */ } }, 0);
  });
  form.addEventListener('focusout', (e) => {          // remet l'heure en HH:MM
    const el = e.target;
    if (el.matches && el.matches('[data-kind=time]')) {
      const v = parseTime(el.value);
      if (v !== null) el.value = formatTime(v);
    }
  });

  form.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (chip) {
      chip.setAttribute('aria-pressed', String(chip.getAttribute('aria-pressed') !== 'true'));
      updateSummary(chip.closest('.act-row'));
      setDirty(true);
      return;
    }
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'export') { doExport(); return; }
    if (action === 'import') {
      if (dirty && !window.confirm('Des modifications ne sont pas enregistrées. Elles seront perdues si tu remplaces les réglages. Continuer ?')) return;
      $('#import-file').click();
      return;
    }
    if (action === 'imp-all') { applyImport('all'); return; }
    if (action === 'imp-settings') { applyImport('settings'); return; }
    if (action === 'imp-cancel') { pendingImport = null; renderImportBox(); return; }
    if (action === 'add-act') {
      const raws = $$('#acts-list .act-row').map(readActRaw);
      const nid = newId();
      openRows.add(nid);
      raws.push({ id: nid, name: '', mode: 'fixed', entry: 'duration', days: [1, 2, 3, 4, 5], start: '', second: '30', confirm: false, carry: false });
      $('#acts-list').innerHTML = raws.map((r) => actRowHtml(r, { days: true, del: true, fold: true })).join('');
      rerenderProfiles();
      const names = $$('#acts-list [data-a=name]');
      names[names.length - 1].focus();
      setDirty(true);
    } else if (action === 'del-act') {
      const row = btn.closest('.act-row');
      const raws = $$('#acts-list .act-row').map(readActRaw).filter((r) => r.id !== row.dataset.id);
      $('#acts-list').innerHTML = raws.map((r) => actRowHtml(r, { days: true, del: true, fold: true })).join('');
      rerenderProfiles();
      setDirty(true);
    } else if (action === 'add-prof') {
      const pid = newId();
      openRows.add(pid);
      rerenderProfiles({ id: pid, name: '', wake: '07:00', bedtime: '22:00', days: [], removes: [] });
      const names = $$('#profs-list [data-p=name]');
      names[names.length - 1].focus();
      setDirty(true);
    } else if (action === 'del-prof') {
      const row = btn.closest('.prof-row');
      if ($$('#profs-list .prof-row').length <= 1) { showToast('Garde au moins un profil', 'err'); return; }
      row.remove();
      setDirty(true);
    } else if (action === 'reset') {
      if (window.confirm('Remplacer les champs par les valeurs de départ ? Rien ne sera enregistré avant que tu appuies sur « Enregistrer ».')) {
        renderForm(defaultSettings());
        setDirty(true);
      }
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const result = readForm();
    if (result.errors.length) {
      showToast(result.errors.length + ' champ(s) à corriger', 'err');
      const first = result.errors[0].el;
      first.scrollIntoView({ block: 'center' });
      first.focus();
      return;
    }
    if (!saveSettings(result.settings)) {
      showToast('Enregistrement impossible sur cet appareil', 'err');
      return;
    }
    current = result.settings;
    loadStatus = 'ok';
    renderForm(current);
    renderRecap(current, loadStatus);
    renderDay();
    setDirty(false);
    showToast('Enregistré');
  });
}

// ==== 8. INIT ====
function init() {
  const loaded = loadSettings();
  current = loaded.settings;
  loadStatus = loaded.status;
  daysData = loadDays();
  selectedDate = dateKey(new Date());
  recapDay = isoWeekday(selectedDate);
  renderForm(current);
  renderRecap(current, loadStatus);
  setDirty(false);
  bindEvents();
  switchTab('day');
  // Un bloc en cours fait glisser la suite et l'heure fait apparaître les blocs « à confirmer » : on rafraîchit le jour affiché toutes les 15 secondes.
  setInterval(() => {
    if (!$('#panel-day').hidden && !panelOpen && reviewPick === null && document.activeElement.id !== 'day-profile' && dayNow() !== null) renderDay();
  }, 15000);
  window.PDJ = { statsFor: statsFor, statsRange: statsRange, buildDay: buildDay, defaultSettings: defaultSettings, emptyDay: emptyDay, parseTime: parseTime, formatTime: formatTime };   // point d'accès pour les tests
  const isLocal = ['localhost', '127.0.0.1', ''].includes(location.hostname);
  if ('serviceWorker' in navigator && (!isLocal || /[?&]sw=1/.test(location.search))) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* hors ligne indisponible, sans gravité */ });
  }
}
init();

})();
</script>
