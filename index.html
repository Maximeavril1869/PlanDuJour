<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan du jour</title>
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan du jour">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --bg: #f3f5f4; --card: #ffffff; --ink: #16211f; --muted: #5d6b68; --line: #dfe5e3;
  --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #e0f2ef;
  --warn-bg: #fff6e0; --warn-ink: #7a4b00; --err: #b42318; --info-bg: #e8f1fb; --info-ink: #1d4670;
  --tabbar-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1514; --card: #172120; --ink: #e8f0ee; --muted: #9fb0ac; --line: #26332f;
    --accent: #2dd4bf; --accent-ink: #04201c; --accent-soft: #123a35;
    --warn-bg: #2b2410; --warn-ink: #f5d58a; --err: #ff8a80; --info-bg: #14283a; --info-ink: #a9cdf0;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
header.app-header { padding: 20px 16px 8px; max-width: 720px; margin: 0 auto; }
header.app-header h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
header.app-header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
main { max-width: 720px; margin: 0 auto; padding: 8px 16px calc(var(--tabbar-h) + 110px + env(safe-area-inset-bottom)); }
[hidden] { display: none !important; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
.card h2 { margin: 0 0 4px; font-size: 17px; }
.card .help { margin: 0 0 10px; color: var(--muted); font-size: 14px; }

.banner { border-radius: 12px; padding: 10px 14px; margin: 12px 0; font-size: 14px; }
.banner.info { background: var(--info-bg); color: var(--info-ink); }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
.banner ul { margin: 6px 0 0; padding-left: 18px; }

/* Récapitulatif */
.tl { list-style: none; margin: 8px 0 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 116px 18px 1fr; align-items: start; padding: 7px 0; }
.tl .t { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; padding-right: 6px; white-space: nowrap; }
.tl .dot { position: relative; align-self: stretch; }
.tl .dot::before { content: ""; position: absolute; left: 8px; top: 0; bottom: -14px; width: 2px; background: var(--line); }
.tl li:last-child .dot::before { display: none; }
.tl .dot::after { content: ""; position: absolute; left: 3px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.tl .what small { display: block; color: var(--muted); font-size: 13px; }
.rows { list-style: none; margin: 8px 0 0; padding: 0; }
.rows li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.rows li:first-child { border-top: 0; }
.rows .v { color: var(--muted); text-align: right; }

/* Formulaire */
.field { display: block; margin: 10px 0; }
.lbl { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
input[type=text], select {
  width: 100%; min-height: 44px; padding: 8px 12px; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; -webkit-appearance: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
input[aria-invalid=true] { border-color: var(--err); }
.err { display: block; color: var(--err); font-size: 13px; margin-top: 4px; }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row .sep { color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.event-row { border-top: 1px solid var(--line); padding: 10px 0 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; position: relative; }
.event-row:first-child { border-top: 0; }
.event-row .field.name { grid-column: 1 / -1; padding-right: 52px; }
.event-row .err { grid-column: 1 / -1; margin-bottom: 6px; }
.event-row .del { position: absolute; right: 0; top: 30px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-width: 52px; min-height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button { font: inherit; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--err); }
.btn:disabled { opacity: .5; }
.icon-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 18px; }
.foot { color: var(--muted); font-size: 13px; text-align: center; margin: 18px 0; }
.foot .btn { margin-bottom: 14px; }

/* Barres fixes */
.savebar {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  background: var(--card); border-top: 1px solid var(--line); padding: 8px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.savebar .msg { font-size: 14px; color: var(--muted); }
.savebar .msg.dirty { color: var(--warn-ink); font-weight: 600; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 1fr 1fr;
  background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button { height: var(--tabbar-h); border: 0; background: none; color: var(--muted); font-size: 15px; }
.tabbar button[aria-selected=true] { color: var(--accent); font-weight: 700; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 76px + env(safe-area-inset-bottom));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 22px; font-size: 14px; z-index: 5; max-width: 90vw;
}
.toast.err { background: var(--err); color: #fff; }

/* Jour (lot 2) */
:root { --trip: #e6ebe9; --fix: #fde4bf; --fix-line: #e0a14a; --band: #e9f5f3; }
@media (prefers-color-scheme: dark) { :root { --trip: #202c29; --fix: #4a3715; --fix-line: #d9992f; --band: #11231f; } }
.daynav { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 10px; gap: 8px; }
.daylabel { font-weight: 700; font-size: 18px; text-align: center; flex: 1; }
.daytools { display: flex; gap: 10px; margin-bottom: 4px; }
.daytools .btn { flex: 1; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.tlwrap { position: relative; margin: 14px 0 0 46px; }
.tlarea { position: relative; }
.hline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.hline span { position: absolute; left: -46px; top: -9px; width: 40px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.band { position: absolute; left: 0; right: 0; background: var(--band); border-top: 2px dashed var(--accent); border-bottom: 2px dashed var(--accent); opacity: .9; }
.band.real { border-style: solid; }
.marker { position: absolute; left: 0; right: 0; border-top: 2px solid var(--muted); font-size: 12px; color: var(--muted); }
.marker span { position: absolute; right: 0; top: 2px; }
.blk { position: absolute; display: flex; flex-direction: column; justify-content: flex-start; text-align: left; font: inherit; color: var(--ink);
  border: 0; border-radius: 8px; padding: 3px 8px; overflow: hidden; line-height: 1.2; margin: 1px 0; }
.blk .bn { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .bt { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.short { flex-direction: row; align-items: center; gap: 8px; padding-top: 0; padding-bottom: 0; }
.b-trip { background: var(--trip); }
.b-event, .b-appt { background: var(--fix); border-left: 4px solid var(--fix-line); }
.b-mobile { background: var(--accent-soft); border-left: 4px solid var(--accent); }
.b-mobile.done { opacity: .55; }
.b-mobile.done .bn { text-decoration: line-through; }
.hours-help { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.unplaced li { margin: 2px 0; }
</style>
</head>
<body>
<header class="app-header">
  <h1>Plan du jour</h1>
  <p id="subtitle">Tes contraintes, saisies une fois.</p>
</header>

<main>
  <section id="panel-day" role="tabpanel" aria-labelledby="tab-day">
    <div id="day-head"></div>
    <form id="appt-form" class="card" hidden novalidate autocomplete="off">
      <h2 id="appt-heading">Nouveau rendez-vous</h2>
      <label class="field"><span class="lbl">Titre</span><input type="text" id="appt-title" maxlength="40"></label>
      <div class="grid2">
        <label class="field"><span class="lbl">Début</span><input type="text" id="appt-start" inputmode="numeric" autocomplete="off" placeholder="HH:MM" data-kind="time"></label>
        <label class="field"><span class="lbl">Durée (minutes)</span><input type="text" id="appt-duration" inputmode="numeric" autocomplete="off" data-kind="int"></label>
      </div>
      <span class="err" id="appt-err" hidden></span>
      <div class="btnrow">
        <button type="submit" class="btn primary" id="appt-ok">Ajouter</button>
        <button type="button" class="btn" data-appt="cancel">Annuler</button>
        <button type="button" class="btn danger" data-appt="delete" id="appt-del" hidden>Supprimer</button>
      </div>
    </form>
    <div id="day-timeline"></div>
  </section>

  <section id="panel-recap" role="tabpanel" aria-labelledby="tab-recap" hidden></section>

  <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
    <form id="settings-form" novalidate autocomplete="off">
      <div id="form-body"></div>
      <div class="savebar">
        <span class="msg" id="dirty-msg">Aucune modification</span>
        <button type="submit" class="btn primary" id="save-btn">Enregistrer</button>
      </div>
    </form>
  </section>
</main>

<nav class="tabbar" role="tablist" aria-label="Navigation">
  <button type="button" role="tab" id="tab-day" data-tab="day" aria-selected="true">Jour</button>
  <button type="button" role="tab" id="tab-recap" data-tab="recap" aria-selected="false">Récapitulatif</button>
  <button type="button" role="tab" id="tab-settings" data-tab="settings" aria-selected="false">Réglages</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">Cette app a besoin de JavaScript.</p></noscript>

<script>
(function () {
'use strict';

// ==== 1. CONFIG ====
const APP_VERSION = '0.2.0';          // identique à VERSION dans sw.js (CONVENTIONS.md §10)
const DATA_VERSION = 2;               // réglages : 1 = lot 1, 2 = lot 2 (blocs mobiles)
const DAYS_KEY = 'plandujour.jours';
const DAYS_VERSION = 1;
const KEEP_DAYS = 90;                 // les jours plus anciens sont purgés à l'enregistrement
const STORAGE_KEY = 'plandujour.reglages';
const DAY_NAMES = ['', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const DAY_SHORT = ['', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];

// ==== 2. TEMPS ====
// Minutes depuis minuit en interne ; « HH:MM » en 24 h à l'écran (CONVENTIONS.md §5).
function parseTime(text) {
  if (typeof text !== 'string') return null;
  const t = text.trim().toLowerCase().replace(/\s+/g, '').replace('h', ':');
  const m = /^(\d{1,2}):?(\d{2})?$/.exec(t);
  if (!m) return null;
  const h = Number(m[1]);
  const min = m[2] === undefined ? 0 : Number(m[2]);
  if (h > 23 || min > 59) return null;
  return h * 60 + min;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function formatTime(minutes) { return pad2(Math.floor(minutes / 60)) + ':' + pad2(minutes % 60); }
function formatRange(r) { return r.min === r.max ? formatTime(r.min) : formatTime(r.min) + '–' + formatTime(r.max); }
function formatDuration(minutes) {
  const h = Math.floor(minutes / 60), m = minutes % 60;
  if (h === 0) return m + ' min';
  return m === 0 ? h + ' h' : h + ' h ' + pad2(m);
}
function parseIntStrict(text) {
  const t = String(text).trim();
  return /^\d{1,4}$/.test(t) ? Number(t) : null;
}

// ==== 3. VALEURS PAR DÉFAUT ====
function defaultSettings() {
  return {
    version: DATA_VERSION,
    times: {
      wake: 345,                              // 05:45
      leaveHome: 390,                         // 06:30
      trainOut: 413,                          // 06:53
      trainOutArrival: 434,                   // 07:14
      workArrival: { min: 450, max: 460 },    // 07:30–07:40
      workDeparture: { min: 960, max: 975 },  // 16:00–16:15
      trainBack: 988,                         // 16:28
      homeArrival: 1035,                      // ≈ 17:15
      bedtime: 1320                           // 22:00
    },
    weeklyEvents: [
      { id: 'ev-cours-sax', name: 'Cours de saxophone', day: 3, start: 1140, duration: null },  // mercredi 19:00
      { id: 'ev-orchestre', name: 'Orchestre', day: 5, start: 1170, duration: null }            // vendredi 19:30
    ],
    saxophone: { minutes: 15, days: [1, 2, 4, 6, 7] },   // tous les jours sauf mercredi et vendredi (à régler)
    housework: { everyDays: 3, minutes: 30 },            // valeurs de départ à régler
    relax: { floorMinutes: 30 },                         // plancher de détente, à valider
    mobileBlocks: [                                      // blocs mobiles personnalisés (lot 2)
      { id: 'blk-concentration', name: 'Concentration', minutes: 90, zone: 'work', priority: 1 }
    ]
  };
}

// ==== 4. STOCKAGE ====
function isMinute(v) { return Number.isInteger(v) && v >= 0 && v <= 1439; }
function pickTime(v, def) { return isMinute(v) ? v : def; }
function pickInt(v, def, min, max) { return Number.isInteger(v) && v >= min && v <= max ? v : def; }
function pickRange(v, def) {
  if (v && isMinute(v.min) && isMinute(v.max) && v.min <= v.max) return { min: v.min, max: v.max };
  return { min: def.min, max: def.max };
}

// Reconstruit un objet complet et sain à partir de données lues (migration incluse).
function sanitize(raw) {
  // Migration : la version 1 (lot 1) n'a pas de blocs mobiles → valeurs de départ.
  if (!raw || typeof raw !== 'object' || (raw.version !== 1 && raw.version !== 2)) return null;
  const d = defaultSettings();
  const t = raw.times || {};
  const s = defaultSettings();
  s.times = {
    wake: pickTime(t.wake, d.times.wake),
    leaveHome: pickTime(t.leaveHome, d.times.leaveHome),
    trainOut: pickTime(t.trainOut, d.times.trainOut),
    trainOutArrival: pickTime(t.trainOutArrival, d.times.trainOutArrival),
    workArrival: pickRange(t.workArrival, d.times.workArrival),
    workDeparture: pickRange(t.workDeparture, d.times.workDeparture),
    trainBack: pickTime(t.trainBack, d.times.trainBack),
    homeArrival: pickTime(t.homeArrival, d.times.homeArrival),
    bedtime: pickTime(t.bedtime, d.times.bedtime)
  };
  if (Array.isArray(raw.weeklyEvents)) {
    s.weeklyEvents = raw.weeklyEvents
      .filter((e) => e && typeof e.name === 'string' && e.name.trim() && Number.isInteger(e.day) && e.day >= 1 && e.day <= 7 && isMinute(e.start))
      .map((e) => ({
        id: typeof e.id === 'string' ? e.id : newId(),
        name: e.name.trim().slice(0, 40),
        day: e.day,
        start: e.start,
        duration: Number.isInteger(e.duration) && e.duration >= 1 && e.duration <= 1440 ? e.duration : null
      }));
  }
  const sx = raw.saxophone || {};
  s.saxophone = {
    minutes: pickInt(sx.minutes, d.saxophone.minutes, 0, 600),
    days: Array.isArray(sx.days) ? Array.from(new Set(sx.days.filter((x) => Number.isInteger(x) && x >= 1 && x <= 7))).sort() : d.saxophone.days
  };
  const hw = raw.housework || {};
  s.housework = { everyDays: pickInt(hw.everyDays, d.housework.everyDays, 1, 60), minutes: pickInt(hw.minutes, d.housework.minutes, 0, 600) };
  s.relax = { floorMinutes: pickInt((raw.relax || {}).floorMinutes, d.relax.floorMinutes, 0, 600) };
  s.mobileBlocks = raw.version === 2 ? sanitizeBlocks(raw.mobileBlocks, d.mobileBlocks) : d.mobileBlocks;
  return s;
}

function sanitizeBlocks(list, fallback) {
  if (!Array.isArray(list)) return fallback;
  return list
    .filter((b) => b && typeof b.name === 'string' && b.name.trim() && Number.isInteger(b.minutes) && b.minutes >= 5 && b.minutes <= 600 && ZONES[b.zone])
    .map((b) => ({ id: typeof b.id === 'string' ? b.id : newId(), name: b.name.trim().slice(0, 40), minutes: b.minutes, zone: b.zone, priority: pickInt(b.priority, 5, 1, 9) }));
}

// Retourne { settings, status } ; status : 'ok' | 'empty' | 'corrupt' | 'unavailable'.
function loadSettings() {
  let text;
  try {
    text = window.localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    return { settings: defaultSettings(), status: 'unavailable' };
  }
  if (text === null) return { settings: defaultSettings(), status: 'empty' };
  try {
    const clean = sanitize(JSON.parse(text));
    if (clean) return { settings: clean, status: 'ok' };
  } catch (e) { /* données illisibles */ }
  return { settings: defaultSettings(), status: 'corrupt' };
}

function saveSettings(settings) {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
    return window.localStorage.getItem(STORAGE_KEY) !== null;
  } catch (e) {
    return false;
  }
}

function newId() { return 'ev-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// ---- Données des jours (lot 2) : rendez-vous, heures réelles, cases cochées ----
function emptyDay() { return { arrival: null, departure: null, appointments: [], done: {} }; }
function emptyDays() { return { version: DAYS_VERSION, days: {} }; }

function sanitizeDays(raw) {
  if (!raw || typeof raw !== 'object' || raw.version !== DAYS_VERSION || !raw.days || typeof raw.days !== 'object') return null;
  const out = emptyDays();
  Object.keys(raw.days).forEach((k) => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    const d = raw.days[k] || {};
    const day = emptyDay();
    day.arrival = isMinute(d.arrival) ? d.arrival : null;
    day.departure = isMinute(d.departure) ? d.departure : null;
    if (Array.isArray(d.appointments)) {
      day.appointments = d.appointments
        .filter((a) => a && typeof a.title === 'string' && a.title.trim() && isMinute(a.start) && Number.isInteger(a.duration) && a.duration >= 1 && a.duration <= 1440)
        .map((a) => ({ id: typeof a.id === 'string' ? a.id : newId(), title: a.title.trim().slice(0, 40), start: a.start, duration: a.duration }));
    }
    if (d.done && typeof d.done === 'object') Object.keys(d.done).forEach((key) => { if (d.done[key] === true) day.done[key] = true; });
    out.days[k] = day;
  });
  return out;
}

function loadDays() {
  let text = null;
  try {
    text = window.localStorage.getItem(DAYS_KEY);
    if (text === null) return emptyDays();
    const clean = sanitizeDays(JSON.parse(text));
    if (clean) return clean;
  } catch (e) { /* illisible */ }
  try { if (text !== null) window.localStorage.setItem(DAYS_KEY + '.sauvegarde', text); } catch (e) { /* ignoré */ }
  return emptyDays();
}

function saveDays(data) {
  try {
    const limit = addDays(dateKey(new Date()), -KEEP_DAYS);
    Object.keys(data.days).forEach((k) => { if (k < limit) delete data.days[k]; });
    window.localStorage.setItem(DAYS_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    return false;
  }
}

// ==== 5. VALIDATION ====
function getPath(obj, path) { return path.split('.').reduce((o, k) => o[k], obj); }
function setPath(obj, path, value) {
  const keys = path.split('.');
  const last = keys.pop();
  keys.reduce((o, k) => o[k], obj)[last] = value;
}

// Incohérences d'ordre (non bloquantes) : retourne une liste de phrases.
function checkConsistency(s) {
  const t = s.times;
  const chain = [
    ['Lever', t.wake], ['Départ de chez toi', t.leaveHome], ['Train aller', t.trainOut],
    ['Arrivée du train aller', t.trainOutArrival], ['Arrivée au travail', t.workArrival.min],
    ['Fin de la fourchette d’arrivée au travail', t.workArrival.max], ['Départ du travail', t.workDeparture.min],
    ['Fin de la fourchette de départ du travail', t.workDeparture.max], ['Train retour', t.trainBack],
    ['Retour à la maison', t.homeArrival], ['Coucher', t.bedtime]
  ];
  const out = [];
  for (let i = 1; i < chain.length; i++) {
    const [prevLabel, prev] = chain[i - 1];
    const [label, cur] = chain[i];
    if (cur <= prev && !(label.startsWith('Fin de la fourchette') && cur === prev)) {
      out.push('« ' + label + ' » (' + formatTime(cur) + ') devrait venir après « ' + prevLabel + ' » (' + formatTime(prev) + ').');
    }
  }
  return out;
}

// ==== 5B. PLANNING (lot 2) ====
// Fonctions pures : (réglages, données des jours, date) → plan. Aucun accès au DOM ni au stockage.
const ZONES = { morning: 'Matin', work: 'Au travail', evening: 'Soir' };
const SAX_PRIORITY = 2;               // le saxophone et le ménage sont placés le soir, après les blocs personnalisés de priorité 1
const HOUSEWORK_PRIORITY = 3;
const DEFAULT_APPT_MINUTES = 60;
const ASSUMED_EVENT_MINUTES = 60;     // durée supposée d'un rendez-vous régulier sans durée renseignée

function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseDateKey(k) { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(k, n) { const d = parseDateKey(k); d.setDate(d.getDate() + n); return dateKey(d); }
function isoWeekday(k) { const g = parseDateKey(k).getDay(); return g === 0 ? 7 : g; }
function daysBetween(a, b) { return Math.round((parseDateKey(b) - parseDateKey(a)) / 86400000); }

function subtractInterval(free, s, e) {
  const out = [];
  free.forEach((f) => {
    if (e <= f.start || s >= f.end) { out.push(f); return; }
    if (s > f.start) out.push({ start: f.start, end: s });
    if (e < f.end) out.push({ start: e, end: f.end });
  });
  return out;
}

// Le ménage est dû s'il n'a jamais été fait, ou si le dernier ménage fait avant ce jour date d'au moins N jours.
function houseworkDue(settings, days, date) {
  if (days[date] && days[date].done && days[date].done.house) return true;
  let last = null;
  Object.keys(days).forEach((k) => { if (k < date && days[k].done && days[k].done.house && (last === null || k > last)) last = k; });
  return last === null || daysBetween(last, date) >= settings.housework.everyDays;
}

function buildPlan(settings, days, date) {
  const t = settings.times;
  const day = days[date] || emptyDay();
  const weekday = isoWeekday(date);
  const plan = {
    date: date, weekday: weekday, planned: weekday <= 5, day: day,
    fixed: [], mobile: [], unplaced: [], warnings: [], zones: null,
    arrival: null, departure: null, arrivalReal: day.arrival !== null, departureReal: day.departure !== null
  };
  if (!plan.planned) return plan;

  // Heures réelles du jour ; à défaut, le cas prudent de la fourchette (arrivée la plus tardive, départ le plus précoce).
  const arrival = day.arrival !== null ? day.arrival : t.workArrival.max;
  const departure = day.departure !== null ? day.departure : t.workDeparture.min;
  plan.arrival = arrival;
  plan.departure = departure;
  plan.zones = { morning: { start: t.wake, end: t.leaveHome }, work: { start: arrival, end: departure }, evening: { start: t.homeArrival, end: t.bedtime } };

  const fixed = [
    { id: 'trip-go', kind: 'trip', name: 'Trajet aller', start: t.leaveHome, end: arrival, note: 'train ' + formatTime(t.trainOut) },
    { id: 'trip-back', kind: 'trip', name: 'Trajet retour', start: departure, end: t.homeArrival, note: 'train ' + formatTime(t.trainBack) }
  ];
  settings.weeklyEvents.filter((e) => e.day === weekday).forEach((e) => {
    fixed.push({ id: 'ev:' + e.id, kind: 'event', name: e.name, start: e.start, end: Math.min(1440, e.start + (e.duration || ASSUMED_EVENT_MINUTES)), assumed: !e.duration });
  });
  day.appointments.forEach((a) => {
    fixed.push({ id: 'appt:' + a.id, kind: 'appt', apptId: a.id, name: a.title, start: a.start, end: Math.min(1440, a.start + a.duration) });
  });
  plan.fixed = fixed;

  if (departure <= arrival) plan.warnings.push('Le départ du travail (' + formatTime(departure) + ') est avant l’arrivée (' + formatTime(arrival) + ').');
  if (arrival <= t.leaveHome) plan.warnings.push('L’arrivée au travail (' + formatTime(arrival) + ') est avant le départ de chez toi (' + formatTime(t.leaveHome) + ').');
  for (let i = 0; i < fixed.length; i++) {
    for (let j = i + 1; j < fixed.length; j++) {
      if (fixed[i].start < fixed[j].end && fixed[j].start < fixed[i].end) {
        plan.warnings.push('« ' + fixed[i].name + ' » (' + formatTime(fixed[i].start) + '–' + formatTime(fixed[i].end) + ') chevauche « ' + fixed[j].name + ' » (' + formatTime(fixed[j].start) + '–' + formatTime(fixed[j].end) + ').');
      }
    }
  }
  fixed.filter((f) => f.kind === 'appt' && (f.start < t.wake || f.end > t.bedtime)).forEach((f) => {
    plan.warnings.push('« ' + f.name + ' » sort de la journée (lever ' + formatTime(t.wake) + ', coucher ' + formatTime(t.bedtime) + ').');
  });

  // Plages libres de chaque zone, une fois retirés les blocs fixes.
  const free = {};
  Object.keys(plan.zones).forEach((z) => {
    let list = plan.zones[z].start < plan.zones[z].end ? [{ start: plan.zones[z].start, end: plan.zones[z].end }] : [];
    fixed.forEach((f) => { list = subtractInterval(list, f.start, f.end); });
    free[z] = list;
  });

  // Blocs mobiles, placés par priorité dans la première plage libre assez longue de leur zone.
  const mobile = settings.mobileBlocks.map((b, i) => ({ key: 'block:' + b.id, name: b.name, minutes: b.minutes, priority: b.priority, zone: b.zone, order: i }));
  if (settings.saxophone.minutes > 0 && settings.saxophone.days.includes(weekday)) {
    mobile.push({ key: 'sax', name: 'Saxophone', minutes: settings.saxophone.minutes, priority: SAX_PRIORITY, zone: 'evening', order: 100 });
  }
  if (settings.housework.minutes > 0 && houseworkDue(settings, days, date)) {
    mobile.push({ key: 'house', name: 'Ménage', minutes: settings.housework.minutes, priority: HOUSEWORK_PRIORITY, zone: 'evening', order: 101 });
  }
  mobile.sort((a, b) => a.priority - b.priority || a.order - b.order);
  mobile.forEach((m) => {
    const slot = (free[m.zone] || []).find((f) => f.end - f.start >= m.minutes);
    if (!slot) { plan.unplaced.push(m); return; }
    m.kind = 'mobile';
    m.start = slot.start;
    m.end = slot.start + m.minutes;
    m.done = day.done[m.key] === true;
    free[m.zone] = subtractInterval(free[m.zone], m.start, m.end);
    plan.mobile.push(m);
  });
  plan.mobile.sort((a, b) => a.start - b.start);
  return plan;
}

// Répartit en colonnes les blocs qui se chevauchent (affichage uniquement).
function layoutColumns(items) {
  items.sort((a, b) => a.start - b.start || b.end - a.end);
  let cluster = null;
  const clusters = [];
  items.forEach((it) => {
    if (!cluster || it.start >= cluster.end) { cluster = { end: it.end, cols: [], items: [] }; clusters.push(cluster); }
    let c = cluster.cols.findIndex((e) => e <= it.start);
    if (c === -1) { c = cluster.cols.length; cluster.cols.push(0); }
    cluster.cols[c] = it.end;
    it.col = c;
    cluster.end = Math.max(cluster.end, it.end);
    cluster.items.push(it);
  });
  clusters.forEach((cl) => cl.items.forEach((it) => { it.colCount = cl.cols.length; }));
  return items;
}

const PX = 1.5;   // pixels par minute sur la timeline

function fmtDateLabel(k) {

function renderDay() {

      '<p class="hours-help">Saisis l’heure réelle. Sans elle, le plan prend le cas prudent : arrivée à ' + formatTime(plan.arrival) + ', départ à ' + formatTime(plan.departure) + '.</p>') + '</div>';

  if (plan.unplaced.length) {
    head += '<div class="banner warn"><strong>Ne tient pas dans la journée</strong> (rien n’est supprimé) :<ul class="unplaced">' +

  $('#day-head').innerHTML = head;

  // Timeline
  const items = plan.fixed.concat(plan.mobile).map((b) => Object.assign({}, b));

  let hi = Math.max.apply(null, [t.bedtime].concat(items.map((b) => b.end)));
  lo = Math.floor(lo / 60) * 60;
  hi = Math.ceil(hi / 60) * 60;
  layoutColumns(items);
  const y = (m) => (m - lo) * PX;
  let html = '<div class="tlwrap"><div class="tlarea" style="height:' + (hi - lo) * PX + 'px">';
  for (let m = lo; m <= hi; m += 60) html += '<div class="hline" style="top:' + y(m) + 'px"><span>' + pad2(m / 60) + ':00</span></div>';
  if (plan.departure > plan.arrival) {
    html += '<div class="band' + (plan.arrivalReal && plan.departureReal ? ' real' : '') + '" style="top:' + y(plan.arrival) + 'px;height:' + (plan.departure - plan.arrival) * PX + 'px"></div>';
  }
  html += '<div class="marker" style="top:' + y(t.wake) + 'px"><span>Lever ' + formatTime(t.wake) + '</span></div>';
  html += '<div class="marker" style="top:' + y(t.bedtime) + 'px"><span>Coucher ' + formatTime(t.bedtime) + '</span></div>';
  items.forEach((b) => {
    const h = Math.max((b.end - b.start) * PX - 2, 22);
    const w = 100 / b.colCount;
    const attrs = b.kind === 'mobile' ? ' data-action="toggle-done" data-key="' + esc(b.key) + '"'
      : b.kind === 'appt' ? ' data-action="edit-appt" data-id="' + esc(b.apptId) + '"' : ' tabindex="-1"';
    const time = formatTime(b.start) + '–' + formatTime(b.end) + (b.assumed ? ' (durée supposée)' : '');
    html += '<button type="button" class="blk b-' + b.kind + (b.done ? ' done' : '') + (h < 40 ? ' short' : '') + '"' + attrs +
      ' style="top:' + y(b.start) + 'px;height:' + h + 'px;left:calc(' + b.col * w + '% + 1px);width:calc(' + w + '% - 3px)">' +
      '<span class="bn">' + (b.done ? '✓ ' : '') + esc(b.name) + '</span><span class="bt">' + time + (b.note ? ' · ' + esc(b.note) : '') + '</span></button>';
  });
  html += '</div></div>';
  $('#day-timeline').innerHTML = html;
}

let toastTimer = null;
function showToast(message, kind) {
  const el = $('#toast');
  el.textContent = message;
  el.className = 'toast' + (kind === 'err' ? ' err' : '');
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

function switchTab(name) {
  $$('.tabbar button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  $('#panel-day').hidden = name !== 'day';
  $('#panel-recap').hidden = name !== 'recap';
  $('#panel-settings').hidden = name !== 'settings';
  $('#subtitle').textContent = { day: 'Ton plan, recalé autour des rendez-vous.', recap: 'Tes contraintes, saisies une fois.', settings: 'Modifie, puis enregistre.' }[name];
  if (name === 'day') renderDay();
  window.scrollTo(0, 0);
}

// ---- Lecture du formulaire et validation de saisie ----
function errHost(el) { return el.closest('.event-row') || el.closest('.field'); }
function clearFlags() {
  $$('#settings-form [aria-invalid]').forEach((el) => el.removeAttribute('aria-invalid'));
  $$('#settings-form .err').forEach((el) => { el.textContent = ''; el.hidden = true; });
}
function flag(el, message, errors) {
  el.setAttribute('aria-invalid', 'true');
  const err = errHost(el).querySelector('.err');
  err.textContent = err.textContent ? err.textContent + ' · ' + message : message;
  err.hidden = false;
  errors.push({ el: el, message: message });
}

function readEventsRaw() {
  return $$('#events-list .event-row').map((row) => ({
    id: row.dataset.id,
    name: $('[data-ev=name]', row).value,
    day: $('[data-ev=day]', row).value,
    start: $('[data-ev=start]', row).value,
    duration: $('[data-ev=duration]', row).value
  }));
}

// Retourne { settings, errors }. Les champs invalides sont marqués dans le formulaire.
function readForm() {
  clearFlags();
  const errors = [];
  const s = defaultSettings();
  const parsed = {};

  $$('#settings-form [data-kind=time][data-path]').forEach((inp) => {
    const v = parseTime(inp.value);
    if (v === null) { flag(inp, 'Heure invalide (ex. 06:53)', errors); return; }
    parsed[inp.dataset.path] = v;
    setPath(s, inp.dataset.path, v);
  });
  $$('#settings-form [data-kind=int][data-path]').forEach((inp) => {
    const min = Number(inp.dataset.min), max = Number(inp.dataset.max);
    const v = parseIntStrict(inp.value);
    if (v === null || v < min || v > max) { flag(inp, 'Nombre entier entre ' + min + ' et ' + max, errors); return; }
    setPath(s, inp.dataset.path, v);
  });
  ['times.workArrival', 'times.workDeparture'].forEach((base) => {
    const a = parsed[base + '.min'], b = parsed[base + '.max'];
    if (a !== undefined && b !== undefined && a > b) flag($('[data-path="' + base + '.min"]'), 'Le début doit précéder la fin', errors);
  });

  s.saxophone.days = $$('#sax-days .chip').filter((c) => c.getAttribute('aria-pressed') === 'true').map((c) => Number(c.dataset.day));

  s.weeklyEvents = [];
  $$('#events-list .event-row').forEach((row) => {
    const nameEl = $('[data-ev=name]', row), startEl = $('[data-ev=start]', row), durEl = $('[data-ev=duration]', row);
    const name = nameEl.value.trim();
    const start = parseTime(startEl.value);
    const dur = durEl.value.trim() === '' ? null : parseIntStrict(durEl.value);
    let ok = true;
    if (!name) { flag(nameEl, 'Nom obligatoire', errors); ok = false; }
    if (start === null) { flag(startEl, 'Heure invalide (ex. 19:00)', errors); ok = false; }
    if (dur !== null && (dur < 1 || dur > 1440)) { flag(durEl, 'Durée entre 1 et 1440 min', errors); ok = false; }
    if (durEl.value.trim() !== '' && dur === null) { flag(durEl, 'Durée invalide', errors); ok = false; }
    if (ok) s.weeklyEvents.push({ id: row.dataset.id || newId(), name: name, day: Number($('[data-ev=day]', row).value), start: start, duration: dur });
  });
  s.mobileBlocks = [];
  $$('#blocks-list .event-row').forEach((row) => {
    const nameEl = $('[data-bl=name]', row), minEl = $('[data-bl=minutes]', row);
    const name = nameEl.value.trim();
    const minutes = parseIntStrict(minEl.value);
    let ok = true;
    if (!name) { flag(nameEl, 'Nom obligatoire', errors); ok = false; }
    if (minutes === null || minutes < 5 || minutes > 600) { flag(minEl, 'Durée entre 5 et 600 min', errors); ok = false; }
    if (ok) s.mobileBlocks.push({ id: row.dataset.id || newId(), name: name, minutes: minutes, zone: $('[data-bl=zone]', row).value, priority: Number($('[data-bl=priority]', row).value) });
  });
  return { settings: s, errors: errors };
}

// ==== 7. ÉVÉNEMENTS ====
let current = null;     // réglages enregistrés (ou valeurs de départ)
let loadStatus = 'empty';
let dirty = false;
let daysData = emptyDays();   // rendez-vous, heures réelles et cases cochées, par date
let selectedDate = null;      // « AAAA-MM-JJ » du jour affiché
let weekendShift = false;     // vrai si on a avancé au lundi parce qu'on est en week-end
let editingApptId = null;     // null = nouveau rendez-vous

function setDirty(value) {
  dirty = value;
  const msg = $('#dirty-msg');
  msg.textContent = dirty ? 'Modifications non enregistrées' : 'Aucune modification';
  msg.classList.toggle('dirty', dirty);
}

function nextWeekday(k) { let d = k; while (isoWeekday(d) > 5) d = addDays(d, 1); return d; }

function ensureDay() {
  if (!daysData.days[selectedDate]) daysData.days[selectedDate] = emptyDay();
  return daysData.days[selectedDate];
}
function persistDays() {
  if (!saveDays(daysData)) showToast('Enregistrement impossible sur cet appareil', 'err');
}

function openApptEditor(id) {
  const form = $('#appt-form');
  const day = daysData.days[selectedDate] || emptyDay();
  const appt = id ? day.appointments.find((a) => a.id === id) : null;
  editingApptId = appt ? appt.id : null;
  $('#appt-heading').textContent = appt ? 'Modifier le rendez-vous' : 'Nouveau rendez-vous';
  $('#appt-ok').textContent = appt ? 'Enregistrer' : 'Ajouter';
  $('#appt-del').hidden = !appt;
  $('#appt-title').value = appt ? appt.title : '';
  $('#appt-start').value = appt ? formatTime(appt.start) : '';
  $('#appt-duration').value = String(appt ? appt.duration : DEFAULT_APPT_MINUTES);
  $('#appt-err').hidden = true;
  $$('#appt-form [aria-invalid]').forEach((el) => el.removeAttribute('aria-invalid'));
  form.hidden = false;
  form.scrollIntoView({ block: 'center' });
  $('#appt-title').focus();
}
function closeApptEditor() { $('#appt-form').hidden = true; editingApptId = null; }

function submitAppt() {
  const titleEl = $('#appt-title'), startEl = $('#appt-start'), durEl = $('#appt-duration');
  const errs = [];
  $$('#appt-form [aria-invalid]').forEach((el) => el.removeAttribute('aria-invalid'));
  const title = titleEl.value.trim();
  const start = parseTime(startEl.value);
  const dur = parseIntStrict(durEl.value);
  if (!title) { titleEl.setAttribute('aria-invalid', 'true'); errs.push('titre obligatoire'); }
  if (start === null) { startEl.setAttribute('aria-invalid', 'true'); errs.push('heure de début invalide (ex. 09:00)'); }
  if (dur === null || dur < 1 || dur > 1440) { durEl.setAttribute('aria-invalid', 'true'); errs.push('durée entre 1 et 1440 min'); }
  const errEl = $('#appt-err');
  if (errs.length) { errEl.textContent = 'À corriger : ' + errs.join(' ; ') + '.'; errEl.hidden = false; return; }
  errEl.hidden = true;
  const day = ensureDay();
  if (editingApptId) {
    const a = day.appointments.find((x) => x.id === editingApptId);
    if (a) { a.title = title; a.start = start; a.duration = dur; }
  } else {
    day.appointments.push({ id: newId(), title: title, start: start, duration: dur });
  }
  persistDays();
  closeApptEditor();
  renderDay();
}

function commitHour(el) {
  const field = el.dataset.dayField;
  const text = el.value.trim();
  const err = el.closest('.field').querySelector('.err');
  err.hidden = true;
  el.removeAttribute('aria-invalid');
  if (text === '') {
    ensureDay()[field] = null;
  } else {
    const v = parseTime(text);
    if (v === null) { el.setAttribute('aria-invalid', 'true'); err.textContent = 'Heure invalide (ex. 07:35)'; err.hidden = false; return; }
    ensureDay()[field] = v;
  }
  persistDays();
  renderDay();
}

function bindDayEvents() {
  const panel = $('#panel-day');
  panel.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-day-nav]');
    if (nav) {
      weekendShift = false;
      const v = nav.dataset.dayNav;
      selectedDate = v === 'today' ? nextWeekday(dateKey(new Date())) : addDays(selectedDate, Number(v));
      closeApptEditor();
      renderDay();
      return;
    }
    const act = e.target.closest('[data-action]');
    if (act) {
      if (act.dataset.action === 'add-appt') openApptEditor(null);
      else if (act.dataset.action === 'edit-appt') openApptEditor(act.dataset.id);
      else if (act.dataset.action === 'toggle-done') {
        const day = ensureDay();
        day.done[act.dataset.key] = !day.done[act.dataset.key];
        persistDays();
        renderDay();
      }
      return;
    }
    const appt = e.target.closest('[data-appt]');
    if (appt) {
      if (appt.dataset.appt === 'cancel') closeApptEditor();
      else if (appt.dataset.appt === 'delete' && editingApptId) {
        const day = ensureDay();
        day.appointments = day.appointments.filter((a) => a.id !== editingApptId);
        persistDays();
        closeApptEditor();
        renderDay();
      }
    }
  });
  panel.addEventListener('change', (e) => { if (e.target.matches('[data-day-field]')) commitHour(e.target); });
  panel.addEventListener('focusin', (e) => {
    const el = e.target;
    if (el.matches && el.matches('[data-kind]')) setTimeout(() => { try { el.select(); } catch (x) { /* ignoré */ } }, 0);
  });
  panel.addEventListener('focusout', (e) => {
    const el = e.target;
    if (el.matches && el.matches('[data-kind=time]')) { const v = parseTime(el.value); if (v !== null) el.value = formatTime(v); }
  });
  $('#appt-form').addEventListener('submit', (e) => { e.preventDefault(); submitAppt(); });
}

function bindEvents() {
  bindDayEvents();
  const form = $('#settings-form');

  $$('.tabbar button').forEach((b) => b.addEventListener('click', () => switchTab(b.dataset.tab)));

  form.addEventListener('input', () => setDirty(true));
  form.addEventListener('change', () => setDirty(true));
  form.addEventListener('focusin', (e) => {
    const el = e.target;
    if (el.matches && el.matches('[data-kind]')) setTimeout(() => { try { el.select(); } catch (x) { /* ignoré */ } }, 0);
  });
  form.addEventListener('focusout', (e) => {          // remet l'heure en HH:MM
    const el = e.target;
    if (el.matches && el.matches('[data-kind=time]')) {
      const v = parseTime(el.value);
      if (v !== null) el.value = formatTime(v);
    }
  });

  form.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (chip) {
      chip.setAttribute('aria-pressed', String(chip.getAttribute('aria-pressed') !== 'true'));
      setDirty(true);
      return;
    }
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'add-event') {
      const raw = readEventsRaw();
      raw.push({ id: newId(), name: '', day: 1, start: '', duration: '' });
      $('#events-list').innerHTML = raw.map(eventRow).join('');
      const names = $$('#events-list [data-ev=name]');
      names[names.length - 1].focus();
      setDirty(true);
    } else if (action === 'del-event') {
      const row = btn.closest('.event-row');
      const raw = readEventsRaw().filter((r) => r.id !== row.dataset.id);
      $('#events-list').innerHTML = raw.map(eventRow).join('');
      setDirty(true);
    } else if (action === 'add-block') {
      const raw = readBlocksRaw();
      raw.push({ id: newId(), name: '', minutes: '30', zone: 'evening', priority: '5' });
      $('#blocks-list').innerHTML = raw.map(blockRow).join('');
      const names = $$('#blocks-list [data-bl=name]');
      names[names.length - 1].focus();
      setDirty(true);
    } else if (action === 'del-block') {
      const row = btn.closest('.event-row');
      $('#blocks-list').innerHTML = readBlocksRaw().filter((r) => r.id !== row.dataset.id).map(blockRow).join('');
      setDirty(true);
    } else if (action === 'reset') {
      if (window.confirm('Remplacer les champs par les valeurs de départ ? Rien ne sera enregistré avant que tu appuies sur « Enregistrer ».')) {
        renderForm(defaultSettings());
        setDirty(true);
      }
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const result = readForm();
    if (result.errors.length) {
      showToast(result.errors.length + ' champ(s) à corriger', 'err');
      const first = result.errors[0].el;
      first.scrollIntoView({ block: 'center' });
      first.focus();
      return;
    }
    if (!saveSettings(result.settings)) {
      showToast('Enregistrement impossible sur cet appareil', 'err');
      return;
    }
    current = result.settings;
    loadStatus = 'ok';
    renderForm(current);
    renderRecap(current, loadStatus);
    renderDay();
    setDirty(false);
    const warnings = checkConsistency(current);
    showToast(warnings.length ? 'Enregistré · ' + warnings.length + ' point(s) à vérifier dans Récapitulatif' : 'Enregistré');
  });
}

// ==== 8. INIT ====
function init() {
  const loaded = loadSettings();
  current = loaded.settings;
  loadStatus = loaded.status;
  daysData = loadDays();
  const today = dateKey(new Date());
  selectedDate = nextWeekday(today);
  weekendShift = selectedDate !== today;
  renderForm(current);
  renderRecap(current, loadStatus);
  setDirty(false);
  bindEvents();
  switchTab('day');
  window.PDJ = { buildPlan: buildPlan, defaultSettings: defaultSettings, emptyDay: emptyDay, parseTime: parseTime, formatTime: formatTime };   // point d'accès pour les tests
  const isLocal = ['localhost', '127.0.0.1', ''].includes(location.hostname);
  if ('serviceWorker' in navigator && (!isLocal || /[?&]sw=1/.test(location.search))) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* hors ligne indisponible, sans gravité */ });
  }
}
init();

})();
</script>
