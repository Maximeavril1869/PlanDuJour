<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan du jour</title>
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan du jour">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --bg: #f3f5f4; --card: #ffffff; --ink: #16211f; --muted: #5d6b68; --line: #dfe5e3;
  --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #e0f2ef;
  --warn-bg: #fff6e0; --warn-ink: #7a4b00; --err: #b42318; --info-bg: #e8f1fb; --info-ink: #1d4670;
  --trip: #e6ebe9; --fix: #fde4bf; --fix-line: #e0a14a;
  --tabbar-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1514; --card: #172120; --ink: #e8f0ee; --muted: #9fb0ac; --line: #26332f;
    --accent: #2dd4bf; --accent-ink: #04201c; --accent-soft: #123a35;
    --warn-bg: #2b2410; --warn-ink: #f5d58a; --err: #ff8a80; --info-bg: #14283a; --info-ink: #a9cdf0;
    --trip: #202c29; --fix: #4a3715; --fix-line: #d9992f;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
header.app-header { padding: 20px 16px 8px; max-width: 720px; margin: 0 auto; }
header.app-header h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
header.app-header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
main { max-width: 720px; margin: 0 auto; padding: 8px 16px calc(var(--tabbar-h) + 110px + env(safe-area-inset-bottom)); }
[hidden] { display: none !important; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
.card h2 { margin: 0 0 4px; font-size: 17px; }
.card .help { margin: 0 0 10px; color: var(--muted); font-size: 14px; }

.banner { border-radius: 12px; padding: 10px 14px; margin: 12px 0; font-size: 14px; }
.banner.info { background: var(--info-bg); color: var(--info-ink); }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
.banner ul { margin: 6px 0 0; padding-left: 18px; }

/* Récapitulatif */
.tl { list-style: none; margin: 8px 0 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 116px 18px 1fr; align-items: start; padding: 6px 0; }
.tl .t { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; padding-right: 6px; white-space: nowrap; }
.tl .dot { position: relative; align-self: stretch; }
.tl .dot::before { content: ""; position: absolute; left: 8px; top: 0; bottom: -12px; width: 2px; background: var(--line); }
.tl li:last-child .dot::before { display: none; }
.tl .dot::after { content: ""; position: absolute; left: 3px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.tl .what { padding-left: 6px; }
.tl .what small { display: block; color: var(--muted); font-size: 13px; }
.tl li.gapli .t { font-weight: 500; color: var(--accent); }
.tl li.gapli .dot::after { background: var(--card); border: 2px solid var(--accent); width: 12px; height: 12px; }
.tl li.gapli .what { color: var(--accent); font-size: 14px; }
.tl li.mark .t, .tl li.mark .what { color: var(--muted); }
.tl li.mark .dot::after { background: var(--muted); }
.rows { list-style: none; margin: 8px 0 0; padding: 0; }
.rows li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.rows li:first-child { border-top: 0; }
.rows .v { color: var(--muted); text-align: right; }

/* Formulaire */
.field { display: block; margin: 10px 0; }
.lbl { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
input[type=text], select {
  width: 100%; min-height: 44px; padding: 8px 12px; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; -webkit-appearance: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
input[aria-invalid=true] { border-color: var(--err); }
.err { display: block; color: var(--err); font-size: 13px; margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.act-row { border-top: 1px solid var(--line); padding: 10px 0 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; position: relative; }
.act-row:first-child { border-top: 0; }
.act-row .wide { grid-column: 1 / -1; }
.act-row .first { padding-right: 52px; }
.act-row .err { margin-bottom: 6px; }
.act-row .del { position: absolute; right: 0; top: 30px; }
.act-row[data-mode=free] .timed { display: none; }
#bp-edit .act-row { border-top: 0; padding-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-width: 52px; min-height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button { font: inherit; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--err); }
.btn.small { min-height: 36px; padding: 0 12px; }
.btn:disabled { opacity: .5; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.icon-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 18px; }
.foot { color: var(--muted); font-size: 13px; text-align: center; margin: 18px 0; }
.foot .btn { margin-bottom: 14px; }

/* Barres fixes */
.savebar {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  background: var(--card); border-top: 1px solid var(--line); padding: 8px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 4;
}
.savebar .msg { font-size: 14px; color: var(--muted); }
.savebar .msg.dirty { color: var(--warn-ink); font-weight: 600; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 1fr 1fr;
  background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5;
}
.tabbar button { height: var(--tabbar-h); border: 0; background: none; color: var(--muted); font-size: 15px; }
.tabbar button[aria-selected=true] { color: var(--accent); font-weight: 700; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 76px + env(safe-area-inset-bottom));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 22px; font-size: 14px; z-index: 6; max-width: 90vw;
}
.toast.err { background: var(--err); color: #fff; }

/* Jour */
.daynav { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 10px; gap: 8px; }
.daylabel { font-weight: 700; font-size: 18px; text-align: center; flex: 1; }
.daytools { display: flex; gap: 10px; margin-bottom: 4px; }
.daytools .btn { flex: 1; }
.runbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--accent); color: var(--accent-ink);
  border-radius: 14px; padding: 10px 14px; margin: 10px 0; }
.runbar small { display: block; opacity: .85; }
.runbar .btn { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); font-weight: 600; }
.tlwrap { position: relative; margin: 14px 0 0 46px; }
.tlarea { position: relative; }
.hline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); z-index: 0; }
.hline span { position: absolute; left: -46px; top: -9px; width: 40px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.marker { position: absolute; left: 0; right: 0; border-top: 2px solid var(--muted); font-size: 12px; color: var(--muted); z-index: 1; }
.marker span { position: absolute; right: 0; top: 2px; }
.gap { position: absolute; left: 0; right: 0; border-left: 3px dotted var(--accent); z-index: 1; color: var(--accent); font-size: 12px; padding-left: 8px; display: flex; align-items: center; }
.blk { position: absolute; display: flex; flex-direction: column; justify-content: flex-start; text-align: left; font: inherit; color: var(--ink);
  border: 0; border-radius: 8px; padding: 3px 8px; overflow: hidden; line-height: 1.2; margin: 1px 0; z-index: 2; }
.blk .bn { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .bt { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.short { flex-direction: row; align-items: center; gap: 8px; padding-top: 0; padding-bottom: 0; }
.b-fixed { background: var(--fix); border-left: 4px solid var(--fix-line); }
.b-flex { background: var(--accent-soft); border-left: 4px solid var(--accent); }
.b-free { background: var(--accent-soft); border-left: 4px dashed var(--accent); }
.b-done { opacity: .6; }
.b-done .bn { text-decoration: line-through; }
.b-running { outline: 2px solid var(--accent); }
.hours-help { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
</style>
</head>
<body>
<header class="app-header">
  <h1>Plan du jour</h1>
  <p id="subtitle">Ton plan, recalé selon la réalité.</p>
</header>

<main>
  <section id="panel-day" role="tabpanel" aria-labelledby="tab-day">
    <div id="day-head"></div>
    <form id="block-panel" class="card" hidden novalidate autocomplete="off">
      <h2 id="bp-title">Bloc</h2>
      <div id="bp-edit"></div>
      <p class="help" id="bp-planned"></p>
      <div id="bp-real" class="grid2">
        <label class="field"><span class="lbl">Début réel</span><input type="text" id="bp-real-start" inputmode="numeric" autocomplete="off" placeholder="HH:MM" data-kind="time"></label>
        <label class="field"><span class="lbl">Fin réelle</span><input type="text" id="bp-real-end" inputmode="numeric" autocomplete="off" placeholder="HH:MM" data-kind="time"></label>
      </div>
      <span class="err" id="bp-err" hidden></span>
      <div class="btnrow">
        <button type="submit" class="btn primary" id="bp-save">Enregistrer</button>
        <button type="button" class="btn" data-bp="start" id="bp-start">▶ Démarrer maintenant</button>
        <button type="button" class="btn" data-bp="stop" id="bp-stop">■ Arrêter maintenant</button>
        <button type="button" class="btn" data-bp="clear" id="bp-clear">Effacer les heures réelles</button>
        <button type="button" class="btn" data-bp="close">Fermer</button>
        <button type="button" class="btn danger" data-bp="delete" id="bp-del">Supprimer</button>
      </div>
    </form>
    <div id="day-timeline"></div>
  </section>

  <section id="panel-recap" role="tabpanel" aria-labelledby="tab-recap" hidden></section>

  <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
    <form id="settings-form" novalidate autocomplete="off">
      <div id="form-body"></div>
      <div class="savebar">
        <span class="msg" id="dirty-msg">Aucune modification</span>
        <button type="submit" class="btn primary" id="save-btn">Enregistrer</button>
      </div>
    </form>
  </section>
</main>

<nav class="tabbar" role="tablist" aria-label="Navigation">
  <button type="button" role="tab" id="tab-day" data-tab="day" aria-selected="true">Jour</button>
  <button type="button" role="tab" id="tab-recap" data-tab="recap" aria-selected="false">Récapitulatif</button>
  <button type="button" role="tab" id="tab-settings" data-tab="settings" aria-selected="false">Réglages</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">Cette app a besoin de JavaScript.</p></noscript>

<script>
(function () {
'use strict';

// ==== 1. CONFIG ====
const APP_VERSION = '0.3.0';          // identique à VERSION dans sw.js (CONVENTIONS.md §10)
const DATA_VERSION = 3;               // réglages : 1 = lot 1, 2 = lot 2, 3 = activités uniques
const STORAGE_KEY = 'plandujour.reglages';
const DAYS_KEY = 'plandujour.jours';
const DAYS_VERSION = 2;               // jours : 1 = lot 2, 2 = heures réelles par bloc
const KEEP_DAYS = 400;                // les jours plus anciens sont purgés à l'enregistrement
const DAY_NAMES = ['', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const DAY_SHORT = ['', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
const MODES = { fixed: 'Heure fixe', flex: 'Heure prévue, glisse si retard', free: 'Sans heure (je la lance quand je veux)' };
const MODE_TAG = { fixed: 'heure fixe', flex: 'souple', free: 'sans heure' };

// ==== 2. TEMPS ====
// Minutes depuis minuit en interne ; « HH:MM » en 24 h à l'écran (CONVENTIONS.md §5).
function parseTime(text) {
  if (typeof text !== 'string') return null;
  const t = text.trim().toLowerCase().replace(/\s+/g, '').replace('h', ':');
  const m = /^(\d{1,2}):?(\d{2})?$/.exec(t);
  if (!m) return null;
  const h = Number(m[1]);
  const min = m[2] === undefined ? 0 : Number(m[2]);
  if (h > 23 || min > 59) return null;
  return h * 60 + min;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function formatTime(minutes) { return pad2(Math.floor(minutes / 60)) + ':' + pad2(minutes % 60); }
function formatDuration(minutes) {
  const h = Math.floor(minutes / 60), m = minutes % 60;
  if (h === 0) return m + ' min';
  return m === 0 ? h + ' h' : h + ' h ' + pad2(m);
}
function parseIntStrict(text) {
  const t = String(text).trim();
  return /^\d{1,4}$/.test(t) ? Number(t) : null;
}
function nowMinutes() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }

// ==== 3. VALEURS PAR DÉFAUT ====
function makeAct(id, name, days, mode, entry, start, duration) {
  return { id: id, name: name, days: days, mode: mode, entry: entry, start: start, duration: duration };
}
function defaultSettings() {
  return {
    version: DATA_VERSION,
    wake: 345,            // 05:45
    bedtime: 1320,        // 22:00
    relaxFloor: 30,       // détente minimale avant le coucher, à valider
    activities: [
      makeAct('act-trajet-aller', 'Trajet aller', [1, 2, 3, 4, 5], 'fixed', 'end', 390, 60),        // 06:30–07:30
      makeAct('act-trajet-retour', 'Trajet retour', [1, 2, 3, 4, 5], 'fixed', 'end', 960, 75),      // 16:00–17:15
      makeAct('act-cours-sax', 'Cours de saxophone', [3], 'fixed', 'end', 1140, 60),                 // mercredi 19:00
      makeAct('act-orchestre', 'Orchestre', [5], 'fixed', 'end', 1170, 60),                          // vendredi 19:30
      makeAct('act-sax', 'Saxophone', [1, 2, 4, 6, 7], 'flex', 'duration', 1035, 15),                // 17:15, glisse si retard
      makeAct('act-menage', 'Ménage', [1, 4], 'flex', 'duration', 1050, 30),                         // 17:30, à régler
      makeAct('act-concentration', 'Concentration', [1, 2, 3, 4, 5], 'free', 'duration', null, 90)   // sans heure
    ]
  };
}
function emptyDay() { return { real: {}, ponctuels: [] }; }
function emptyDays() { return { version: DAYS_VERSION, days: {} }; }

// ==== 4. STOCKAGE ====
function isMinute(v) { return Number.isInteger(v) && v >= 0 && v <= 1439; }
function pickInt(v, def, min, max) { return Number.isInteger(v) && v >= min && v <= max ? v : def; }
function newId() { return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function cleanDays(list) {
  return Array.isArray(list) ? Array.from(new Set(list.filter((x) => Number.isInteger(x) && x >= 1 && x <= 7))).sort() : [];
}

function sanitizeActs(list, fallback) {
  if (!Array.isArray(list)) return fallback;
  const out = [];
  list.forEach((a) => {
    if (!a || typeof a.name !== 'string' || !a.name.trim() || !MODES[a.mode]) return;
    if (!Number.isInteger(a.duration) || a.duration < 1 || a.duration > 1440) return;
    const free = a.mode === 'free';
    if (!free && !isMinute(a.start)) return;
    out.push({
      id: typeof a.id === 'string' ? a.id : newId(), name: a.name.trim().slice(0, 40), days: cleanDays(a.days), mode: a.mode,
      entry: a.entry === 'end' ? 'end' : 'duration', start: free ? null : a.start, duration: free ? a.duration : Math.min(a.duration, 1440 - a.start)
    });
  });
  return out;
}

// Migration des réglages des versions 1 et 2 vers la version 3.
function fromOldSettings(raw) {
  const s = defaultSettings();
  const t = raw.times || {};
  const T = (v, d) => (isMinute(v) ? v : d);
  const leave = T(t.leaveHome, 390), home = T(t.homeArrival, 1035);
  const arrMin = t.workArrival && isMinute(t.workArrival.min) ? t.workArrival.min : 450;
  const depMin = t.workDeparture && isMinute(t.workDeparture.min) ? t.workDeparture.min : 960;
  s.wake = T(t.wake, 345);
  s.bedtime = T(t.bedtime, 1320);
  s.relaxFloor = pickInt((raw.relax || {}).floorMinutes, 30, 0, 600);
  const acts = [
    makeAct('act-trajet-aller', 'Trajet aller', [1, 2, 3, 4, 5], 'fixed', 'end', leave, Math.max(1, arrMin - leave)),
    makeAct('act-trajet-retour', 'Trajet retour', [1, 2, 3, 4, 5], 'fixed', 'end', depMin, Math.max(1, home - depMin))
  ];
  (Array.isArray(raw.weeklyEvents) ? raw.weeklyEvents : []).forEach((e) => {
    if (e && typeof e.name === 'string' && Number.isInteger(e.day) && isMinute(e.start)) {
      acts.push(makeAct(typeof e.id === 'string' ? e.id : newId(), e.name, [e.day], 'fixed', 'end', e.start, Number.isInteger(e.duration) && e.duration > 0 ? e.duration : 60));
    }
  });
  const sx = raw.saxophone || {};
  const saxMin = pickInt(sx.minutes, 15, 0, 600);
  if (saxMin > 0) acts.push(makeAct('act-sax', 'Saxophone', cleanDays(sx.days), 'flex', 'duration', home, saxMin));
  const hw = raw.housework || {};
  const hwMin = pickInt(hw.minutes, 30, 0, 600);
  if (hwMin > 0) acts.push(makeAct('act-menage', 'Ménage', [1, 4], 'flex', 'duration', Math.min(1439, home + saxMin), hwMin));
  const blocks = raw.version === 2 && Array.isArray(raw.mobileBlocks) ? raw.mobileBlocks : [{ id: 'act-concentration', name: 'Concentration', minutes: 90 }];
  blocks.forEach((b) => {
    if (b && typeof b.name === 'string' && Number.isInteger(b.minutes)) acts.push(makeAct(typeof b.id === 'string' ? b.id : newId(), b.name, [1, 2, 3, 4, 5], 'free', 'duration', null, b.minutes));
  });
  s.activities = sanitizeActs(acts, s.activities);
  return s;
}

function sanitize(raw) {
  if (!raw || typeof raw !== 'object') return null;
  if (raw.version === 1 || raw.version === 2) return fromOldSettings(raw);
  if (raw.version !== DATA_VERSION) return null;
  const d = defaultSettings();
  const s = defaultSettings();
  s.wake = isMinute(raw.wake) ? raw.wake : d.wake;
  s.bedtime = isMinute(raw.bedtime) ? raw.bedtime : d.bedtime;
  s.relaxFloor = pickInt(raw.relaxFloor, d.relaxFloor, 0, 600);
  s.activities = sanitizeActs(raw.activities, d.activities);
  return s;
}

// Retourne { settings, status } ; status : 'ok' | 'empty' | 'corrupt' | 'unavailable'.
function loadSettings() {
  let text;
  try {
    text = window.localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    return { settings: defaultSettings(), status: 'unavailable' };
  }
  if (text === null) return { settings: defaultSettings(), status: 'empty' };
  try {
    const clean = sanitize(JSON.parse(text));
    if (clean) return { settings: clean, status: 'ok' };
  } catch (e) { /* données illisibles */ }
  return { settings: defaultSettings(), status: 'corrupt' };
}

function saveSettings(settings) {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
    return window.localStorage.getItem(STORAGE_KEY) !== null;
  } catch (e) {
    return false;
  }
}

// ---- Données des jours : heures réelles par bloc et blocs ponctuels ----
function cleanReal(r) {
  if (!r || typeof r !== 'object') return null;
  const s = isMinute(r.start) ? r.start : null;
  let e = isMinute(r.end) ? r.end : null;
  if (s !== null && e !== null && e <= s) e = null;
  return s === null && e === null ? null : { start: s, end: e };
}
function cleanPonctuel(p) {
  if (!p || typeof p.name !== 'string' || !p.name.trim()) return null;
  const mode = MODES[p.mode] ? p.mode : 'fixed';
  if (!Number.isInteger(p.duration) || p.duration < 1 || p.duration > 1440) return null;
  if (mode !== 'free' && !isMinute(p.start)) return null;
  return {
    id: typeof p.id === 'string' ? p.id : newId(), name: p.name.trim().slice(0, 40), mode: mode, entry: p.entry === 'end' ? 'end' : 'duration',
    start: mode === 'free' ? null : p.start, duration: mode === 'free' ? p.duration : Math.min(p.duration, 1440 - p.start)
  };
}
function sanitizeDays(raw) {
  if (!raw || typeof raw !== 'object' || !raw.days || typeof raw.days !== 'object') return null;
  if (raw.version !== 1 && raw.version !== 2) return null;
  const out = emptyDays();
  Object.keys(raw.days).forEach((k) => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    const d = raw.days[k] || {};
    const day = emptyDay();
    if (raw.version === 1) {               // migration : arrivée → fin du trajet aller, départ → début du trajet retour
      if (isMinute(d.arrival)) day.real['act:act-trajet-aller'] = { start: null, end: d.arrival };
      if (isMinute(d.departure)) day.real['act:act-trajet-retour'] = { start: d.departure, end: null };
      (Array.isArray(d.appointments) ? d.appointments : []).forEach((a) => {
        const p = a && cleanPonctuel({ id: a.id, name: a.title, mode: 'fixed', entry: 'duration', start: a.start, duration: a.duration });
        if (p) day.ponctuels.push(p);
      });
    } else {
      if (d.real && typeof d.real === 'object') Object.keys(d.real).forEach((key) => { const r = cleanReal(d.real[key]); if (r) day.real[key] = r; });
      (Array.isArray(d.ponctuels) ? d.ponctuels : []).forEach((p) => { const c = cleanPonctuel(p); if (c) day.ponctuels.push(c); });
    }
    out.days[k] = day;
  });
  return out;
}
function loadDays() {
  let text = null;
  try {
    text = window.localStorage.getItem(DAYS_KEY);
    if (text === null) return emptyDays();
    const clean = sanitizeDays(JSON.parse(text));
    if (clean) return clean;
  } catch (e) { /* illisible */ }
  try { if (text !== null) window.localStorage.setItem(DAYS_KEY + '.sauvegarde', text); } catch (e) { /* ignoré */ }
  return emptyDays();
}
function saveDays(data) {
  try {
    const limit = addDays(dateKey(new Date()), -KEEP_DAYS);
    Object.keys(data.days).forEach((k) => { if (k < limit) delete data.days[k]; });
    window.localStorage.setItem(DAYS_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    return false;
  }
}

// ==== 5. VALIDATION ====
function setPath(obj, path, value) {
  const keys = path.split('.');
  const last = keys.pop();
  keys.reduce((o, k) => o[k], obj)[last] = value;
}

// ==== 5B. PLANNING ====
// Fonctions pures : (réglages, données du jour, jour de semaine, heure actuelle) → journée. Aucun accès au DOM ni au stockage.
function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseDateKey(k) { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(k, n) { const d = parseDateKey(k); d.setDate(d.getDate() + n); return dateKey(d); }
function isoWeekday(k) { const g = parseDateKey(k).getDay(); return g === 0 ? 7 : g; }

// nowMin : minutes actuelles si le jour affiché est aujourd'hui, sinon null.
function buildDay(settings, dayData, weekday, nowMin) {
  const out = { placed: [], pending: [], gaps: [], warnings: [], running: null, largestGap: 0 };
  const items = [];
  settings.activities.forEach((a) => {
    if (a.days.includes(weekday)) items.push({ key: 'act:' + a.id, id: a.id, kind: 'act', name: a.name, mode: a.mode, entry: a.entry, plannedStart: a.mode === 'free' ? null : a.start, minutes: a.duration });
  });
  dayData.ponctuels.forEach((p) => {
    items.push({ key: 'p:' + p.id, id: p.id, kind: 'p', name: p.name, mode: p.mode, entry: p.entry, plannedStart: p.mode === 'free' ? null : p.start, minutes: p.duration });
  });
  const timed = [];
  items.forEach((it) => {
    it.real = dayData.real[it.key] || { start: null, end: null };
    if (it.mode === 'free' && it.real.start === null) out.pending.push(it); else timed.push(it);
  });
  timed.forEach((it) => { it.sortKey = it.real.start !== null ? it.real.start : it.plannedStart; });
  timed.sort((a, b) => a.sortKey - b.sortKey);

  // Placement : un bloc souple glisse après la fin la plus tardive des blocs qui le précèdent.
  let cursor = -1;
  timed.forEach((it) => {
    const r = it.real;
    let start;
    if (r.start !== null) start = r.start;
    else if (it.mode === 'flex') start = Math.max(it.plannedStart, cursor);
    else start = it.plannedStart;
    let end, state;
    if (r.end !== null) { end = r.end; state = 'done'; }
    else if (r.start !== null) {
      if (nowMin !== null) { end = Math.max(start + it.minutes, nowMin); state = 'running'; } else { end = start + it.minutes; state = 'started'; }
    } else { end = start + it.minutes; state = 'planned'; }
    if (end <= start) end = start + 1;
    it.start = start; it.end = end; it.state = state;
    it.shift = it.plannedStart !== null && r.start === null && start > it.plannedStart ? start - it.plannedStart : 0;
    cursor = Math.max(cursor, end);
    if (state === 'running') out.running = it;
  });

  // Temps disponible entre deux blocs (du lever au premier bloc, puis jusqu'au coucher).
  const byStart = timed.slice().sort((a, b) => a.start - b.start || a.end - b.end);
  let prevEnd = settings.wake, prev = null;
  byStart.forEach((it) => {
    if (it.start > prevEnd) out.gaps.push({ from: prevEnd, to: it.start, minutes: it.start - prevEnd, last: false });
    else if (prev && it.start < prevEnd) out.warnings.push('« ' + prev.name + ' » (' + formatTime(prev.start) + '–' + formatTime(prev.end) + ') chevauche « ' + it.name + ' » (' + formatTime(it.start) + '–' + formatTime(it.end) + ').');
    if (it.end > prevEnd || prev === null) { prevEnd = Math.max(prevEnd, it.end); prev = it; }
  });
  if (byStart.length) {
    if (settings.bedtime > prevEnd) {
      out.gaps.push({ from: prevEnd, to: settings.bedtime, minutes: settings.bedtime - prevEnd, last: true });
      if (settings.bedtime - prevEnd < settings.relaxFloor) out.warnings.push('Il ne reste que ' + formatDuration(settings.bedtime - prevEnd) + ' avant le coucher (détente minimale : ' + formatDuration(settings.relaxFloor) + ').');
    } else {
      out.warnings.push('Les blocs vont jusqu’à ' + formatTime(prevEnd) + ', après l’heure du coucher (' + formatTime(settings.bedtime) + ').');
    }
  }
  out.gaps.forEach((g) => { out.largestGap = Math.max(out.largestGap, g.minutes); });
  out.placed = byStart;
  return out;
}

// Répartit en colonnes les blocs qui se chevauchent (affichage uniquement).
function layoutColumns(items) {
  items.sort((a, b) => a.start - b.start || b.end - a.end);
  let cluster = null;
  const clusters = [];
  items.forEach((it) => {
    if (!cluster || it.start >= cluster.end) { cluster = { end: it.end, cols: [], items: [] }; clusters.push(cluster); }
    let c = cluster.cols.findIndex((e) => e <= it.start);
    if (c === -1) { c = cluster.cols.length; cluster.cols.push(0); }
    cluster.cols[c] = it.end;
    it.col = c;
    cluster.end = Math.max(cluster.end, it.end);
    cluster.items.push(it);
  });
  clusters.forEach((cl) => cl.items.forEach((it) => { it.colCount = cl.cols.length; }));
  return items;
}

// Passe de « fin » à « durée » (et inversement) en gardant la même durée.
function convertSecond(row, newEntry) {
  const start = parseTime($('[data-a=start]', row).value);
  const sec = $('[data-a=second]', row);
  if (start === null) return;
  if (newEntry === 'duration') {
    const end = parseTime(sec.value);
    if (end !== null && end > start) sec.value = String(end - start);
  } else {

}
function readActRaw(row) {

// Lit et valide une ligne d'activité ; retourne l'activité ou null (champs invalides marqués).
function readActRow(row, errors) {
  const nameEl = $('[data-a=name]', row), startEl = $('[data-a=start]', row), secEl = $('[data-a=second]', row);
  const mode = $('[data-a=mode]', row).value, entry = $('[data-a=entry]', row).value;
  const before = errors.length;
  const name = nameEl.value.trim();
  if (!name) flag(nameEl, 'Nom obligatoire', errors);
  let start = null, duration = null;
  if (mode === 'free') {
    duration = parseIntStrict(secEl.value);
    if (duration === null || duration < 1 || duration > 1440) flag(secEl, 'Durée entre 1 et 1440 min', errors);
  } else {
    start = parseTime(startEl.value);
    if (start === null) flag(startEl, 'Heure de début invalide (ex. 09:00)', errors);
    if (entry === 'end') {
      const end = parseTime(secEl.value);
      if (end === null) flag(secEl, 'Heure de fin invalide (ex. 10:30)', errors);
      else if (start !== null && end <= start) flag(secEl, 'La fin doit être après le début', errors);
      else if (start !== null) duration = end - start;
    } else {
      duration = parseIntStrict(secEl.value);
      if (duration === null || duration < 1 || duration > 1440) flag(secEl, 'Durée entre 1 et 1440 min', errors);
      else if (start !== null && start + duration > 1440) flag(secEl, 'Dépasse minuit', errors);
    }
  }
  if (errors.length > before) return null;
  return { id: row.dataset.id || newId(), name: name, days: $$('.chip[aria-pressed=true]', row).map((c) => Number(c.dataset.day)), mode: mode, entry: entry, start: start, duration: duration };
}

const PX = 1.5;   // pixels par minute sur la timeline

function fmtDateLabel(k) {
  const s = parseDateKey(k).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function dayNow() { return selectedDate === dateKey(new Date()) ? nowMinutes() : null; }
function buildSelected() { return buildDay(current, daysData.days[selectedDate] || emptyDay(), isoWeekday(selectedDate), dayNow()); }

function renderDay() {
  const build = buildSelected();
  let head = '<div class="daynav"><button type="button" class="icon-btn" data-day-nav="-1" aria-label="Jour précédent">‹</button>' +
    '<div class="daylabel">' + esc(fmtDateLabel(selectedDate)) + '</div>' +

  if (build.running) {
    const r = build.running;
    head += '<div class="runbar"><div><strong>' + esc(r.name) + '</strong><small>en cours depuis ' + formatTime(r.start) + ' · ' + formatDuration(Math.max(0, dayNow() - r.start)) +
      ' (prévu ' + formatDuration(r.minutes) + ')</small></div><button type="button" class="btn" data-action="stop" data-key="' + esc(r.key) + '">■ Arrêter</button></div>';
  }
  if (build.pending.length) {
    head += '<div class="card"><h2>Sans heure</h2><ul class="rows">' + build.pending.map((it) =>
      '<li><span>' + esc(it.name) + ' <span class="v">· ' + formatDuration(it.minutes) + '</span></span><span>' +
      (dayNow() !== null ? '<button type="button" class="btn small primary" data-action="start" data-key="' + esc(it.key) + '">▶ Démarrer</button> ' : '') +
      '<button type="button" class="btn small" data-action="open-block" data-key="' + esc(it.key) + '">Détails</button></span></li>').join('') + '</ul>' +
      '<p class="hours-help">Plus grand temps disponible : ' + formatDuration(build.largestGap) +
      (build.pending.some((it) => it.minutes > build.largestGap) ? ' — au moins un bloc ne tient dans aucun créneau (rien n’est supprimé).' : '.') + '</p></div>';
  }
  if (build.warnings.length) head += '<div class="banner warn"><strong>À vérifier</strong><ul>' + build.warnings.map((w) => '<li>' + esc(w) + '</li>').join('') + '</ul></div>';
  $('#day-head').innerHTML = head;

  // Timeline
  const t = current;
  const items = build.placed.map((b) => Object.assign({}, b));
  let lo = Math.min.apply(null, [t.wake].concat(items.map((b) => b.start)));
  let hi = Math.max.apply(null, [t.bedtime].concat(items.map((b) => b.end)));
  lo = Math.floor(lo / 60) * 60;
  hi = Math.min(1440, Math.ceil(hi / 60) * 60);
  layoutColumns(items);
  const y = (m) => (m - lo) * PX;
  let html = '<div class="tlwrap"><div class="tlarea" style="height:' + (hi - lo) * PX + 'px">';
  for (let m = lo; m <= hi; m += 60) html += '<div class="hline" style="top:' + y(m) + 'px"><span>' + pad2(m / 60) + ':00</span></div>';
  html += '<div class="marker" style="top:' + y(t.wake) + 'px"><span>Lever ' + formatTime(t.wake) + '</span></div>';
  html += '<div class="marker" style="top:' + y(t.bedtime) + 'px"><span>Coucher ' + formatTime(t.bedtime) + '</span></div>';
  build.gaps.forEach((g) => {
    const h = g.minutes * PX;

  });
  items.forEach((b) => {
    const h = Math.max((b.end - b.start) * PX - 2, 22);
    const w = 100 / b.colCount;
    let note = '';
    if (b.state === 'running') note = ' · en cours';
    else if (b.state === 'done') note = ' · terminé';
    if (b.shift) note += ' · décalé de ' + formatDuration(b.shift) + ' (prévu ' + formatTime(b.plannedStart) + ')';
    html += '<button type="button" class="blk b-' + b.mode + (b.state === 'done' ? ' b-done' : '') + (b.state === 'running' ? ' b-running' : '') + (h < 40 ? ' short' : '') +
      '" data-action="open-block" data-key="' + esc(b.key) + '" style="top:' + y(b.start) + 'px;height:' + h + 'px;left:calc(' + b.col * w + '% + 1px);width:calc(' + w + '% - 3px)">' +
      '<span class="bn">' + (b.state === 'done' ? '✓ ' : '') + esc(b.name) + '</span><span class="bt">' + formatTime(b.start) + '–' + formatTime(b.end) + esc(note) + '</span></button>';
  });
  html += '</div></div>';
  $('#day-timeline').innerHTML = html;
}

let toastTimer = null;
function showToast(message, kind) {
  const el = $('#toast');
  el.textContent = message;
  el.className = 'toast' + (kind === 'err' ? ' err' : '');
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

function switchTab(name) {
  $$('.tabbar button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  $('#panel-day').hidden = name !== 'day';
  $('#panel-recap').hidden = name !== 'recap';
  $('#panel-settings').hidden = name !== 'settings';
  $('#subtitle').textContent = { day: 'Ton plan, recalé selon la réalité.', recap: 'Ta semaine type et le temps disponible.', settings: 'Modifie, puis enregistre.' }[name];
  if (name === 'day') renderDay();
  window.scrollTo(0, 0);
}

// ---- Marquage des erreurs de saisie ----
function errHost(el) { return el.closest('.act-row') || el.closest('.field'); }
function clearFlags(root) {
  $$('[aria-invalid]', root).forEach((el) => el.removeAttribute('aria-invalid'));
  $$('.err', root).forEach((el) => { el.textContent = ''; el.hidden = true; });
}
function flag(el, message, errors) {
  el.setAttribute('aria-invalid', 'true');
  const err = errHost(el).querySelector('.err');
  err.textContent = err.textContent ? err.textContent + ' · ' + message : message;
  err.hidden = false;
  errors.push({ el: el, message: message });
}

// Retourne { settings, errors }. Les champs invalides sont marqués dans le formulaire.
function readForm() {
  const form = $('#settings-form');
  clearFlags(form);
  const errors = [];
  const s = defaultSettings();
  const parsed = {};
  $$('[data-kind=time][data-path]', form).forEach((inp) => {
    const v = parseTime(inp.value);
    if (v === null) { flag(inp, 'Heure invalide (ex. 06:53)', errors); return; }
    parsed[inp.dataset.path] = v;
    setPath(s, inp.dataset.path, v);
  });
  $$('[data-kind=int][data-path]', form).forEach((inp) => {
    const min = Number(inp.dataset.min), max = Number(inp.dataset.max);
    const v = parseIntStrict(inp.value);
    if (v === null || v < min || v > max) { flag(inp, 'Nombre entier entre ' + min + ' et ' + max, errors); return; }
    setPath(s, inp.dataset.path, v);
  });
  if (parsed.wake !== undefined && parsed.bedtime !== undefined && parsed.bedtime <= parsed.wake) {
    flag($('[data-path=bedtime]', form), 'Le coucher doit être après le lever', errors);
  }
  s.activities = [];
  $$('#acts-list .act-row', form).forEach((row) => {
    const a = readActRow(row, errors);
    if (a) s.activities.push(a);
  });
  return { settings: s, errors: errors };
}

// ==== 7. ÉVÉNEMENTS ====
let current = null;     // réglages enregistrés (ou valeurs de départ)
let loadStatus = 'empty';
let dirty = false;
let daysData = emptyDays();   // heures réelles et blocs ponctuels, par date
let selectedDate = null;      // « AAAA-MM-JJ » du jour affiché
let panelKey = null;          // clé du bloc ouvert dans le panneau ; null = nouveau bloc ponctuel
let panelOpen = false;

function setDirty(value) {
  dirty = value;
  const msg = $('#dirty-msg');
  msg.textContent = dirty ? 'Modifications non enregistrées' : 'Aucune modification';
  msg.classList.toggle('dirty', dirty);
}

function ensureDay() {
  if (!daysData.days[selectedDate]) daysData.days[selectedDate] = emptyDay();
  return daysData.days[selectedDate];
}
function persistDays() {
  if (!saveDays(daysData)) showToast('Enregistrement impossible sur cet appareil', 'err');
}

// ---- Chrono ----
function startNow(key) {
  const now = dayNow();
  if (now === null) return;
  const day = ensureDay();
  Object.keys(day.real).forEach((k) => {           // un seul bloc en cours à la fois : on arrête les autres
    const r = day.real[k];
    if (k !== key && r.start !== null && r.end === null) r.end = Math.min(1439, Math.max(now, r.start + 1));
  });
  day.real[key] = { start: now, end: null };
  persistDays();
  renderDay();
}
function stopNow(key) {
  const now = dayNow();
  const day = ensureDay();
  const r = day.real[key];
  if (now === null || !r || r.start === null) return;
  r.end = Math.min(1439, Math.max(now, r.start + 1));
  persistDays();
  renderDay();
}

// ---- Panneau d'un bloc (détails, heures réelles, bloc ponctuel) ----
function closePanel() { $('#block-panel').hidden = true; panelOpen = false; panelKey = null; }

function openPanel(key) {
  const form = $('#block-panel');
  const build = buildSelected();
  const it = key ? build.placed.concat(build.pending).find((x) => x.key === key) : null;
  if (key && !it) return;
  panelKey = key;
  panelOpen = true;
  clearFlags(form);
  const isP = !it || it.kind === 'p';
  const today = dayNow() !== null;
  $('#bp-title').textContent = it ? it.name : 'Nouveau bloc ponctuel';
  $('#bp-edit').innerHTML = isP
    ? actRowHtml(actToRaw(it ? { id: it.id, name: it.name, mode: it.mode, entry: it.entry, start: it.plannedStart, duration: it.minutes } :
      { id: newId(), name: '', mode: 'fixed', entry: 'duration', start: null, duration: 60 }), { days: false, del: false })
    : '';
  if (it && it.mode === 'free') { /* durée seule */ }
  $('#bp-planned').textContent = !it ? 'Un bloc ponctuel ne concerne que ce jour.'
    : (it.mode === 'free' ? 'Sans heure · ' + formatDuration(it.minutes) : 'Prévu : ' + formatTime(it.plannedStart) + '–' + formatTime(it.plannedStart + it.minutes) + ' · ' + MODE_TAG[it.mode]) +
      (it.kind === 'act' ? ' · à modifier dans Réglages' : '');
  $('#bp-real').hidden = !it;
  const real = it ? it.real : { start: null, end: null };
  $('#bp-real-start').value = real.start === null ? '' : formatTime(real.start);
  $('#bp-real-end').value = real.end === null ? '' : formatTime(real.end);
  $('#bp-start').hidden = !(it && today && real.start === null);
  $('#bp-stop').hidden = !(it && today && real.start !== null && real.end === null);
  $('#bp-clear').hidden = !(it && (real.start !== null || real.end !== null));
  $('#bp-del').hidden = !(it && isP);
  $('#bp-save').textContent = it ? 'Enregistrer' : 'Ajouter';
  $('#bp-err').hidden = true;
  form.hidden = false;
  form.scrollIntoView({ block: 'center' });
  const first = $('[data-a=name]', form);
  if (first && !it) first.focus();
}

function savePanel() {
  const form = $('#block-panel');
  clearFlags(form);
  const errors = [];
  const build = buildSelected();
  const it = panelKey ? build.placed.concat(build.pending).find((x) => x.key === panelKey) : null;
  const isP = !it || it.kind === 'p';
  let edited = null;
  if (isP) { edited = readActRow($('#bp-edit .act-row'), errors); }
  let rs = null, re = null;
  if (it) {
    const sEl = $('#bp-real-start'), eEl = $('#bp-real-end');
    if (sEl.value.trim() !== '') { rs = parseTime(sEl.value); if (rs === null) flag(sEl, 'Heure invalide', errors); }
    if (eEl.value.trim() !== '') { re = parseTime(eEl.value); if (re === null) flag(eEl, 'Heure invalide', errors); }
    const mode = edited ? edited.mode : it.mode;
    if (rs !== null && re !== null && re <= rs) flag(eEl, 'La fin doit être après le début', errors);
    if (mode === 'free' && re !== null && rs === null) flag(sEl, 'Renseigne aussi le début', errors);
  }
  if (errors.length) {
    const msg = $('#bp-err');
    msg.textContent = 'À corriger : ' + errors.map((e) => e.message.toLowerCase()).join(' ; ') + '.';
    msg.hidden = false;
    return;
  }
  const day = ensureDay();
  let key = panelKey;
  if (isP && edited) {
    const p = { id: edited.id, name: edited.name, mode: edited.mode, entry: edited.entry, start: edited.start, duration: edited.duration };
    if (!it) { day.ponctuels.push(p); key = 'p:' + p.id; }
    else { const i = day.ponctuels.findIndex((x) => 'p:' + x.id === panelKey); if (i >= 0) day.ponctuels[i] = p; }
  }
  if (it && key) { if (rs === null && re === null) delete day.real[key]; else day.real[key] = { start: rs, end: re }; }
  persistDays();
  closePanel();
  renderDay();
}

function bindDayEvents() {
  const panel = $('#panel-day');
  panel.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-day-nav]');
    if (nav) {
      const v = nav.dataset.dayNav;
      selectedDate = v === 'today' ? dateKey(new Date()) : addDays(selectedDate, Number(v));
      closePanel();
      renderDay();
      return;
    }
    const act = e.target.closest('[data-action]');
    if (act) {
      const a = act.dataset.action;
      if (a === 'add-block') openPanel(null);
      else if (a === 'open-block') openPanel(act.dataset.key);
      else if (a === 'start') startNow(act.dataset.key);
      else if (a === 'stop') stopNow(act.dataset.key);
      return;
    }
    const bp = e.target.closest('[data-bp]');
    if (!bp) return;
    const what = bp.dataset.bp;
    if (what === 'close') closePanel();
    else if (what === 'start' && panelKey) { const key = panelKey; closePanel(); startNow(key); }
    else if (what === 'stop' && panelKey) { const key = panelKey; closePanel(); stopNow(key); }
    else if (what === 'clear' && panelKey) { delete ensureDay().real[panelKey]; persistDays(); closePanel(); renderDay(); }
    else if (what === 'delete' && panelKey) {
      const day = ensureDay();
      day.ponctuels = day.ponctuels.filter((p) => 'p:' + p.id !== panelKey);
      delete day.real[panelKey];
      persistDays();
      closePanel();
      renderDay();
    }
  });
  panel.addEventListener('change', (e) => {
    const row = e.target.closest('#bp-edit .act-row');
    if (!row) return;
    if (e.target.matches('[data-a=entry]')) convertSecond(row, e.target.value);
    if (e.target.matches('[data-a=mode],[data-a=entry]')) updateRowUi(row);
  });
  panel.addEventListener('focusin', (e) => {
    const el = e.target;
    if (el.matches && el.matches('[data-kind]')) setTimeout(() => { try { el.select(); } catch (x) { /* ignoré */ } }, 0);
  });
  panel.addEventListener('focusout', (e) => {
    const el = e.target;
    if (el.matches && el.matches('[data-kind=time]')) { const v = parseTime(el.value); if (v !== null) el.value = formatTime(v); }
  });
  $('#block-panel').addEventListener('submit', (e) => { e.preventDefault(); savePanel(); });
}

function bindEvents() {
  bindDayEvents();
  const form = $('#settings-form');

  $$('.tabbar button').forEach((b) => b.addEventListener('click', () => switchTab(b.dataset.tab)));
  $('#panel-recap').addEventListener('click', (e) => {
    const b = e.target.closest('[data-recap-day]');
    if (b) { recapDay = Number(b.dataset.recapDay); renderRecap(current, loadStatus); }
  });

  form.addEventListener('input', () => setDirty(true));
  form.addEventListener('change', (e) => {
    const row = e.target.closest('.act-row');
    if (row) {
      if (e.target.matches('[data-a=entry]')) convertSecond(row, e.target.value);
      if (e.target.matches('[data-a=mode],[data-a=entry]')) updateRowUi(row);
    }
    setDirty(true);
  });
  form.addEventListener('focusin', (e) => {
    const el = e.target;
    if (el.matches && el.matches('[data-kind]')) setTimeout(() => { try { el.select(); } catch (x) { /* ignoré */ } }, 0);
  });
  form.addEventListener('focusout', (e) => {          // remet l'heure en HH:MM
    const el = e.target;
    if (el.matches && el.matches('[data-kind=time]')) {
      const v = parseTime(el.value);
      if (v !== null) el.value = formatTime(v);
    }
  });

  form.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (chip) {
      chip.setAttribute('aria-pressed', String(chip.getAttribute('aria-pressed') !== 'true'));
      setDirty(true);
      return;
    }
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'add-act') {
      const raws = $$('#acts-list .act-row').map(readActRaw);
      raws.push({ id: newId(), name: '', mode: 'fixed', entry: 'duration', days: [1, 2, 3, 4, 5], start: '', second: '30' });
      $('#acts-list').innerHTML = raws.map((r) => actRowHtml(r, { days: true, del: true })).join('');
      const names = $$('#acts-list [data-a=name]');
      names[names.length - 1].focus();
      setDirty(true);
    } else if (action === 'del-act') {
      const row = btn.closest('.act-row');
      const raws = $$('#acts-list .act-row').map(readActRaw).filter((r) => r.id !== row.dataset.id);
      $('#acts-list').innerHTML = raws.map((r) => actRowHtml(r, { days: true, del: true })).join('');
      setDirty(true);
    } else if (action === 'reset') {
      if (window.confirm('Remplacer les champs par les valeurs de départ ? Rien ne sera enregistré avant que tu appuies sur « Enregistrer ».')) {
        renderForm(defaultSettings());
        setDirty(true);
      }
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const result = readForm();
    if (result.errors.length) {
      showToast(result.errors.length + ' champ(s) à corriger', 'err');
      const first = result.errors[0].el;
      first.scrollIntoView({ block: 'center' });
      first.focus();
      return;
    }
    if (!saveSettings(result.settings)) {
      showToast('Enregistrement impossible sur cet appareil', 'err');
      return;
    }
    current = result.settings;
    loadStatus = 'ok';
    renderForm(current);
    renderRecap(current, loadStatus);
    renderDay();
    setDirty(false);
    showToast('Enregistré');
  });
}

// ==== 8. INIT ====
function init() {
  const loaded = loadSettings();
  current = loaded.settings;
  loadStatus = loaded.status;
  daysData = loadDays();
  selectedDate = dateKey(new Date());
  recapDay = isoWeekday(selectedDate);
  renderForm(current);
  renderRecap(current, loadStatus);
  setDirty(false);
  bindEvents();
  switchTab('day');
  // Un bloc en cours fait glisser la suite : on rafraîchit la vue du jour toutes les 15 secondes.
  setInterval(() => {
    if (!$('#panel-day').hidden && !panelOpen && dayNow() !== null && buildSelected().running) renderDay();
  }, 15000);
  window.PDJ = { buildDay: buildDay, defaultSettings: defaultSettings, emptyDay: emptyDay, parseTime: parseTime, formatTime: formatTime };   // point d'accès pour les tests
  const isLocal = ['localhost', '127.0.0.1', ''].includes(location.hostname);
  if ('serviceWorker' in navigator && (!isLocal || /[?&]sw=1/.test(location.search))) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* hors ligne indisponible, sans gravité */ });
  }
}
init();

})();
